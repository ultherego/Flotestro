# An example inventory. The panel and repository addresses are shared by the
# fleet, while the site and the environment may differ between host groups.
[flotestro_agents]
web-042.example.com
db-011.example.com

[flotestro_agents:vars]
flotestro_api_url=https://panel.example.com
flotestro_agent_enrollment_url=https://panel.example.com:8444
flotestro_agent_gateway_urls=["https://panel.example.com:8443"]
flotestro_repo_url=https://repo.example.com
flotestro_agent_site=warsaw
flotestro_agent_environment=production
