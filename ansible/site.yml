---
# Deploying the agent onto the fleet.
#
#   ansible-playbook -i inventory.ini site.yml \
#       -e flotestro_automation_api_token="$TOKEN"
#
# The administrative token is given from outside and never recorded in the
# repository.
- name: Flotestro agent
  hosts: flotestro_agents
  become: true
  roles:
    - flotestro_agent
