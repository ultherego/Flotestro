syntax = "proto3";

package flotestro.helper.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/ultherego/flotestro/internal/genproto/flotestro/helper/v1;helperv1";

// Protokol miedzy nieuprzywilejowanym agentem a helperem roota.
// Helper nasluchuje wylacznie na gniezdzie unixowym i nigdy nie rozmawia
// z centrala. Kontrakt jest celowo maly: to jedyna droga do uprawnien roota.

// PROTOCOL_VERSION zmienia sie przy kazdej niezgodnej zmianie kontraktu.
// Helper odrzuca wersje, ktorej nie zna, zamiast zgadywac znaczenie pol.
message HelperRequest {
  uint32 protocol_version = 1;
  string task_id = 2;
  // Helper odrzuca zadanie po terminie, niezaleznie od tego, co twierdzi agent.
  google.protobuf.Timestamp expires_at = 3;
  uint32 timeout_seconds = 4;
  uint32 max_output_bytes = 5;

  oneof action {
    UnitActionRequest unit_action = 20;
    PackageActionRequest package_action = 21;
    RebootRequest reboot = 22;
    IdentityProbeRequest identity_probe = 23;
    DomainEnrollRequest domain_enroll = 24;
    LocalAccountsRequest local_accounts = 25;
    LocalUserActionRequest local_user_action = 26;
    PackageRepairRequest package_repair = 27;
  }
}

// LocalAccountsRequest odczytuje te dane o kontach, ktore wymagaja roota:
// stan blokady z /etc/shadow i klucze SSH z katalogow domowych.
message LocalAccountsRequest {
  repeated string names = 1;
}

// LocalUserActionRequest zmienia konto lokalne na hoscie.
message LocalUserActionRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_CREATE = 1;
    OPERATION_LOCK = 2;
    OPERATION_UNLOCK = 3;
    OPERATION_SET_SSH_KEYS = 4;
  }
  Operation operation = 1;
  string name = 2;
  string gecos = 3;
  string shell = 4;
  repeated string groups = 5;
  // Klucze publiczne w postaci pelnej. Klucz prywatny nigdy nie trafia
  // do systemu, a hasla nie sa przesylane w ogole.
  repeated string ssh_keys = 6;
  // CreateHome tworzy katalog domowy przy zakladaniu konta.
  bool create_home = 7;
}

// DomainEnrollRequest dolacza hosta do domeny. Wymaga roota, bo zmienia
// konfiguracje SSSD, Kerberosa i PAM.
message DomainEnrollRequest {
  string domain = 1;
  string realm = 2;
  string server = 3;
  string one_time_password = 4;
  string hostname = 5;
  bool preflight_only = 6;
}

// IdentityProbeRequest odczytuje te elementy stanu domeny, ktore wymagaja
// roota: keytab hosta i baze cache SSSD. Reszte agent czyta sam.
message IdentityProbeRequest {
  string domain = 1;
}

// RebootRequest zleca kontrolowany restart hosta.
message RebootRequest {
  uint32 delay_seconds = 1;
  string reason = 2;
}

// PackageActionRequest obejmuje operacje pakietowe wymagajace roota.
// Planowanie w trybie symulacji nie wymaga roota i nie idzie przez helper.
message PackageActionRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    // Odswiezenie metadanych repozytorium.
    OPERATION_REFRESH = 1;
    // Wykonanie transakcji aktualizacji.
    OPERATION_UPGRADE = 2;
  }
  Operation operation = 1;
  // Pusta lista przy OPERATION_UPGRADE oznacza wszystkie aktualizacje.
  repeated string packages = 2;
  bool security_only = 3;
}

message UnitActionRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_START = 1;
    OPERATION_STOP = 2;
    OPERATION_RESTART = 3;
    OPERATION_RELOAD = 4;
  }
  string unit = 1;
  Operation operation = 2;
}

message HelperResponse {
  bool accepted = 1;
  // Stabilny kod maszynowy: unknown_action, unsupported_version, expired,
  // protected_unit, invalid_unit, locked, exec_failed, timeout.
  string error_code = 2;
  string message = 3;
  int32 exit_code = 4;
  bytes stdout = 5;
  bytes stderr = 6;
  bool output_truncated = 7;
  UnitState state_before = 8;
  UnitState state_after = 9;
  PackageActionResult package_result = 10;
  IdentityProbeResult identity_result = 11;
  DomainEnrollResult enroll_result = 12;
  LocalAccountsResult accounts_result = 13;
  PackageRepairResponse repair_result = 14;
}

message LocalAccountsResult {
  repeated LocalAccountDetail accounts = 1;
  string unavailable_reason = 2;
}

message LocalAccountDetail {
  string name = 1;
  optional bool locked = 2;
  repeated LocalSSHKey ssh_keys = 3;
  optional bool password_set = 4;
}

message LocalSSHKey {
  string fingerprint = 1;
  string type = 2;
  string comment = 3;
}

message DomainEnrollResult {
  repeated EnrollCheck checks = 1;
  bool enrolled = 2;
  string host_principal = 3;
  repeated EnrollCheck verifications = 4;
}

message EnrollCheck {
  string name = 1;
  optional bool passed = 2;
  string detail = 3;
  bool blocking = 4;
}

message IdentityProbeResult {
  string host_principal = 1;
  optional uint32 keytab_kvno = 2;
  optional uint64 cache_age_seconds = 3;
  optional bool sssd_online = 4;
  repeated string config_issues = 5;
  // Powod, dla ktorego czesci stanu nie udalo sie ustalic.
  string unavailable_reason = 6;
}

message PackageActionResult {
  string manager = 1;
  repeated PackageVersionChange applied = 2;
  bool reboot_required = 3;
  repeated string services_needing_restart = 4;
  // Prawda, gdy baza pakietow wymaga naprawy po nieudanej transakcji.
  bool package_database_broken = 5;
  // Pakiety, ktore czekaja na dokonczenie konfiguracji albo sa uszkodzone.
  repeated string packages_needing_attention = 6;
}

// PackageRepairRequest odblokowuje operacje pakietowe. Odpowiedzi na pytania
// konfiguracyjne pochodza od operatora i sa ustawiane przed dokonczeniem
// konfiguracji pakietow.
message PackageRepairRequest {
  repeated DebconfSelection answers = 1;
}

message DebconfSelection {
  string package = 1;
  string question = 2;
  string type = 3;
  string value = 4;
}

message PackageRepairResponse {
  string manager = 1;
  repeated BlockedPackageDetail still_blocked = 2;
  repeated string answered = 3;
  bool repaired = 4;
}

message BlockedPackageDetail {
  string name = 1;
  string status = 2;
  repeated DebconfQuestionDetail questions = 3;
}

message DebconfQuestionDetail {
  string name = 1;
  string value = 2;
  optional bool answered = 3;
}

message PackageVersionChange {
  string name = 1;
  string version_before = 2;
  string version_after = 3;
}

message UnitState {
  string name = 1;
  string load_state = 2;
  string active_state = 3;
  string sub_state = 4;
  string unit_file_state = 5;
  string result = 6;
  uint32 main_pid = 7;
  uint32 n_restarts = 8;
}
