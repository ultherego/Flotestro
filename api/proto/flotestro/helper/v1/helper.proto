syntax = "proto3";

package flotestro.helper.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/ultherego/flotestro/internal/genproto/flotestro/helper/v1;helperv1";

// The protocol between the unprivileged agent and the root helper. The
// helper listens only on a unix socket and never talks to the centre. The
// contract is deliberately small: it is the only way to root privileges.

// PROTOCOL_VERSION changes at every incompatible change of the contract.
// The helper rejects a version it does not know instead of guessing the
// meaning of the fields.
message HelperRequest {
  uint32 protocol_version = 1;
  string task_id = 2;
  // The helper rejects a job past its deadline, regardless of what the
  // agent claims.
  google.protobuf.Timestamp expires_at = 3;
  uint32 timeout_seconds = 4;
  uint32 max_output_bytes = 5;

  oneof action {
    UnitActionRequest unit_action = 20;
    PackageActionRequest package_action = 21;
    RebootRequest reboot = 22;
    IdentityProbeRequest identity_probe = 23;
    DomainEnrollRequest domain_enroll = 24;
    LocalAccountsRequest local_accounts = 25;
    LocalUserActionRequest local_user_action = 26;
    PackageRepairRequest package_repair = 27;
    // A read of the container engine state. The agent does not get the
    // Docker socket: membership in the docker group is equivalent to root,
    // so a process running without privileges must not have it.
    DockerReadRequest docker_read = 29;
    // The engine event log: a separate request, because it has its own time
    // window and its own limits. An endless read would stay on the host
    // forever.
    DockerEventsRequest docker_events = 48;
    // An operation on the container engine. The scope is enumerated, not
    // given by a path: the helper does not relay an arbitrary Engine API
    // call.
    DockerActionRequest docker_action = 30;
    // A Compose project: a plan or a deployment. The manifest comes in the
    // body, not as a path on the host - the operator approved the content.
    ComposeRequest compose = 31;
    LogFileRequest log_file = 32;
    ProcessSignalRequest process_signal = 33;
    ScheduleRequest schedule = 34;
    NetworkRequest network = 35;
    DnsRequest dns = 36;
    FirewallRequest firewall = 37;
    StorageRequest storage = 38;
    SshRequest ssh = 39;
    KernelRequest kernel = 40;
    FileRequest file = 41;
    TimeRequest time = 42;
    ShutdownRequest shutdown = 43;
    SecurityRequest security = 44;
    CertificateRequest certificate = 45;
    RepositoryRequest repository = 46;
    BackupRequest backup = 47;
    // A bounded read of one container's log. Separate from the engine
    // read: it has its own line and byte limits, and a target of its own.
    DockerLogsRequest docker_logs = 49;
    // Renaming the host: hostnamectl plus the entries of /etc/hosts that
    // name the old hostname.
    HostnameRequest hostname = 50;
    // The end of the host's membership in the fleet: the identity and the
    // journal are removed and the agent service is disabled. The agent is
    // unprivileged and cannot do any of it itself.
    FinalWipeRequest final_wipe = 51;
    // Leaving the directory domain. The answer travels in enroll_result
    // with enrolled = false: the checks before and the verifications after
    // have the same shape as the join's, so the panel reads one shape.
    DomainLeaveRequest domain_leave = 52;
    // The platform facts and the sudo policy only root can read: the DMI
    // serial numbers and the UUID, and /etc/sudoers with its drop-ins.
    // The scope is a closed list of facts, not a path.
    SystemRequest system = 53;
    // Renewing a service keytab: ipa-getkeytab into the host's own keytab
    // file, with the host's own credentials. The directory has already
    // retired the old key; nothing is issued or carried by the panel.
    KeytabRenewRequest keytab_renew = 54;
    // The keyring of the helper: the host identifier and the public keys
    // of the panel that sign capabilities. The first bundle on a host with
    // an empty keyring is taken on trust at enrollment; every later one
    // has to be signed by a key the helper already trusts.
    HelperTrustUpdateRequest trust_update = 55;
    // A declared container, network or volume: the plan of one, or the
    // change that brings the host to it. Separate from DockerActionRequest,
    // whose operations name one object and do one thing to it; this one
    // carries a description and computes the difference itself.
    DockerEnsureRequest docker_ensure = 56;
  }
  // Progress of a long operation. A client that does not ask for it gets
  // one answer as before - an older agent must not take a progress message
  // for the operation result.
  bool want_progress = 28;

  // The proof that the panel authorized this very operation on this very
  // host: a capability signed by the control plane and the canonical
  // payload it binds. SO_PEERCRED says which local user is asking; the
  // capability says the panel approved what is asked. An agent from before
  // the capability sends none, and the helper's mode decides whether that
  // is still allowed. The fields are optional additions to the version 1
  // contract, so the protocol version does not change.
  HelperCapability capability = 60;
  bytes capability_signature = 61;
  bytes canonical_payload = 62;
}

// HelperCapability is the panel's authorization of one operation on one
// host. The control plane signs its deterministic byte form with Ed25519;
// the agent cannot mint one, because it never holds the signing key, and
// cannot alter one, because the signature covers every field.
message HelperCapability {
  // The layout version of the capability; the helper refuses one it does
  // not know instead of guessing the meaning of the fields.
  uint32 schema_version = 1;
  // The identifier of the control plane key that signed the capability.
  string key_id = 2;
  // A UUID the audit trail carries on both sides.
  string capability_id = 3;
  // The host the capability is for, compared with the root-owned host
  // identity on the host rather than with what the agent says.
  string host_id = 4;
  string task_id = 5;
  // The operation type of the registry, e.g. unit.restart.
  string action_type = 6;
  // The SHA-256 of the canonical payload, 32 bytes.
  bytes payload_sha256 = 7;
  int64 not_before_unix = 8;
  int64 expires_unix = 9;
  // 32 random bytes; the helper remembers each one it consumed.
  bytes nonce = 10;
  uint64 policy_revision = 11;
  // The grants the creator of the task held that matter to the operation,
  // e.g. schedule.root.exec for a root cron entry.
  repeated string grants = 12;
}

// HelperTrustKey is one public key of the control plane.
message HelperTrustKey {
  // The first 16 hex characters of the SHA-256 of the raw public key.
  string key_id = 1;
  // The raw Ed25519 public key, 32 bytes.
  bytes public_key = 2;
}

// HelperTrustBundle is the complete set of the panel's capability keys
// together with the host's identifier, signed by the panel. The helper
// replaces its keyring with the set: a key missing from the bundle is a
// key the panel retired.
message HelperTrustBundle {
  string host_id = 1;
  repeated HelperTrustKey keys = 2;
  int64 issued_unix = 3;
  // The key that signed the bundle; it has to be one the helper trusts,
  // or one of the bundle itself on a host without a keyring yet.
  string signed_by_key_id = 4;
  bytes signature = 5;
}

// HelperTrustUpdateRequest hands the helper the bundle the panel returned
// at enrollment or at a certificate renewal.
message HelperTrustUpdateRequest {
  HelperTrustBundle bundle = 1;
}

// HelperTrustResult says what the keyring holds after the update.
message HelperTrustResult {
  string host_id = 1;
  repeated string key_ids = 2;
  // Changed says whether the update wrote anything; a repeated hand-over
  // of the same bundle changes nothing.
  bool changed = 3;
}

// LocalAccountsRequest reads the account data that requires root: the lock
// state from /etc/shadow and the SSH keys from the home directories.
message LocalAccountsRequest {
  repeated string names = 1;
}

// LocalUserActionRequest changes a local account on the host.
message LocalUserActionRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_CREATE = 1;
    OPERATION_LOCK = 2;
    OPERATION_UNLOCK = 3;
    OPERATION_SET_SSH_KEYS = 4;
    // The complete list of supplementary groups; an empty list takes every
    // supplementary group away.
    OPERATION_SET_GROUPS = 5;
    // The expiry date of the account; an empty date clears it.
    OPERATION_SET_EXPIRY = 6;
    // Deleting the account, optionally with its home directory.
    OPERATION_DELETE = 7;
    // The keys edited one at a time: an add appends what is not there, a
    // remove takes named fingerprints away, a replace writes the list
    // anew bound to the fingerprints the operator saw. SET_SSH_KEYS is
    // the replace under its old name, kept one release.
    OPERATION_ADD_SSH_KEYS = 8;
    OPERATION_REMOVE_SSH_KEYS = 9;
    OPERATION_REPLACE_SSH_KEYS = 10;
  }
  Operation operation = 1;
  string name = 2;
  string gecos = 3;
  string shell = 4;
  repeated string groups = 5;
  // Public keys in full form for a create or a replace. A private key
  // never reaches the system, and passwords are not sent at all.
  repeated string ssh_keys = 6;
  // CreateHome creates the home directory when creating the account.
  bool create_home = 7;
  // ExpiresAt is the expiry date as YYYY-MM-DD; empty clears the expiry.
  string expires_at = 8;
  // RemoveHome deletes the home directory together with the account.
  bool remove_home = 9;
  // Keys are the keys an add appends.
  repeated LocalSSHKeyInput keys = 10;
  // Fingerprints names the keys a remove takes away.
  repeated string fingerprints = 11;
  // IgnoreMissing lets a remove pass over a fingerprint the account does
  // not have.
  bool ignore_missing = 12;
  // ExpectedFingerprints is the list the operator saw when ordering a
  // replace; a replace is refused as stale when the account has another
  // list. The old SET_SSH_KEYS verifies it only when it is not empty.
  repeated string expected_fingerprints = 13;
  // AllowLockout permits taking the last key of an account with no
  // password login.
  bool allow_lockout = 14;
  // ManagedFile edits the panel's file under /etc/ssh/authorized_keys.d;
  // refused when sshd does not read it.
  bool managed_file = 15;
  // System says the order means a system account; without it an account
  // outside the UID range of people is refused.
  bool system = 16;
  // Inactive: a create with no key, made locked so nobody enters.
  bool inactive = 17;
}

// LocalSSHKeyInput is one key to add.
message LocalSSHKeyInput {
  string public_key = 1;
  string comment = 2;
}

// DomainEnrollRequest joins the host to the domain. Requires root, because
// it changes the SSSD, Kerberos and PAM configuration.
message DomainEnrollRequest {
  string domain = 1;
  string realm = 2;
  string server = 3;
  string one_time_password = 4;
  string hostname = 5;
  bool preflight_only = 6;
}

// DomainLeaveRequest takes the host out of the domain with
// ipa-client-install --uninstall. No credential is needed: the host
// unenrolls itself with its own keytab. The domain and the realm name what
// the operator meant to leave; a host in another domain refuses the order.
message DomainLeaveRequest {
  string domain = 1;
  string realm = 2;
}

// IdentityProbeRequest reads the elements of the domain state that require
// root: the host keytab, the SSSD cache database and the SSSD configuration.
// The agent reads the rest itself.
message IdentityProbeRequest {
  string domain = 1;
}

// RebootRequest orders a controlled reboot of the host.
message RebootRequest {
  uint32 delay_seconds = 1;
  string reason = 2;
}

// ShutdownRequest powers the host off. The delay gives the agent time to
// send the result back before the host disappears from the network.
message ShutdownRequest {
  uint32 delay_seconds = 1;
  string reason = 2;
  string mode = 3;
  bool ignore_inhibitors = 4;
}

message PowerResult {
  bytes snapshot = 1;
  string message = 2;
  bytes inhibitors = 3;
  string scheduled_at = 4;
}

// PackageActionRequest covers the package operations that require root.
// Planning in simulation mode requires no root and does not go through the
// helper.
message PackageActionRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    // A refresh of the repository metadata.
    OPERATION_REFRESH = 1;
    // Carrying out an update transaction.
    OPERATION_UPGRADE = 2;
    // Adding packages to the host.
    OPERATION_INSTALL = 3;
    // Removing packages together with their dependants.
    OPERATION_REMOVE = 4;
    // Holding or releasing package updates.
    OPERATION_HOLD = 5;
  }
  Operation operation = 1;
  // An empty list with OPERATION_UPGRADE means all updates.
  repeated string packages = 2;
  bool security_only = 3;
  // The removal set approved by the operator. The host computes it again
  // right before the operation: a difference means a different set would be
  // removed.
  repeated string expected_removals = 4;
  // The desired hold value. The operation describes a state, not a toggle.
  bool hold = 5;
  // Consent to install a version older than the installed one. Package
  // managers refuse that by default and rightly so: a downgrade is
  // sometimes irreversible for the data format. Only an operation that
  // names the version explicitly enables it - such as replacing the agent
  // with the rollback version.
  bool allow_downgrade = 6;
  // The approved plan the transaction is bound to. The helper computes the
  // plan again under the package lock right before the transaction,
  // rebuilds the envelope with this header and compares the digest: a
  // difference is stale_plan, another planner version replan_required, a
  // plan past its expiry plan_expired. With a digest the transaction runs
  // on the exact specs of the plan computed then - never on names the
  // tool resolves anew. Without a digest the operation is a legacy one
  // and runs as before.
  bytes plan_hash = 7;
  uint32 plan_schema_version = 8;
  string planner_version = 9;
  string plan_host_id = 10;
  string plan_inventory_revision = 11;
  string plan_resource_revision = 12;
  int64 plan_expires_at_unix = 13;
  // The elements the operator approved, so a refusal names the one that
  // moved rather than two digests.
  repeated PackageExactSpec exact_specs = 14;
  // The artefact of the agent release the order names. The helper fetches
  // exactly this file, checks it against the digest before anything is
  // installed, and installs that file rather than resolving the version
  // from the repository a second time. Empty leaves the old path.
  string package_sha256 = 15;
  // The version to keep an artefact of locally before the replacement, so
  // the host can go back without the repository. Empty means no prepared
  // return.
  string rollback_version = 16;
  // Fetch the artefact, check it and keep the prepared return - and stop
  // there. The host is already at the ordered version and only the order
  // itself is being proven; nothing is installed.
  bool verify_only = 17;
  // The key the artefact must carry the signature of, as an OpenPGP
  // fingerprint or a long key ID. Empty leaves the old path.
  string package_signer = 18;
  // Drop what the host kept so that it could go back; nothing is installed.
  bool release_rollback = 19;
}

// PackageExactSpec is one approved element of a package plan: the exact
// version, architecture and origin of one package and the direction of
// its change.
message PackageExactSpec {
  string name = 1;
  string current_version = 2;
  string candidate_version = 3;
  string architecture = 4;
  string origin = 5;
  // install, upgrade, downgrade or remove.
  string action = 6;
}

message UnitActionRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_START = 1;
    OPERATION_STOP = 2;
    OPERATION_RESTART = 3;
    OPERATION_RELOAD = 4;
    // Enabling and masking change what the host does after a reboot, not
    // its state now.
    OPERATION_ENABLE = 5;
    OPERATION_DISABLE = 6;
    OPERATION_MASK = 7;
    OPERATION_UNMASK = 8;
    // Clearing the failed state: no process is touched, only the record.
    OPERATION_RESET_FAILED = 9;
  }
  string unit = 1;
  Operation operation = 2;
}

message HelperResponse {
  bool accepted = 1;
  // A stable machine code: unknown_action, unsupported_version, expired,
  // protected_unit, invalid_unit, locked, exec_failed, timeout.
  string error_code = 2;
  string message = 3;
  int32 exit_code = 4;
  bytes stdout = 5;
  bytes stderr = 6;
  bool output_truncated = 7;
  UnitState state_before = 8;
  UnitState state_after = 9;
  PackageActionResult package_result = 10;
  IdentityProbeResult identity_result = 11;
  DomainEnrollResult enroll_result = 12;
  LocalAccountsResult accounts_result = 13;
  PackageRepairResponse repair_result = 14;
  // The progress of an operation in flight. A progress message is not the
  // final answer: the client keeps reading until it gets final = true.
  TaskProgress progress = 15;
  bool final = 16;
  DockerReadResult docker_result = 17;
  DockerActionResult docker_action_result = 18;
  ComposeResult compose_result = 19;
  LogFileResult log_file_result = 20;
  ProcessSignalResult process_signal_result = 21;
  ScheduleResult schedule_result = 22;
  NetworkResult network_result = 23;
  DnsResult dns_result = 24;
  FirewallResult firewall_result = 25;
  StorageResult storage_result = 26;
  SshResult ssh_result = 27;
  KernelResult kernel_result = 28;
  FileResult file_result = 29;
  TimeResult time_result = 30;
  PowerResult power_result = 31;
  SecurityResult security_result = 32;
  CertificateResult certificate_result = 33;
  RepositoryResult repository_result = 34;
  BackupResult backup_result = 35;
  DockerEventsResult docker_events_result = 36;
  DockerLogsResult docker_logs_result = 37;
  HostnameResult hostname_result = 38;
  SmartResult smart_result = 39;
  FinalWipeResult final_wipe_result = 40;
  SystemResult system_result = 41;
  KeytabRenewResult keytab_renew_result = 42;
  HelperTrustResult trust_result = 43;
  // The capability mode the helper runs in - observe, prefer or enforce -
  // reported with every answer, so the agent can tell the panel what the
  // host does. A helper from before the capability leaves it empty.
  string capability_mode = 44;
  // The capability the helper verified for this answer; empty for a
  // request that carried none.
  string capability_id = 45;
  DockerEnsureResult docker_ensure_result = 46;
}

// DockerEnsureRequest carries the description of one declared object and
// what is to happen to it.
//
// The description comes in the body as the containers module writes it,
// not as a ready Engine API request: the helper runs as root and reads the
// description with the module's own code, which refuses what the panel
// refuses. The secret values come in beside it and are in no record.
message DockerEnsureRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_PLAN = 1;
    OPERATION_CONTAINER_ENSURE = 2;
    OPERATION_NETWORK_ENSURE = 3;
    OPERATION_NETWORK_REMOVE = 4;
    OPERATION_VOLUME_ENSURE = 5;
    OPERATION_VOLUME_REMOVE = 6;
  }
  Operation operation = 1;
  // Kind is container, network or volume; name is the object a removal or
  // a plan of one is about.
  string kind = 2;
  string name = 3;
  bytes spec = 4;
  // The hash of the approved plan. The helper computes the plan again
  // under its own lock and refuses with stale_plan when it moved.
  string plan_digest = 5;
  bool force = 6;
  // The values of the variables the description names as secrets, by
  // variable name. They live for the moment of the call and reach neither
  // the journal nor the result.
  map<string, bytes> env_values = 7;
}

message DockerEnsureResult {
  // The plan or the outcome in JSON form. The structure belongs to the
  // containers module; the helper contract does not repeat it.
  bytes payload = 1;
  string unavailable_reason = 2;
}

// SystemRequest names the facts of the system module the helper is to
// read. The agent reads the rest of the platform picture itself; only
// what the kernel refuses to an unprivileged reader comes here.
message SystemRequest {
  enum Fact {
    FACT_UNSPECIFIED = 0;
    // The product serial number, the board and chassis serial numbers and
    // the product UUID from /sys/class/dmi/id.
    FACT_DMI_IDENTITY = 1;
    // The local sudo policy: /etc/sudoers and every file it includes,
    // parsed into rules with their file and line.
    FACT_SUDOERS = 2;
  }
  repeated Fact facts = 1;
}

message SystemResult {
  // Dmi is the JSON supplement of the system module; sudoers the JSON
  // snapshot of the sudoers module. Each is present only when asked for.
  bytes dmi = 1;
  bytes sudoers = 2;
}

// DockerReadRequest describes what to read from the engine. The scope is
// enumerated, not given by a path: passing a path to the Engine API would
// mean any of its operations can be called through the helper.
message DockerReadRequest {
  enum Scope {
    SCOPE_UNSPECIFIED = 0;
    // The summary for the inventory: light, computed in the inventory cycle.
    SCOPE_SUMMARY = 1;
    // The full state on the operator's demand, when they open the tab.
    SCOPE_FULL = 2;
  }
  Scope scope = 1;
}

// DockerActionRequest describes one operation on the engine.
message DockerActionRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_START = 1;
    OPERATION_STOP = 2;
    OPERATION_RESTART = 3;
    OPERATION_REMOVE = 4;
    OPERATION_PULL_IMAGE = 5;
    OPERATION_PRUNE = 6;
  }
  Operation operation = 1;
  // The container identifier; hexadecimal only, checked before sending and
  // checked again here.
  string container_id = 2;
  uint32 timeout_seconds = 3;
  bool remove_volumes = 4;
  string image_reference = 5;
  // The objects to remove at cleanup. The list is explicit: a cleanup by
  // filter would also remove what the operator did not see.
  repeated string image_ids = 6;
  repeated string volume_names = 7;
  repeated string network_ids = 8;
}

message DockerActionResult {
  // The container state before and after, in JSON form. Recorded also on
  // failure: without it there is no knowing what managed to change.
  bytes before = 1;
  bytes after = 2;
  repeated string removed = 3;
  optional int64 reclaimed_bytes = 4;
  string image_digest = 5;
}

// ScheduleRequest describes an operation on a scheduled job. A managed
// entry describes a desired state, not a command to run once.
message ScheduleRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_ENSURE = 1;
    OPERATION_DISABLE = 2;
    OPERATION_REMOVE = 3;
    OPERATION_RUN_NOW = 4;
    // A read of the host schedules.
    OPERATION_READ = 5;
  }
  Operation operation = 1;
  string id = 2;
  string expression = 3;
  repeated string command = 4;
  string user = 5;
  string comment = 6;
  bool enabled = 7;
  // Taking over an entry found on the host. Without it the panel does not
  // overwrite work nobody brought into the panel.
  bool adopt = 8;
  // Kind names the mechanism a managed entry is written with: "cron" for a
  // file in /etc/cron.d, "timer" for a pair of systemd units, "any" to let
  // the host pick the one it has. Empty means cron, so a panel from before
  // the timers orders exactly what it ordered before.
  string kind = 9;
}

message ScheduleResult {
  // The schedule state in JSON form. The structure belongs to the schedules
  // module; the helper contract does not repeat it.
  bytes snapshot = 1;
  string message = 2;
}

// NetworkRequest describes a change of the host network configuration.
//
// Every change is armed with a rollback: the helper records the state from
// before the change and starts a local timer that restores that state. Only
// the agent's confirmation that the host still talks to the panel disarms
// the timer.
message NetworkRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    // A read of the NetworkManager profiles together with their settings.
    OPERATION_READ = 1;
    OPERATION_SET_MTU = 2;
    OPERATION_ENSURE_ROUTES = 3;
    OPERATION_APPLY_PROFILE = 4;
    // Disarming the rollback after a successful connectivity confirmation.
    OPERATION_CONFIRM = 5;
    // An immediate rollback of the change on the operator's demand.
    OPERATION_ROLLBACK = 6;
    // The change plan without touching the host: the difference between the
    // found and the requested profile. The helper recognises the kind of
    // change by the fields: method names an address profile, routes the
    // routes, mtu the MTU alone, link the layering.
    OPERATION_PLAN = 7;
    // A layered interface: a bond, a bridge or a VLAN built or changed,
    // and one taken away. They are separate from a profile change because
    // the mechanisms write them differently - one adds an interface to the
    // document, the other takes an entry out of it - and because a
    // mechanism that cannot express a bond has to refuse rather than write
    // half of one.
    OPERATION_APPLY_LINK = 8;
    OPERATION_REMOVE_LINK = 9;
  }
  Operation operation = 1;
  // The interface the change concerns. The helper finds the NetworkManager
  // profile itself: the panel describes the interface, because that is what
  // the operator sees.
  string interface = 2;
  string mtu = 3;
  repeated string routes = 4;
  string method = 5;
  repeated string addresses = 6;
  string gateway = 7;
  repeated string dns = 8;
  // Seconds until the rollback. Zero means the helper's default, not no
  // rollback: a network change without a rescue timer is not possible here.
  uint32 rollback_seconds = 9;
  // The rollback plan identifier for a confirmation or a rollback.
  string rollback_id = 10;
  string reason = 11;
  // The fingerprint of the plan the operator agreed to. The helper computes
  // the plan once more against the profile it has now: a different
  // fingerprint means the host changed since planning and the change would
  // enter a state other than the one looked at.
  string plan_hash = 12;
  // The second family, held to the same standard as the first: a method of
  // its own, addresses with their prefix length, a default gateway that
  // may be link-local, and the two switches the mechanisms expose. An
  // empty method leaves the family as the host has it.
  string method6 = 13;
  repeated string addresses6 = 14;
  string gateway6 = 15;
  // AcceptRa is off, on or on-forwarding; privacy is off, prefer-public or
  // prefer-temporary. A mechanism that cannot express one of them refuses
  // the setting by name instead of quietly leaving it out.
  string accept_ra = 16;
  string privacy = 17;
  // The layering ordered by OPERATION_APPLY_LINK, and by OPERATION_PLAN
  // when the plan is about a layer.
  NetworkLink link = 18;
  // LinkRemove marks the plan of a removal. The removal itself is its own
  // operation and names the interface in the interface field; the plan
  // needs the flag, because a removal is refused for the reverse of the
  // reasons a creation is and the operator has to see those first.
  bool link_remove = 19;
  // The address the host reaches the panel from, as the agent knows it.
  // The helper marks the management interface from it and refuses a layer
  // that would swallow it. The helper does not guess this: a wrong guess
  // here ends with the host enslaving the interface the order arrived
  // through.
  string management_address = 20;
}

// NetworkLink describes a layered interface: a bond, a bridge or a VLAN.
//
// It is the target state of one link, never the commands to reach it: the
// same description is what the plan compares against, what the mechanism
// writes and what the verifier reads back.
message NetworkLink {
  string name = 1;
  // Kind is bond, bridge or vlan.
  string kind = 2;
  // The interfaces the bond or the bridge is built from. A VLAN has none:
  // its one lower interface is the parent.
  repeated string members = 3;
  // The bond settings. MiimonMs zero means the link monitoring is off,
  // which is a decision and not a missing value.
  string mode = 4;
  uint32 miimon_ms = 5;
  string primary = 6;
  string lacp_rate = 7;
  // The bridge settings.
  bool stp = 8;
  bool vlan_filtering = 9;
  // The VLAN settings.
  string parent = 10;
  uint32 vlan_id = 11;
  string protocol = 12;
  // Mtu is text, because auto is an equal value here.
  string mtu = 13;
}

message NetworkResult {
  // The profile state in JSON form. The structure belongs to the network
  // module.
  bytes profiles = 1;
  string message = 2;
  // The identifier of the armed rollback. Empty means an operation that
  // armed nothing.
  string rollback_id = 3;
  // The moment the rollback runs at if nobody disarms it.
  string rollback_deadline = 4;
  // Confirmed says whether the rollback was disarmed.
  bool confirmed = 5;
  // The change plan in JSON form for OPERATION_PLAN. The structure belongs
  // to the network module.
  bytes plan = 6;
}

// DnsRequest changes the host resolver.
//
// The change goes through the connection profile, not through a write to
// resolv.conf: a file owned by resolved or NetworkManager gets overwritten
// anyway at the next network event, so a write into it would vanish on its
// own.
message DnsRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_APPLY = 1;
    // The resolver change plan without touching the host.
    OPERATION_PLAN = 2;
  }
  Operation operation = 1;
  string interface = 2;
  repeated string servers = 3;
  repeated string search_domains = 4;
  // IgnoreAutoDns rejects the servers given by DHCP. Without it the panel's
  // servers and the provider's servers end up in one list, and the operator
  // does not know which one answered.
  bool ignore_auto_dns = 5;
  uint32 rollback_seconds = 6;
  // The fingerprint of the plan the operator agreed to; the helper computes
  // the plan once more against the profile it has now.
  string plan_hash = 7;
}

message DnsResult {
  bytes profiles = 1;
  string message = 2;
  string rollback_id = 3;
  string rollback_deadline = 4;
  bool confirmed = 5;
  // The change plan in JSON form for OPERATION_PLAN.
  bytes plan = 6;
}

// FirewallRequest describes an operation on the host firewall.
//
// The panel changes only its own nftables table or a firewalld zone:
// foreign chains are rewritten without it, so a rule in them vanishes
// without a trace.
message FirewallRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_READ = 1;
    OPERATION_RULE_ENSURE = 2;
    OPERATION_RULE_REMOVE = 3;
    OPERATION_ZONE_PORT = 4;
    OPERATION_ZONE_SERVICE = 5;
    // Restoring the panel rule state from before the change.
    OPERATION_RESTORE = 6;
    OPERATION_CONFIRM = 7;
    // Computing the difference between the found and the requested rule. It
    // changes nothing: it answers what would happen and against which
    // ruleset.
    OPERATION_PLAN = 8;
  }
  Operation operation = 1;
  // The rule as fields the panel understands. Raw nft notation is not
  // accepted: the host would execute anything that can be written in it.
  string rule_id = 2;
  string chain = 3;
  string action = 4;
  string protocol = 5;
  repeated string ports = 6;
  repeated string sources = 7;
  string interface = 8;
  string comment = 9;
  // The zone and the service concern hosts with firewalld.
  string zone = 10;
  string service = 11;
  bool enable = 12;
  // The address and port of the management channel. A rule covering them
  // would cut the panel off from the host - and then there is nothing to
  // undo the change with.
  string management_address = 13;
  uint32 management_port = 14;
  // BreakGlass overrides the management channel protection. It requires an
  // explicit operator decision, because the result is sometimes a host one
  // has to drive to.
  bool break_glass = 15;
  uint32 rollback_seconds = 16;
  string rollback_id = 17;
  // The fingerprint of the ruleset the change was ordered against.
  string expected_hash = 18;
}

message FirewallResult {
  // The firewall state in JSON form. The structure belongs to the firewall
  // module.
  bytes snapshot = 1;
  string message = 2;
  string rollback_id = 3;
  string rollback_deadline = 4;
  bool confirmed = 5;
  // Plan describes the difference between the found and the requested rule,
  // in JSON.
  bytes plan = 6;
}

// StorageRequest describes an operation on the host storage.
//
// A device is named by path together with an expected identifier: the
// /dev/sdX name depends on the detection order and after a reboot can point
// at a different disk. In a destructive operation that is the difference
// between the right disk and somebody else's data.
message StorageRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    // A read of the LVM groups and volumes. The LVM tools require root.
    OPERATION_READ_LVM = 1;
    OPERATION_MOUNT_ENSURE = 2;
    OPERATION_MOUNT_REMOVE = 3;
    OPERATION_FS_CHECK = 4;
    OPERATION_LVM_EXTEND = 5;
    OPERATION_FS_RESIZE = 6;
    OPERATION_FS_CREATE = 7;
    OPERATION_DISK_WIPE = 8;
    // Computing the difference between the found and the requested mount.
    // It changes nothing and resolves the source to the UUID of the
    // filesystem this host has.
    OPERATION_MOUNT_PLAN = 9;
    // The plan of a check or an extension of a filesystem or a volume,
    // without touching the host. The kind is named by the plan field.
    OPERATION_DEVICE_PLAN = 10;
    // The SMART health and attributes of the named device. A read that
    // takes no guard.
    OPERATION_SMART_READ = 11;
    // The software arrays of the host: the kernel's own list out of
    // /proc/mdstat completed with what the superblock carries. The detail
    // needs root, which is why the read is here; it takes no guard,
    // because it changes nothing.
    OPERATION_READ_RAID = 12;
    // The member operations of an array that exists. Creating an array and
    // destroying one are deliberately absent: that is a decision about a
    // machine's whole disk layout, taken when the machine is built, not an
    // operation run over a running fleet.
    OPERATION_RAID_MEMBER_FAIL = 13;
    OPERATION_RAID_MEMBER_REMOVE = 14;
    OPERATION_RAID_MEMBER_ADD = 15;
    // LVM beyond growing a volume: a new volume in an existing group, a new
    // disk under a group, a snapshot and its removal, and the removal of a
    // volume, which deletes what stood on it.
    OPERATION_LVM_LV_CREATE = 16;
    OPERATION_LVM_LV_REMOVE = 17;
    OPERATION_LVM_VG_EXTEND = 18;
    OPERATION_LVM_SNAPSHOT_CREATE = 19;
    OPERATION_LVM_SNAPSHOT_REMOVE = 20;
  }
  Operation operation = 1;
  string source = 2;
  string target = 3;
  string fs_type = 4;
  string options = 5;
  // Persist records the entry in /etc/fstab. Without it the mount vanishes
  // after a reboot, and the operator is to know that, not discover it after
  // an outage.
  bool persist = 6;
  string device = 7;
  // ExpectedUuid binds the operation to a specific filesystem.
  string expected_uuid = 8;
  // Repair enables a repair instead of a bare check.
  bool repair = 9;
  // The device identity the plan expects. The path alone is not enough:
  // /dev/sdb after a reboot can be a different disk than the one the
  // operator looked at - and when formatting that is the difference
  // between an empty disk and somebody else's data.
  string expected_serial = 10;
  uint64 expected_size_bytes = 11;
  // Size is the volume increment, e.g. "+10G" or "+100%FREE".
  string size = 12;
  string label = 13;
  // Plan names the kind of the planned device operation: check, resize or
  // lvm_extend.
  string plan = 14;
  // The fingerprint of the plan the operator agreed to; the helper computes
  // it once more.
  string plan_hash = 15;
  // The stable identity of the device a destructive operation binds to: the
  // /dev/disk/by-id link and the WWN the plan was computed for. The helper
  // reads the device again under the storage lock and refuses without a
  // by-id link (stable_identity_required), on a different link, WWN or
  // serial (disk_changed) and on a device that carries root, mounted
  // partitions or a volume group member (disk_in_use). The size is never an
  // identity.
  string expected_by_id = 16;
  string expected_wwn = 17;
  // The software array a member operation acts on, and the identity out of
  // its superblock. /dev/md0 is whichever array the kernel assembled first
  // this boot; the UUID is the same array on every boot, so the helper
  // compares it under the storage guard before touching a member. The
  // member travels in device with the by-id link above.
  string array = 18;
  string expected_array_uuid = 19;
  // The LVM volume group an operation acts in, and its identity: a group
  // name can be given to another group after a rename, a UUID cannot.
  string group = 20;
  string expected_group_uuid = 21;
  // The name of the logical volume being created, and the identity of the
  // volume an operation removes or takes a snapshot of.
  string volume = 22;
  string expected_volume_uuid = 23;
}

message StorageResult {
  // The storage state in JSON form. The structure belongs to the module.
  bytes snapshot = 1;
  string message = 2;
  // Output carries the output of the filesystem check tool.
  string output = 3;
  // Plan describes the difference between the found and the requested
  // mount, in JSON.
  bytes plan = 4;
}

// SshRequest describes an operation on the sshd server.
//
// The configuration goes into its own file in sshd_config.d, not into
// sshd_config: the main file belongs to the distribution and the host
// administrator.
message SshRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_READ = 1;
    OPERATION_APPLY = 2;
    OPERATION_ROTATE_HOSTKEY = 3;
    // The change plan without touching the host: the difference between
    // what the server applies and the order.
    OPERATION_PLAN = 4;
  }
  Operation operation = 1;
  string port = 2;
  string permit_root_login = 3;
  string password_authentication = 4;
  string pubkey_authentication = 5;
  string kbd_interactive_authentication = 6;
  string max_auth_tries = 7;
  repeated string allow_users = 8;
  repeated string allow_groups = 9;
  repeated string deny_users = 10;
  // AllowLockout allows writing a configuration after which no working
  // authentication method remains. It requires an explicit operator
  // decision.
  bool allow_lockout = 11;
  // KeyType names the host key to rotate, e.g. "ed25519".
  string key_type = 12;
  // The fingerprint of the plan the operator agreed to. The helper computes
  // the plan once more against the state it has now.
  string plan_hash = 13;
}

message SshResult {
  // The sshd state in JSON form. The structure belongs to the module.
  bytes snapshot = 1;
  string message = 2;
  // Mismatches lists the settings that did not take effect despite the
  // write: in sshd the first value wins, so an earlier file may shadow
  // ours. Silence here would be a false success.
  repeated string mismatches = 3;
  // The change plan in JSON form for OPERATION_PLAN.
  bytes plan = 4;
}

// SecurityRequest reads the host security state or switches SELinux.
//
// The read goes through the helper, because almost everything in it
// requires root: the AppArmor profiles lie in securityfs, the audit rules
// are read by auditctl, the EFI variables are readable only by root, and
// the socket owners are seen only by whoever sees other people's processes.
message SecurityRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    // A read of the enumerated facts. The helper has no "read a file" nor
    // "run a command" operation: it gets a list of fact names it knows how
    // to gather.
    OPERATION_FACTS = 1;
    OPERATION_SELINUX_MODE = 2;
    // Reloading the audit rules from the files into the kernel. A separate
    // operation, because the auditd unit on some distributions refuses a
    // manual restart.
    OPERATION_AUDIT_RELOAD = 3;
  }
  // Fact enumerates what cannot be read without root. The rest of the
  // picture the agent composes itself, without going through the helper.
  enum Fact {
    FACT_UNSPECIFIED = 0;
    FACT_APPARMOR_PROFILES = 1;
    FACT_AUDIT_RULES = 2;
    FACT_SECURE_BOOT = 3;
    FACT_SOCKET_OWNERS = 4;
  }
  Operation operation = 1;
  string mode = 2;
  repeated Fact facts = 3;
}

message SecurityResult {
  // Facts carries only what was asked for - not the whole host picture.
  bytes facts = 1;
  string message = 2;
}

// BackupRequest drives the backup tool on the host.
//
// The credentials arrive here as values - the agent fetched them from the
// store right before the operation - and go to the tool through the
// environment, not as an argument. A process command line is readable in
// /proc by every user of the host.
message BackupRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_PLAN = 1;
    OPERATION_RUN = 2;
    OPERATION_VERIFY = 3;
    OPERATION_RESTORE = 4;
  }
  Operation operation = 1;
  string id = 2;
  string tool = 3;
  string repository = 4;
  repeated string paths = 5;
  repeated string excludes = 6;
  repeated string tags = 7;
  int32 keep_last = 8;
  int32 keep_daily = 9;
  int32 keep_weekly = 10;
  int32 keep_monthly = 11;
  bool prune = 12;
  string runbook = 13;
  // Initialize is consent to initialise the repository at the first copy.
  bool initialize = 21;
  // Password and env carry the values from the store; they live in the
  // helper's memory for the duration of the operation and reach neither
  // the result nor the journal.
  bytes password = 14;
  map<string, bytes> env = 15;
  bool read_data = 16;
  string snapshot_id = 17;
  string target = 18;
  repeated string include = 19;
  string overwrite = 20;
  // Plan names the kind of the planned operation: run or verify. Empty with
  // OPERATION_PLAN means a read of the repository state.
  string plan = 23;
  // The fingerprint of the plan the operator agreed to; the helper computes
  // it once more.
  string plan_hash = 22;
}

message BackupResult {
  bytes state = 1;
  bytes outcome = 2;
  string message = 3;
  // The backup plan in JSON form for OPERATION_PLAN with a scope. The
  // repository password is not in it.
  bytes plan = 4;
  // Verified says that after the copy the host checked the repository. A
  // copy without a check is not a success.
  bool verified = 5;
  // TargetEntries counts what lies under the restore target once the
  // restore is over, read by the part of the host that may look: a
  // restore writes as root into a directory the agent often cannot open,
  // and a verifier that reads "permission denied" would call a restore
  // that worked unverified. TargetRead says the count was taken at all;
  // without it the count is no answer, not zero.
  int64 target_entries = 6;
  bool target_read = 7;
}

// RepositoryRequest writes or removes a package source.
//
// There is no read here: the source files are public and the agent reads
// them. The helper gets the write - because the source directory belongs to
// root - and the password the agent fetched from the store right before the
// operation.
message RepositoryRequest {
  string id = 1;
  string name = 2;
  string url = 3;
  repeated string suites = 4;
  repeated string components = 5;
  repeated string architectures = 6;
  bool enabled = 7;
  int32 priority = 8;
  string gpg_key = 9;
  bool allow_unsigned = 10;
  string username = 11;
  // Password comes from the store through the agent, lives in the helper's
  // memory for the duration of the operation and goes only into a file with
  // root permissions.
  bytes password = 12;
  // SecretName is written into the source file as a comment: the panel is
  // to see which secret the password comes from. The name, not the value.
  string secret_name = 13;
  bool remove = 14;
}

message RepositoryResult {
  bytes snapshot = 1;
  string message = 2;
  string gpg_key_fingerprint = 3;
  bool rolled_back = 4;
}

// CertificateTarget points at a certificate file and the key that belongs
// to it.
message CertificateTarget {
  string path = 1;
  string key_path = 2;
  string service = 3;
}

// CertificateRequest reads facts about certificates or deploys a new one.
//
// There is no full read here: the certificate content is read by the agent,
// because the file is public. The helper gets what cannot be seen without
// root - the key permissions, the certmonger requests and files closed to
// everybody but the service.
message CertificateRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    // A read of the enumerated facts. The helper has no "read a file" nor
    // "run a command" operation: it gets a list of fact names and a list of
    // targets.
    OPERATION_FACTS = 1;
    OPERATION_DEPLOY = 2;
    OPERATION_RENEW = 3;
    // The deployment plan without touching the host and without reaching
    // for the private key.
    OPERATION_PLAN = 4;
    // The trust store: the plan of an authority rotation step and the step
    // itself. The anchor is public material, so it travels in the order in
    // the clear.
    OPERATION_TRUST_PLAN = 5;
    OPERATION_TRUST_ENSURE = 6;
    OPERATION_TRUST_REMOVE = 7;
  }
  // Fact enumerates what cannot be read without root.
  enum Fact {
    FACT_UNSPECIFIED = 0;
    FACT_KEY_METADATA = 1;
    FACT_RENEWAL_TRACKING = 2;
    FACT_CERTIFICATE_FILES = 3;
  }
  Operation operation = 1;
  repeated Fact facts = 2;
  repeated CertificateTarget targets = 3;
  string path = 4;
  string key_path = 5;
  // Certificate is the public content of the certificate together with its
  // chain.
  bytes certificate = 6;
  // Key is the private key content. It comes from the store through the
  // agent right before the operation, lives in the helper's memory for its
  // duration and reaches no file other than the one that is to be created.
  bytes key = 7;
  string owner = 8;
  string group = 9;
  string mode = 10;
  string key_mode = 11;
  string reload_unit = 12;
  string probe_target = 13;
  string request = 14;
  // Authoritative says the target list is the panel's full list for this
  // host. The helper remembers it, so that the inventory describes the same
  // files also when the panel is not asking right now - just like with
  // managed files. Without it the tab would show the state from before the
  // last change of the panel configuration.
  bool authoritative = 15;
  // KeySecretRef names the key secret in the form "name#version". The name
  // alone, never the value: the plan is to say where the host takes the key
  // from.
  string key_secret_ref = 16;
  // The fingerprint of the plan the operator agreed to; the helper computes
  // it once more.
  string plan_hash = 17;
  // AnchorId names the panel anchor in the host trust store.
  string anchor_id = 18;
}

message CertificateResult {
  // Facts carries only what was asked for.
  bytes facts = 1;
  string message = 2;
  string fingerprint_sha256 = 3;
  string not_after = 4;
  bytes probe = 5;
  bool rolled_back = 6;
  // The deployment plan in JSON form for OPERATION_PLAN. The private key is
  // not in it.
  bytes plan = 7;
  // Trust carries the host trust store in JSON form: the panel anchors and
  // those the host administrator put there themselves.
  bytes trust = 8;
}

// TimeRequest changes the time sources or the host time zone.
//
// There is no read here: the time state is read by the agent, because
// timedatectl and chronyc answer everybody, and every passage through root
// has to be justified.
message TimeRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_CONFIG_APPLY = 1;
    OPERATION_TIMEZONE_SET = 2;
    // The time source change plan without touching the host.
    OPERATION_PLAN = 3;
  }
  Operation operation = 1;
  repeated string servers = 2;
  string timezone = 3;
  // AllowStep is the operator's consent to step the clock. Without it the
  // host rejects a change that would move the time back by more than the
  // threshold.
  bool allow_step = 4;
  // EnableDropin is consent to append the source directory to the main
  // file.
  bool enable_dropin = 5;
  // The fingerprint of the plan the operator agreed to; the helper computes
  // it once more.
  string plan_hash = 6;
}

message TimeResult {
  bytes snapshot = 1;
  string message = 2;
  bytes probes = 3;
  // The change plan in JSON form for OPERATION_PLAN.
  bytes plan = 4;
}

// KernelRequest describes an operation on the kernel settings.
//
// The panel changes settings from specific branches of /proc/sys and writes
// them into its own file: an arbitrary write to /proc/sys also covers the
// switches that disable kernel protections or halt the host.
message KernelRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_READ = 1;
    OPERATION_SYSCTL_ENSURE = 2;
    OPERATION_MODULE_LOAD = 3;
    OPERATION_MODULE_BLACKLIST = 4;
    // The module blacklist plan without touching the host.
    OPERATION_MODULE_PLAN = 5;
  }
  Operation operation = 1;
  map<string, string> settings = 2;
  // Keys names additional keys to read beyond the profile.
  repeated string keys = 3;
  string module = 4;
  // Blacklist says whether the module is to be blacklisted or unblacklisted.
  bool blacklist = 5;
  // The fingerprint of the plan the operator agreed to; the helper computes
  // it once more.
  string plan_hash = 6;
}

message KernelResult {
  bytes snapshot = 1;
  string message = 2;
  // PendingReboot lists the settings written persistently that the kernel
  // did not accept right away. The write and the effect are two different
  // things.
  repeated string pending_reboot = 3;
  // AppliedRuntime lists the settings that already apply now.
  repeated string applied_runtime = 4;
  // The module blacklist plan in JSON form for OPERATION_MODULE_PLAN.
  bytes plan = 5;
}

// FileRequest describes an operation on a configuration file.
//
// This is not a root file manager: the path scope is enumerated, and the
// password hash file, a private key and a sudo rule are never editable.
message FileRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_READ = 1;
    OPERATION_ENSURE = 2;
    OPERATION_REMOVE = 3;
    // A read of the state of the files the panel already wrote.
    OPERATION_LIST = 4;
    // Computing the difference between the found and the requested state.
    // It changes nothing: it answers what would happen and what it depends
    // on.
    OPERATION_PLAN = 5;
  }
  Operation operation = 1;
  string path = 2;
  bytes content = 3;
  string mode = 4;
  string owner = 5;
  string group = 6;
  // ExpectedSha256 binds the write to the content the operator looked at.
  // One that disagrees with the host state stops the write instead of
  // overwriting somebody else's change.
  string expected_sha256 = 7;
  string validator = 8;
  // FromSecret means content that comes from the secret store. The helper
  // records that in its registry and stops reporting the digest of such a
  // file: for a short value the digest alone is a hint.
  bool from_secret = 9;
  // AllowMissingValidator says the order may go on when the validator is
  // not installed. The helper honours it only together with the grant
  // file.write.unvalidated in the capability.
  bool allow_missing_validator = 10;
  // VersionSha256 names a content the host itself kept before an earlier
  // write took its place. The helper then writes that copy instead of the
  // content field, through the same staging and the same validator. A
  // digest this host never kept is refused with file_version_unknown
  // rather than answered with the newest copy.
  string version_sha256 = 11;
}

message FileResult {
  bytes snapshot = 1;
  string message = 2;
  // Content is the file content on a read, and the content that was put
  // back on a return to a version the host kept - the panel has no copy of
  // such a version and would otherwise hold a digest it cannot show.
  bytes content = 3;
  string sha256 = 4;
  bool truncated = 5;
  // ValidatorOutput carries the result of the content check. Empty means a
  // file the panel knows no check for - and that too is an answer.
  string validator_output = 6;
  // Plan describes the difference between the found and the requested
  // state, in JSON. A separate field, because the plan concerns a change
  // that has not happened yet, and the other fields describe what the host
  // has now.
  bytes plan = 7;
  // Change describes what the write really did, in JSON and in the same
  // terms as the plan: both digests, the inode before and after, the
  // identity of the check that ran, the version that was kept and what
  // needs a reload afterwards. An operator who approved a whole state is
  // answered with a whole state.
  bytes change = 8;
}

// ProcessSignalRequest sends a signal to a process. The start time binds the
// request to a specific process, because the kernel reuses PID numbers.
message ProcessSignalRequest {
  int32 pid = 1;
  uint64 expected_start_ticks = 2;
  string signal = 3;
}

message ProcessSignalResult {
  int32 pid = 1;
  string signal = 2;
}

// LogFileRequest reads a file from the host administrator's allowlist. The
// path is not arbitrary: the helper resolves it against its own scope, not
// the request body.
message LogFileRequest {
  string path = 1;
  uint32 lines = 2;
}

message LogFileResult {
  string path = 1;
  repeated string lines = 2;
  bool truncated = 3;
  int64 size_bytes = 4;
  // What bounds the read. The operator is to know why they do not see
  // something.
  string allowlist = 5;
}

message ComposeRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_PLAN = 1;
    OPERATION_DEPLOY = 2;
  }
  Operation operation = 1;
  string project = 2;
  string manifest = 3;
  // The hash of the approved plan. A deployment without it has no basis.
  string plan_digest = 4;
  // The image digests the plan resolved, by service name. The deployment
  // resolves the tags once more right before "up" and refuses with
  // stale_plan when any moved; the containers run image@sha256, never the
  // tag as it resolves at that moment.
  map<string, string> image_digests = 5;
}

message ComposeResult {
  // The plan or the deployment result in JSON form. The structure belongs
  // to the containers module; the helper contract does not repeat it.
  bytes payload = 1;
  string unavailable_reason = 2;
}

// DockerEventsRequest describes a closed window of reading the event log.
// The helper does not accept a filter as a ready Engine API query: the
// event kinds are named, and the window and limits enumerated.
message DockerEventsRequest {
  uint32 since_seconds = 1;
  uint32 follow_seconds = 2;
  repeated string types = 3;
  uint32 max_events = 4;
}

message DockerEventsResult {
  bytes events = 1;
  bool truncated = 2;
  string truncated_reason = 3;
  string unavailable_reason = 4;
}

// DockerLogsRequest reads the tail of one container's log.
message DockerLogsRequest {
  // The container identifier or name. Checked here again: the value lands
  // in the path of an Engine API request.
  string container_id = 1;
  uint32 lines = 2;
  string since = 3;
  bool timestamps = 4;
}

message DockerLogsResult {
  string container_id = 1;
  string container_name = 2;
  repeated string lines = 3;
  bool truncated = 4;
  string truncated_reason = 5;
  string unavailable_reason = 6;
}

// HostnameRequest renames the host with hostnamectl and rewrites the
// entries of /etc/hosts that name the old hostname.
message HostnameRequest {
  string hostname = 1;
  string pretty = 2;
}

message HostnameResult {
  string previous = 1;
  string current = 2;
  bool changed = 3;
  bool hosts_file_updated = 4;
}

// FinalWipeRequest ends the host's membership in the fleet. The helper
// removes the identity store and the idempotency journal of the agent,
// disables flotestro-agent.service and schedules its stop for after the
// reply - the agent has to hear the answer before its process ends. The
// request names no path: the helper runs as root and removes only what it
// knows to be the agent's.
message FinalWipeRequest {
  string reason = 1;
}

message FinalWipeResult {
  // The paths that were removed, so the agent can log what is gone.
  repeated string removed = 1;
  bool service_disabled = 2;
  bool stop_scheduled = 3;
}

// KeytabRenewRequest fetches a new key of a service principal into
// /etc/krb5.keytab with ipa-getkeytab, authenticated with the host's own
// keytab. The file is always the host's own: the request names no path.
// The old key is already retired in the directory, so ipa-getkeytab
// issuing a new one is the only thing that brings the service back.
message KeytabRenewRequest {
  // The principal, service/host.example.test with an optional realm.
  string principal = 1;
}

// KeytabRenewResult says what klist -k reported for the principal before
// and after the fetch. The key version number is the proof: a fetch that
// left the number where it was replaced nothing. Zero before means the
// principal had no key in the file yet; kvno_before_known says whether
// the number was read at all, because unknown is not zero.
message KeytabRenewResult {
  string principal = 1;
  bool kvno_before_known = 2;
  uint32 kvno_before = 3;
  uint32 kvno_after = 4;
}

// SmartResult carries what smartctl reports about one device. A device
// the tool cannot read reports unsupported with the tool's own message.
message SmartResult {
  string device = 1;
  string model = 2;
  string serial = 3;
  string health = 4;
  string health_reason = 5;
  optional int32 temperature_c = 6;
  optional uint64 power_on_hours = 7;
  optional uint64 reallocated_sectors = 8;
  optional uint64 pending_sectors = 9;
  optional uint32 wear_percent = 10;
  repeated SmartAttribute attributes = 11;
  bool unsupported = 12;
  string unsupported_reason = 13;
  string output = 14;
}

message SmartAttribute {
  uint32 id = 1;
  string name = 2;
  uint32 value = 3;
  uint32 worst = 4;
  uint32 threshold = 5;
  uint64 raw = 6;
  string raw_string = 7;
  bool failing = 8;
}

message DockerReadResult {
  // The engine state in JSON form. The structure belongs to the containers
  // module and is not repeated in the helper contract - the helper does not
  // interpret it, only carries it.
  bytes snapshot = 1;
  // The reason the state could not be determined. An empty engine and an
  // unqueried engine are two different pieces of information.
  string unavailable_reason = 2;
}

// TaskProgress describes the progress of an operation that lasts long
// enough for the operator to need to see where it stands. Progress is
// transient: it does not replace the result and is not recorded - what
// counts is what is visible now.
message TaskProgress {
  // The step and the step count, when the tool gives them. Zero means
  // unknown and must not be shown as zero steps.
  uint32 step = 1;
  uint32 total = 2;
  // The percentage given separately, because apt knows the percentage
  // without steps, and dnf the steps without a percentage. A missing field
  // means undetermined progress.
  optional uint32 percent = 3;
  // What is happening right now, e.g. "Upgrading nfs-utils".
  string message = 4;
}

message LocalAccountsResult {
  repeated LocalAccountDetail accounts = 1;
  string unavailable_reason = 2;
}

message LocalAccountDetail {
  string name = 1;
  optional bool locked = 2;
  repeated LocalSSHKey ssh_keys = 3;
  optional bool password_set = 4;
  // ExpiresAt is the expiry date as YYYY-MM-DD from the shadow record;
  // empty means no expiry.
  string expires_at = 5;
}

message LocalSSHKey {
  string fingerprint = 1;
  string type = 2;
  string comment = 3;
  // Source says which file carries the key: authorized_keys (the user's
  // own file) or managed (the panel's file under /etc/ssh/authorized_keys.d).
  string source = 4;
}

message DomainEnrollResult {
  repeated EnrollCheck checks = 1;
  bool enrolled = 2;
  string host_principal = 3;
  repeated EnrollCheck verifications = 4;
}

message EnrollCheck {
  string name = 1;
  optional bool passed = 2;
  string detail = 3;
  bool blocking = 4;
}

message IdentityProbeResult {
  string host_principal = 1;
  optional uint32 keytab_kvno = 2;
  optional uint64 cache_age_seconds = 3;
  optional bool sssd_online = 4;
  repeated string config_issues = 5;
  // The reason part of the state could not be determined.
  string unavailable_reason = 6;
  // The offline policy SSSD was configured with for the domain. The helper
  // reads it because sssd.conf is readable by root only; the panel, not the
  // host, judges what it means for logins during a directory outage.
  SssdOfflinePolicy sssd_offline_policy = 7;
}

// SssdOfflinePolicy is what sssd.conf says SSSD does for the joined domain
// when the directory is unreachable. Read from the file, never from a
// running process: the policy is what would apply, whether or not the host
// is offline right now.
//
// An unset field means the value could not be read (missing file, missing
// domain section, or a value that does not parse). A key absent from the
// file takes the SSSD default and is listed in defaulted, so the panel can
// tell an assumed value from a configured one.
message SssdOfflinePolicy {
  // Whether SSSD keeps the credentials of users who logged in while the
  // directory was reachable (cache_credentials, default false).
  optional bool cache_credentials = 1;
  // How many days a cached credential stays usable after the last online
  // login (offline_credentials_expiration, default 0 = never expires).
  optional uint32 offline_credentials_expiration_days = 2;
  // How long a cached directory entry is served before a refresh is tried
  // (entry_cache_timeout, default 5400 seconds).
  optional uint32 entry_cache_timeout_seconds = 3;
  // Whether a password entered while offline is kept for a later ticket
  // (krb5_store_password_if_offline, default false).
  optional bool krb5_store_password_if_offline = 4;
  // The keys that were absent from the configuration and took the SSSD
  // default, by their sssd.conf name.
  repeated string defaulted = 5;
  // The reason the policy, or part of it, could not be read.
  string unavailable_reason = 6;
}

message PackageActionResult {
  string manager = 1;
  repeated PackageVersionChange applied = 2;
  bool reboot_required = 3;
  repeated string services_needing_restart = 4;
  // True when the package database needs repair after a failed transaction.
  bool package_database_broken = 5;
  // Packages waiting for their configuration to be finished or broken.
  repeated string packages_needing_attention = 6;
  // What the adapter repaired itself before retrying the transaction. A
  // quiet repair would be worse than none: the host was touched differently
  // than ordered.
  repeated string self_repair = 7;
  // The tail of the tool output on failure.
  repeated string output = 8;
  // Packages whose maintainer scriptlet failed inside a transaction that
  // the manager still counts as done. rpm treats a failed %post as
  // non-fatal: the files are on disk, the database lists the package, and
  // only the script did not do its part. The transaction is a success with
  // a defect, and the defect is named rather than hidden in the output.
  repeated string scriptlet_errors = 9;
  // The expected effects of the approved plan settled against the state
  // read after the transaction: each one achieved or not, with what was
  // found. A transaction that left an effect unreached ends with the code
  // effects_partial and both lists filled.
  repeated PackageEffectOutcome effects_achieved = 10;
  repeated PackageEffectOutcome effects_missed = 11;
  // Where the host kept the artefact of the version it can go back to and
  // the artefact it verified before installing. Empty when the order named
  // neither.
  string rollback_artefact_path = 12;
  string verified_artefact_path = 13;
  // The version the package database holds, read after the operation
  // rather than taken from the order.
  string installed_version = 14;
  // Who signed the artefact, as the manager's own tooling named the key, and
  // whether the file came from the kept copy or from the repository.
  string artefact_signer = 15;
  string artefact_source = 16;
}

// PackageEffectOutcome is one expected effect of a plan after the
// transaction: the subject, what was expected of it, what was found.
message PackageEffectOutcome {
  // package_version or package_absent.
  string kind = 1;
  string subject = 2;
  string expected = 3;
  string observed = 4;
  bool achieved = 5;
}

// PackageRepairRequest unblocks package operations. The answers to the
// configuration questions come from the operator and are set before the
// package configuration is finished.
message PackageRepairRequest {
  repeated DebconfSelection answers = 1;
}

message DebconfSelection {
  string package = 1;
  string question = 2;
  string type = 3;
  string value = 4;
}

message PackageRepairResponse {
  string manager = 1;
  repeated BlockedPackageDetail still_blocked = 2;
  repeated string answered = 3;
  bool repaired = 4;
}

message BlockedPackageDetail {
  string name = 1;
  string status = 2;
  repeated DebconfQuestionDetail questions = 3;
  // See BlockedPackage.kind in the agent contract.
  string kind = 4;
}

message DebconfQuestionDetail {
  string name = 1;
  string value = 2;
  optional bool answered = 3;
}

message PackageVersionChange {
  string name = 1;
  string version_before = 2;
  string version_after = 3;
}

message UnitState {
  string name = 1;
  string load_state = 2;
  string active_state = 3;
  string sub_state = 4;
  string unit_file_state = 5;
  string result = 6;
  uint32 main_pid = 7;
  uint32 n_restarts = 8;
}
