syntax = "proto3";

package flotestro.helper.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/ultherego/flotestro/internal/genproto/flotestro/helper/v1;helperv1";

// Protokol miedzy nieuprzywilejowanym agentem a helperem roota.
// Helper nasluchuje wylacznie na gniezdzie unixowym i nigdy nie rozmawia
// z centrala. Kontrakt jest celowo maly: to jedyna droga do uprawnien roota.

// PROTOCOL_VERSION zmienia sie przy kazdej niezgodnej zmianie kontraktu.
// Helper odrzuca wersje, ktorej nie zna, zamiast zgadywac znaczenie pol.
message HelperRequest {
  uint32 protocol_version = 1;
  string task_id = 2;
  // Helper odrzuca zadanie po terminie, niezaleznie od tego, co twierdzi agent.
  google.protobuf.Timestamp expires_at = 3;
  uint32 timeout_seconds = 4;
  uint32 max_output_bytes = 5;

  oneof action {
    UnitActionRequest unit_action = 20;
    PackageActionRequest package_action = 21;
    RebootRequest reboot = 22;
    IdentityProbeRequest identity_probe = 23;
    DomainEnrollRequest domain_enroll = 24;
    LocalAccountsRequest local_accounts = 25;
    LocalUserActionRequest local_user_action = 26;
    PackageRepairRequest package_repair = 27;
    // Odczyt stanu silnika kontenerow. Agent nie dostaje gniazda Dockera:
    // czlonkostwo w grupie docker jest rownowazne rootowi, wiec proces
    // dzialajacy bez uprawnien nie moze go miec.
    DockerReadRequest docker_read = 29;
    // Operacja na silniku kontenerow. Zakres jest wyliczony, a nie podany
    // sciezka: helper nie posredniczy w dowolnym wywolaniu Engine API.
    DockerActionRequest docker_action = 30;
    // Projekt Compose: plan albo wdrozenie. Manifest przychodzi w tresci,
    // a nie jako sciezka na hoscie - operator zatwierdzil tresc.
    ComposeRequest compose = 31;
    LogFileRequest log_file = 32;
    ProcessSignalRequest process_signal = 33;
    ScheduleRequest schedule = 34;
  }
  // Postep dlugiej operacji. Klient, ktory o niego nie prosi, dostaje jedna
  // odpowiedz jak dotad - starszy agent nie moze wziac wiadomosci o postepie
  // za wynik operacji.
  bool want_progress = 28;
}

// LocalAccountsRequest odczytuje te dane o kontach, ktore wymagaja roota:
// stan blokady z /etc/shadow i klucze SSH z katalogow domowych.
message LocalAccountsRequest {
  repeated string names = 1;
}

// LocalUserActionRequest zmienia konto lokalne na hoscie.
message LocalUserActionRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_CREATE = 1;
    OPERATION_LOCK = 2;
    OPERATION_UNLOCK = 3;
    OPERATION_SET_SSH_KEYS = 4;
  }
  Operation operation = 1;
  string name = 2;
  string gecos = 3;
  string shell = 4;
  repeated string groups = 5;
  // Klucze publiczne w postaci pelnej. Klucz prywatny nigdy nie trafia
  // do systemu, a hasla nie sa przesylane w ogole.
  repeated string ssh_keys = 6;
  // CreateHome tworzy katalog domowy przy zakladaniu konta.
  bool create_home = 7;
}

// DomainEnrollRequest dolacza hosta do domeny. Wymaga roota, bo zmienia
// konfiguracje SSSD, Kerberosa i PAM.
message DomainEnrollRequest {
  string domain = 1;
  string realm = 2;
  string server = 3;
  string one_time_password = 4;
  string hostname = 5;
  bool preflight_only = 6;
}

// IdentityProbeRequest odczytuje te elementy stanu domeny, ktore wymagaja
// roota: keytab hosta i baze cache SSSD. Reszte agent czyta sam.
message IdentityProbeRequest {
  string domain = 1;
}

// RebootRequest zleca kontrolowany restart hosta.
message RebootRequest {
  uint32 delay_seconds = 1;
  string reason = 2;
}

// PackageActionRequest obejmuje operacje pakietowe wymagajace roota.
// Planowanie w trybie symulacji nie wymaga roota i nie idzie przez helper.
message PackageActionRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    // Odswiezenie metadanych repozytorium.
    OPERATION_REFRESH = 1;
    // Wykonanie transakcji aktualizacji.
    OPERATION_UPGRADE = 2;
    // Dolozenie pakietow na host.
    OPERATION_INSTALL = 3;
    // Usuniecie pakietow wraz z zaleznymi.
    OPERATION_REMOVE = 4;
    // Wstrzymanie albo zwolnienie aktualizacji pakietow.
    OPERATION_HOLD = 5;
  }
  Operation operation = 1;
  // Pusta lista przy OPERATION_UPGRADE oznacza wszystkie aktualizacje.
  repeated string packages = 2;
  bool security_only = 3;
  // Zbior usuwanych zatwierdzony przez operatora. Host liczy go ponownie tuz
  // przed operacja: roznica oznacza, ze usunieciu podleglby inny zestaw.
  repeated string expected_removals = 4;
  // Wartosc docelowa wstrzymania. Operacja opisuje stan, a nie przelacznik.
  bool hold = 5;
}

message UnitActionRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_START = 1;
    OPERATION_STOP = 2;
    OPERATION_RESTART = 3;
    OPERATION_RELOAD = 4;
    // Wlaczenie i zamaskowanie zmieniaja to, co host zrobi po restarcie,
    // a nie jego stan teraz.
    OPERATION_ENABLE = 5;
    OPERATION_DISABLE = 6;
    OPERATION_MASK = 7;
    OPERATION_UNMASK = 8;
  }
  string unit = 1;
  Operation operation = 2;
}

message HelperResponse {
  bool accepted = 1;
  // Stabilny kod maszynowy: unknown_action, unsupported_version, expired,
  // protected_unit, invalid_unit, locked, exec_failed, timeout.
  string error_code = 2;
  string message = 3;
  int32 exit_code = 4;
  bytes stdout = 5;
  bytes stderr = 6;
  bool output_truncated = 7;
  UnitState state_before = 8;
  UnitState state_after = 9;
  PackageActionResult package_result = 10;
  IdentityProbeResult identity_result = 11;
  DomainEnrollResult enroll_result = 12;
  LocalAccountsResult accounts_result = 13;
  PackageRepairResponse repair_result = 14;
  // Postep operacji w toku. Wiadomosc z postepem nie jest odpowiedzia
  // koncowa: klient czyta dalej, az dostanie final = true.
  TaskProgress progress = 15;
  bool final = 16;
  DockerReadResult docker_result = 17;
  DockerActionResult docker_action_result = 18;
  ComposeResult compose_result = 19;
  LogFileResult log_file_result = 20;
  ProcessSignalResult process_signal_result = 21;
  ScheduleResult schedule_result = 22;
}

// DockerReadRequest opisuje, co odczytac z silnika. Zakres jest wyliczony,
// a nie podany sciezka: przekazanie sciezki do Engine API oznaczaloby, ze
// przez helpera da sie wywolac dowolna jego operacje.
message DockerReadRequest {
  enum Scope {
    SCOPE_UNSPECIFIED = 0;
    // Podsumowanie do inventory: lekkie, liczone przy cyklu inwentarza.
    SCOPE_SUMMARY = 1;
    // Pelny stan na zadanie operatora, gdy otworzy zakladke.
    SCOPE_FULL = 2;
  }
  Scope scope = 1;
}

// DockerActionRequest opisuje jedna operacje na silniku.
message DockerActionRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_START = 1;
    OPERATION_STOP = 2;
    OPERATION_RESTART = 3;
    OPERATION_REMOVE = 4;
    OPERATION_PULL_IMAGE = 5;
    OPERATION_PRUNE = 6;
  }
  Operation operation = 1;
  // Identyfikator kontenera; wylacznie szesnastkowy, sprawdzony przed
  // wyslaniem i sprawdzony ponownie tutaj.
  string container_id = 2;
  uint32 timeout_seconds = 3;
  bool remove_volumes = 4;
  string image_reference = 5;
  // Obiekty do usuniecia przy sprzataniu. Lista jest jawna: sprzatanie po
  // filtrze usunęłoby takze to, czego operator nie widzial.
  repeated string image_ids = 6;
  repeated string volume_names = 7;
  repeated string network_ids = 8;
}

message DockerActionResult {
  // Stan kontenera przed i po, w postaci JSON. Zapisywany takze przy bledzie:
  // bez tego nie wiadomo, co zdazylo sie zmienic.
  bytes before = 1;
  bytes after = 2;
  repeated string removed = 3;
  optional int64 reclaimed_bytes = 4;
  string image_digest = 5;
}

// LogFileRequest czyta plik z allowlisty administratora hosta. Sciezka nie
// jest dowolna: helper rozstrzyga ja wlasnym zakresem, nie tresci zadania.
// ProcessSignalRequest wysyla sygnal do procesu. Czas startu wiaze zadanie
// z konkretnym procesem, bo jadro uzywa numerow PID ponownie.
// ScheduleRequest opisuje operacje na zadaniu cyklicznym. Wpis zarzadzany
// opisuje stan docelowy, a nie polecenie do wykonania raz.
message ScheduleRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_ENSURE = 1;
    OPERATION_DISABLE = 2;
    OPERATION_REMOVE = 3;
    OPERATION_RUN_NOW = 4;
    // Odczyt harmonogramow hosta.
    OPERATION_READ = 5;
  }
  Operation operation = 1;
  string id = 2;
  string expression = 3;
  repeated string command = 4;
  string user = 5;
  string comment = 6;
  bool enabled = 7;
  // Przejecie wpisu zastanego na hoscie. Bez tego panel nie nadpisuje pracy,
  // ktorej nikt do panelu nie wprowadzal.
  bool adopt = 8;
}

message ScheduleResult {
  // Stan harmonogramow w postaci JSON. Struktura nalezy do modulu
  // harmonogramow; kontrakt helpera jej nie powtarza.
  bytes snapshot = 1;
  string message = 2;
}

message ProcessSignalRequest {
  int32 pid = 1;
  uint64 expected_start_ticks = 2;
  string signal = 3;
}

message ProcessSignalResult {
  int32 pid = 1;
  string signal = 2;
}

message LogFileRequest {
  string path = 1;
  uint32 lines = 2;
}

message LogFileResult {
  string path = 1;
  repeated string lines = 2;
  bool truncated = 3;
  int64 size_bytes = 4;
  // Czym odczyt jest ograniczony. Operator ma wiedziec, dlaczego czegos
  // nie widzi.
  string allowlist = 5;
}

message ComposeRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_PLAN = 1;
    OPERATION_DEPLOY = 2;
  }
  Operation operation = 1;
  string project = 2;
  string manifest = 3;
  // Hash zatwierdzonego planu. Wdrozenie bez niego nie ma podstawy.
  string plan_digest = 4;
}

message ComposeResult {
  // Plan albo wynik wdrozenia w postaci JSON. Struktura nalezy do modulu
  // kontenerow; kontrakt helpera jej nie powtarza.
  bytes payload = 1;
  string unavailable_reason = 2;
}

message DockerReadResult {
  // Stan silnika w postaci JSON. Struktura nalezy do modulu kontenerow
  // i nie jest powtarzana w kontrakcie helpera - helper jej nie interpretuje,
  // tylko przenosi.
  bytes snapshot = 1;
  // Powod, dla ktorego stanu nie udalo sie ustalic. Pusty silnik i silnik
  // nieodpytany to dwie rozne informacje.
  string unavailable_reason = 2;
}

// TaskProgress opisuje postep operacji, ktora trwa na tyle dlugo, ze operator
// musi widziec, na czym stoi. Postep jest ulotny: nie zastepuje wyniku i nie
// jest zapisywany - liczy sie to, co widac teraz.
message TaskProgress {
  // Krok i liczba krokow, gdy narzedzie je podaje. Zero oznacza nieznane
  // i nie moze byc pokazane jako zero krokow.
  uint32 step = 1;
  uint32 total = 2;
  // Procent podawany osobno, bo apt zna procent bez krokow, a dnf kroki
  // bez procentu. Brak pola oznacza postep nieustalony.
  optional uint32 percent = 3;
  // Co sie akurat dzieje, np. "Upgrading nfs-utils".
  string message = 4;
}

message LocalAccountsResult {
  repeated LocalAccountDetail accounts = 1;
  string unavailable_reason = 2;
}

message LocalAccountDetail {
  string name = 1;
  optional bool locked = 2;
  repeated LocalSSHKey ssh_keys = 3;
  optional bool password_set = 4;
}

message LocalSSHKey {
  string fingerprint = 1;
  string type = 2;
  string comment = 3;
}

message DomainEnrollResult {
  repeated EnrollCheck checks = 1;
  bool enrolled = 2;
  string host_principal = 3;
  repeated EnrollCheck verifications = 4;
}

message EnrollCheck {
  string name = 1;
  optional bool passed = 2;
  string detail = 3;
  bool blocking = 4;
}

message IdentityProbeResult {
  string host_principal = 1;
  optional uint32 keytab_kvno = 2;
  optional uint64 cache_age_seconds = 3;
  optional bool sssd_online = 4;
  repeated string config_issues = 5;
  // Powod, dla ktorego czesci stanu nie udalo sie ustalic.
  string unavailable_reason = 6;
}

message PackageActionResult {
  string manager = 1;
  repeated PackageVersionChange applied = 2;
  bool reboot_required = 3;
  repeated string services_needing_restart = 4;
  // Prawda, gdy baza pakietow wymaga naprawy po nieudanej transakcji.
  bool package_database_broken = 5;
  // Pakiety, ktore czekaja na dokonczenie konfiguracji albo sa uszkodzone.
  repeated string packages_needing_attention = 6;
  // Co adapter naprawil sam przed ponowieniem transakcji. Cicha naprawa
  // bylaby gorsza od jej braku: host zostal dotkniety inaczej, niz zlecono.
  repeated string self_repair = 7;
  // Koncowka wyjscia narzedzia przy niepowodzeniu.
  repeated string output = 8;
}

// PackageRepairRequest odblokowuje operacje pakietowe. Odpowiedzi na pytania
// konfiguracyjne pochodza od operatora i sa ustawiane przed dokonczeniem
// konfiguracji pakietow.
message PackageRepairRequest {
  repeated DebconfSelection answers = 1;
}

message DebconfSelection {
  string package = 1;
  string question = 2;
  string type = 3;
  string value = 4;
}

message PackageRepairResponse {
  string manager = 1;
  repeated BlockedPackageDetail still_blocked = 2;
  repeated string answered = 3;
  bool repaired = 4;
}

message BlockedPackageDetail {
  string name = 1;
  string status = 2;
  repeated DebconfQuestionDetail questions = 3;
}

message DebconfQuestionDetail {
  string name = 1;
  string value = 2;
  optional bool answered = 3;
}

message PackageVersionChange {
  string name = 1;
  string version_before = 2;
  string version_after = 3;
}

message UnitState {
  string name = 1;
  string load_state = 2;
  string active_state = 3;
  string sub_state = 4;
  string unit_file_state = 5;
  string result = 6;
  uint32 main_pid = 7;
  uint32 n_restarts = 8;
}
