syntax = "proto3";

package flotestro.agent.v1;

import "google/protobuf/timestamp.proto";
import "flotestro/helper/v1/helper.proto";

option go_package = "github.com/ultherego/flotestro/internal/genproto/flotestro/agent/v1;agentv1";

// EnrollmentService is exposed on a separate listener that requires no
// client certificate. It is the only point where an agent without an
// identity may talk to the control plane.
service EnrollmentService {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
}

// AgentService requires mTLS. The host identity comes only from the client
// certificate, never from the message body.
service AgentService {
  rpc Connect(stream AgentMessage) returns (stream ServerMessage);
  // RenewCertificate exchanges a new CSR for a certificate. The identity
  // comes from the current client certificate, not from the request body, so
  // a renewal neither requires nor may use an enrollment token: the token is
  // a one-time entry for a host without an identity.
  rpc RenewCertificate(RenewCertificateRequest) returns (RenewCertificateResponse);
  // Ping checks connectivity with the centre without any side effect.
  //
  // A relay needs a way to tell that the link is back before it sends
  // anything that matters. Probing the link by sending real messages costs
  // losing those messages if the link does not work after all.
  rpc Ping(PingRequest) returns (PingResponse);
  // FetchSecret issues a secret value for the duration of one job.
  //
  // The value does not travel in the job envelope: the envelope carries only
  // a reference, and the host fetches the content only when it starts the
  // operation. Thanks to that the value is neither in the job, nor in the
  // audit log, nor in the inventory - it is only in the store and briefly in
  // the host's memory.
  rpc FetchSecret(FetchSecretRequest) returns (FetchSecretResponse);
  // RequestIdentityChallenge hands out a one-time challenge a host signs
  // with its current key when it renews through a relay. The relay's
  // handshake proves the relay; the challenge, bound to the host, the relay
  // and a short expiry, is what proves the host still holds the key the
  // certificate on record belongs to.
  rpc RequestIdentityChallenge(IdentityChallengeRequest) returns (IdentityChallengeResponse);
}

// RelayService serves the site relays. It is a separate service, because a
// relay is a separate trust boundary: its certificate has a different kind
// of identity and a different lifetime, and host operations are not
// available to it.
//
// The agent certificate renewal cannot serve a relay: that RPC expects a
// host identity in the URI SAN and rightly rejects everything else.
service RelayService {
  // RenewCertificate exchanges the relay's CSR for a new certificate. The
  // identity comes from the current client certificate, not from the request
  // body.
  rpc RenewCertificate(RenewRelayCertificateRequest) returns (RenewRelayCertificateResponse);
  // Ping checks the relay's connectivity with the centre and refreshes its
  // last presence.
  rpc Ping(RelayPingRequest) returns (RelayPingResponse);
  // ProxyEnroll forwards a host enrollment from an isolated site.
  //
  // The relay signs nothing itself: the fleet CA stays in the centre. The
  // relay is the TLS terminator, so it sees the token - and that is exactly
  // why the enrollment goes over its mTLS channel, not the public enrollment
  // endpoint. The centre then knows which site attests to this enrollment
  // and can refuse a token carried elsewhere.
  rpc ProxyEnroll(ProxyEnrollRequest) returns (EnrollResponse);
}

message ProxyEnrollRequest {
  // The host enrollment in the form it arrived at the relay. The relay does
  // not change it: if it could, the host identity would depend on the
  // intermediary.
  EnrollRequest enrollment = 1;
}

message RenewRelayCertificateRequest {
  // ClientRequestId makes a retry idempotent: a connection broken after the
  // certificate was issued must neither leave the relay without an identity
  // nor generate a second one.
  string client_request_id = 1;
  bytes csr_pem = 2;
  AgentBuild build = 3;
  // AdvertisedNames are a wish, not a declaration. The centre issues only the
  // names the relay has recorded in the registry: a name change is an
  // operator decision, not a certificate renewal.
  repeated string advertised_names = 4;
}

message RenewRelayCertificateResponse {
  bytes certificate_pem = 1;
  // ClientCaBundlePem serves the relay to verify the certificates of the
  // agents of its site. A fleet CA rotation reaches the relay this way before
  // the new issuer starts issuing certificates to hosts.
  bytes client_ca_bundle_pem = 2;
  google.protobuf.Timestamp not_after = 3;
}

message RelayPingRequest {
  // The heartbeat of the relay. Everything below is informational: the
  // identity of the relay comes from its certificate, and the centre
  // decides nothing on these numbers. They are what the panel shows the
  // operator about a site whose results do not arrive.
  AgentBuild build = 1;
  // The fill of the buffer of results waiting for the link to the centre.
  uint64 buffer_bytes = 2;
  uint32 buffered_items = 3;
  uint64 buffer_max_bytes = 4;
  // BufferDroppedTotal counts the results dropped since the start because
  // the buffer was full. A non-zero value means the site lost results.
  uint64 buffer_dropped_total = 5;
  // Sessions counts the agents connected to the relay as it sees them; the
  // answer carries the count as the centre sees it.
  uint32 sessions = 6;
  // InstanceID names the process of the relay: a fresh identifier at
  // every start. The panel reads a restart of the relay off a change of
  // it, which the version and the address do not show.
  string instance_id = 7;
  // UpstreamState says how the relay sees its link to the centre at the
  // moment of the report: connected, buffering (the link was lost and the
  // spool takes the results) or reconnecting. Informational, like the rest.
  string upstream_state = 8;
  // SpoolBytesLimit is the room the spool of the relay may take on disk;
  // buffer_bytes counts against it. Zero for a relay from before the spool,
  // which reported the memory buffer in buffer_max_bytes alone.
  uint64 spool_bytes_limit = 9;
}

message RelayPingResponse {
  google.protobuf.Timestamp server_time = 1;
  // Sessions says how many agents the centre sees as connected through this
  // relay. A mismatch with the local count is the first symptom of a hung
  // session.
  uint32 sessions = 2;
}

message FetchSecretRequest {
  // TaskId binds the fetch to a specific job: the lease is issued for it and
  // for this host.
  string task_id = 1;
  string secret_name = 2;
  uint32 secret_version = 3;
  // The host's own proof when the fetch goes through a relay: the envelope
  // signs the request with the identity field cleared, and the ephemeral
  // X25519 public key - signed by the host key over the task and the
  // secret - is what the panel seals the value to. A relay carries these
  // untouched and never sees the plaintext.
  RelayedEnvelope identity = 4;
  bytes ephemeral_public_key = 5;
  bytes ephemeral_key_signature = 6;
}

message FetchSecretResponse {
  bytes value = 1;
  uint32 version = 2;
  // Sha256 lets the host check that it got what the panel issued. Empty on
  // a sealed answer: the authenticated cipher already guarantees the
  // content, and a digest of a short secret in a relay's log would be a
  // hint nobody asked for.
  string sha256 = 3;
  // The sealed answer of a relayed fetch: value stays empty, and the host
  // opens sealed_value with its ephemeral private key and the panel's
  // ephemeral public key. sealing names the scheme
  // (x25519-hkdf-sha256-aes256gcm); a host that does not know it must not
  // guess.
  bytes sealed_value = 4;
  bytes sealed_nonce = 5;
  bytes server_public_key = 6;
  string sealing = 7;
}

// IdentityChallengeRequest carries nothing: the identity comes from the
// handshake, or from the relay's attestation, never from the body.
message IdentityChallengeRequest {}

message IdentityChallengeResponse {
  // Challenge is 32 random bytes the host signs into its renewal proof. The
  // panel keeps only its digest, for one use and for two minutes.
  bytes challenge = 1;
  int64 expires_at_unix = 2;
  // RelayId is the relay the challenge was issued through, empty for a
  // direct call: the proof binds the same relay, so the host can check it
  // signs what the panel will look for.
  string relay_id = 3;
}

message PingRequest {}

message PingResponse {
  google.protobuf.Timestamp server_time = 1;
  string gateway_id = 2;
}

message RenewCertificateRequest {
  // The CSR in PEM form. The private key never leaves the host; at renewal
  // the agent may generate a new key pair.
  bytes csr_pem = 1;
  AgentBuild build = 2;
  // A renewal through a relay binds the request to the old host key: the
  // envelope signs the request with the identity field cleared, and proof
  // is Sign(old host key, SHA256(csr_der || server_challenge || relay_id))
  // over a challenge the panel issued for this host, this relay and two
  // minutes. Absent on a direct renewal, where the handshake is the proof.
  RelayedEnvelope identity = 3;
  bytes server_challenge = 4;
  bytes proof = 5;
}

message RenewCertificateResponse {
  bytes certificate_pem = 1;
  bytes ca_bundle_pem = 2;
  google.protobuf.Timestamp not_after = 3;
  // The panel's capability keys, signed, for the root helper's keyring.
  // A renewal carries the current set so a rotated key reaches every host
  // without a separate distribution. Absent from a panel without a
  // signing key.
  flotestro.helper.v1.HelperTrustBundle helper_trust = 4;
}

message EnrollRequest {
  string enrollment_token = 1;
  // The stable machine identifier, usually /etc/machine-id.
  string machine_id = 2;
  string hostname = 3;
  // The CSR in PEM form. The private key never leaves the host.
  bytes csr_pem = 4;
  AgentBuild build = 5;
  // The identifier of one enrollment attempt, constant across retries.
  //
  // The response may get lost after the panel recorded the host and issued
  // the certificate. The agent then retries the same attempt and by this
  // identifier gets the same certificate instead of a "token spent" refusal.
  string client_request_id = 6;
}

message EnrollResponse {
  string host_id = 1;
  bytes certificate_pem = 2;
  bytes ca_bundle_pem = 3;
  google.protobuf.Timestamp not_after = 4;
  // The panel's capability keys and the host identifier, signed, which
  // the agent hands to the root helper: the helper takes its host
  // identity and its keyring from here, not from the agent's word.
  flotestro.helper.v1.HelperTrustBundle helper_trust = 5;
}

message AgentBuild {
  string agent_version = 1;
  string os_family = 2;
  string os_version = 3;
  string architecture = 4;
}

message AgentMessage {
  oneof payload {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    InventoryReport inventory = 3;
    TaskResult task_result = 4;
    TaskProgress task_progress = 5;
    TaskLogLines task_log_lines = 6;
    MetricsSample metrics_sample = 7;
    // The answer to a FinalTask: the host has stopped taking work.
    FinalReady final_ready = 8;
    // The answer to a CancelTask: what the cancel found on the host.
    CancelAck cancel_ack = 9;
  }
  // The host's own signature over the payload, for a session that goes
  // through a relay. Outside the oneof: every kind of message carries it,
  // and a relay forwards it untouched - it neither signs nor rewrites.
  RelayedEnvelope envelope = 20;
}

// RelayedEnvelope is the inner identity envelope of a message that travels
// through a relay. The relay proves itself in its own handshake; the host
// proves itself here, with a signature its key alone can make, so the relay
// can carry the host's word but not speak for it.
//
// The agent signs fields 1-10 with its current host key. body_sha256 is the
// SHA-256 of the payload message in its deterministic protobuf encoding;
// the gateway decodes the payload and encodes it again the same way, so
// what is checked is the content rather than the bytes a relay happened to
// forward. sequence is monotonic within session_id, starting at 1 with
// Hello; a message the relay buffered keeps its original issued_at_unix and
// signature. nonce is 16 random bytes.
message RelayedEnvelope {
  uint32 schema_version = 1;
  string relay_id = 2;
  string host_id = 3;
  string certificate_serial = 4;
  string session_id = 5;
  uint64 sequence = 6;
  int64 issued_at_unix = 7;
  bytes nonce = 8;
  string message_kind = 9;
  bytes body_sha256 = 10;
  bytes host_signature = 11;
}

message ServerMessage {
  oneof payload {
    SessionConfig session_config = 1;
    InventoryRequest inventory_request = 2;
    TaskEnvelope task = 3;
    CancelTask cancel_task = 4;
    // The two steps of the decommission handshake. A typed message rather
    // than a task: a task can be replayed from the journal, refused by a
    // resource lock or held by the budget, and none of that may happen to
    // the order that ends the host's work.
    FinalTask final_task = 5;
    FinalCommit final_commit = 6;
    // The application acknowledgement of a relayed message: the gateway
    // sends it after the transaction that consumed the message committed.
    // The relay deletes the spooled copy on it and does not forward it; an
    // agent that receives one all the same ignores it.
    MessageAck message_ack = 8;
    // The application acknowledgement of one resource sample, addressed to
    // the agent that took it. It travels the whole way down - a relay
    // forwards it like a task - because it is the agent's own spool it
    // frees.
    MetricsAck metrics_ack = 9;
  }
}

// MetricsAck answers one resource sample, named by the identity the agent
// gave it rather than by the moment it was taken.
//
// It is a message of its own and not a MessageAck: a MessageAck names the
// envelope of a relayed message and is consumed by the relay, which never
// forwards it, so it could free nothing on the host; and a direct session
// has no envelope for the agent to match against at all. The agent keeps
// an unacknowledged sample in a small spool on disk and sends it again on
// the next session, so the acknowledgement has to reach the agent on both
// paths and has to name what the agent's spool is keyed by.
//
// The gateway sends it after the transaction that stored the sample
// committed. A sample the panel already holds is acknowledged again, with
// DUPLICATE: the second delivery changed nothing and the agent may drop
// it. A terminal refusal - too old to be stored at all, or malformed -
// also frees the spool: keeping a sample the panel will never take would
// push out the samples it would.
message MetricsAck {
  string boot_id = 1;
  uint64 sequence = 2;
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // The sample was written in this delivery.
    STATUS_PERSISTED = 1;
    // The panel already held this sample; nothing was written.
    STATUS_DUPLICATE = 2;
    // The sample is older than the panel keeps raw samples for and was
    // not stored. The gap it leaves carries this reason rather than
    // passing for a host that had nothing to say.
    STATUS_REJECTED_TOO_OLD = 3;
    // The sample cannot be stored as it stands, or this panel keeps no
    // samples at all.
    STATUS_REJECTED_INVALID = 4;
  }
  Status status = 3;
  // The entry of the error guide behind a refusal; empty on a sample that
  // was stored.
  string reason_code = 4;
}

// MessageAck names a message of a relayed session the panel has consumed:
// the host, the session the host signed it in and the sequence of the
// envelope. A relay keeps a spooled message until this arrives - a
// successful write to the socket says nothing about the panel having
// committed it - and a message delivered a second time after a restart of
// the relay is answered with the same acknowledgement without effect.
message MessageAck {
  string host_id = 1;
  string session_id = 2;
  uint64 sequence = 3;
}

// Hello is the first message in the stream. The gateway rejects a stream
// whose first message is anything else.
message Hello {
  string agent_version = 1;
  // A boot_id change means a host reboot and ends the reboot phase of a
  // campaign.
  string boot_id = 2;
  Capabilities capabilities = 3;
  // The last inventory revision known to the agent; lets the server demand a
  // full one.
  string inventory_revision = 4;
  // The address the agent set this connection up from. At its end the panel
  // sees the relay address when the host connects through a site relay - then
  // this is the only source of the host's own address. Empty means an
  // undetermined address.
  string local_address = 5;
  // The commit the agent was built from. The version names a release; the
  // commit names the sources, which the version alone does not once a
  // package was rebuilt. Empty from a build outside a checkout.
  string build_commit = 6;
  // The protocols the agent speaks, oldest and newest. The panel judges
  // compatibility by the overlap with its own range before it consults
  // its table of releases. A max of zero is an agent from before the
  // range was announced; the table decides then.
  uint32 protocol_min = 7;
  uint32 protocol_max = 8;
  // The digest of the effective configuration the agent runs on: the file
  // after the defaults filled in what it left out. Two files that mean the
  // same have the same digest. Empty on a host that runs on the
  // environment variables of the old flow and has no file.
  string config_fingerprint = 9;
  // The schema_version of the configuration file on disk. Zero next to a
  // protocol range means no file: the host is still on the environment
  // variables, which the panel shows as a legacy configuration.
  uint32 config_schema_version = 10;
  // Whether this agent forwards the panel's capability to the root helper,
  // and the mode the helper on the host runs in - observe, prefer or
  // enforce. The mode is what the helper last reported; empty means the
  // agent has not heard from the helper yet, which is not the same as
  // a helper without the capability.
  bool helper_capability_supported = 11;
  string helper_capability_mode = 12;
}

message SessionConfig {
  int32 heartbeat_seconds = 1;
  int32 heartbeat_jitter_seconds = 2;
  string min_agent_version = 3;
  bool full_inventory_requested = 4;
  // How often the agent sends a MetricsSample. Zero means the default of
  // the agent (sixty seconds).
  int32 metrics_interval_seconds = 5;
  // The periodic inventory cycle. Absent means the agent's own settings.
  InventoryCadence inventory_cadence = 6;
  // The panel's helper capability keys for this host, signed. The agent
  // hands the bundle to the helper before any task; an older agent
  // ignores it.
  flotestro.helper.v1.HelperTrustBundle helper_trust = 7;
}

// InventoryCadence sets the periodic inventory cycle of the agent. Every
// zero field keeps the agent's own value, so an older panel that does not
// send the message changes nothing.
message InventoryCadence {
  // The base interval of the cycle; the agent spreads every wait by ten per
  // cent either way.
  int32 interval_seconds = 1;
  // Every which cycle the normal modules (packages, network, storage,
  // security) are read. The fast ones go every cycle.
  int32 normal_every = 2;
  // The hour (UTC) of the daily full report. Unset means the hour the
  // agent derives from its host identifier, which spreads the fleet over
  // the day.
  optional int32 full_report_hour_utc = 3;
}

message InventoryRequest {
  bool full = 1;
}

message Heartbeat {
  google.protobuf.Timestamp sent_at = 1;
  HealthSignals health = 2;
}

// HealthSignals deliberately carries only the decision signals. The host
// metrics travel separately as MetricsSample, not in the heartbeat.
//
// Optional fields mean an undetermined state. An agent that failed to read a
// value does not send it at all. A missing value must never be confused with
// zero or false: a failed read is not a fact about the host.
message HealthSignals {
  optional uint32 failed_units = 1;
  optional bool reboot_required = 2;
  uint32 load1_milli = 3;
  uint32 root_fs_used_percent = 4;
  uint64 uptime_seconds = 5;
  optional uint32 pending_updates = 6;
  optional uint32 pending_security_updates = 7;
}

// MetricsSample is one reading of the host resources. The agent reads the
// kernel counters itself and sends them at a fixed interval; the panel keeps
// them, draws the charts and evaluates the alert rules over them. There is
// no exporter and no external monitoring system in between.
//
// The counters are what the kernel reports at the moment of the sample.
// The CPU load is already a percentage over the interval since the previous
// sample; the network counters stay cumulative, because a rate computed on
// the host would hide a reboot and a counter wrap.
message MetricsSample {
  int64 sampled_at_unix = 1;
  double cpu_percent = 2;
  double load1 = 3;
  double load5 = 4;
  double load15 = 5;
  uint64 memory_total = 6;
  uint64 memory_used = 7;
  uint64 memory_available = 8;
  uint64 swap_total = 9;
  uint64 swap_used = 10;
  uint64 uptime_seconds = 11;
  repeated FilesystemSample filesystems = 12;
  repeated InterfaceSample interfaces = 13;

  // The agent's own footprint on the host. The release gate of the agent
  // measures its cost in memory and CPU on the running fleet, and a rule
  // watches for a leak; both read what the agent knows about itself from
  // /proc/self. Every field is optional: a value the agent could not read
  // is not sent, and the panel keeps it unknown rather than zero.
  optional uint64 agent_rss_bytes = 14;
  // Busy time of the agent process over the interval since the previous
  // sample, as a percentage of one core.
  optional double agent_cpu_percent = 15;
  optional uint32 agent_goroutines = 16;
  optional uint32 agent_open_fds = 17;
  // The resident memory of the root helper. Present only while the helper
  // runs: it is activated by the socket and exits after an idle period, so
  // most samples of a host at rest carry nothing here.
  optional uint64 helper_rss_bytes = 18;

  // The identity of the sample, which its timestamp is not. The clock of a
  // host moves: NTP steps it, a virtual machine resumes from a snapshot,
  // an operator sets it by hand - and a sample keyed by the clock would
  // then either overwrite an older reading of the same host or be counted
  // twice after a resend. The boot the agent runs on and a sequence that
  // grows by one within that boot, starting at one, say instead exactly
  // which reading this is. The panel stores the pair and answers a sample
  // it already holds with a duplicate acknowledgement rather than a second
  // row.
  //
  // An agent from before this field sends neither, and the panel falls
  // back to the host and the moment, as it did: an older agent keeps its
  // charts, it only has no spool to drain.
  string boot_id = 19;
  uint64 sequence = 20;
}

// FilesystemSample is the usage of one mounted real filesystem. Pseudo
// filesystems, overlays and tmpfs are left out: a full /run says nothing
// about the disk.
message FilesystemSample {
  string mount = 1;
  string device = 2;
  string fstype = 3;
  uint64 total_bytes = 4;
  uint64 used_bytes = 5;
  uint64 inodes_total = 6;
  uint64 inodes_used = 7;
}

// InterfaceSample is the cumulative traffic of one network interface; the
// loopback is left out.
message InterfaceSample {
  string name = 1;
  uint64 rx_bytes = 2;
  uint64 tx_bytes = 3;
}

// Capability describes one adapter on the host. The name says what adapter
// it is, not what the operation wants: the operation asks for "packages",
// the host answers "packages.apt".
message Capability {
  string name = 1;
  // The adapter contract version, not the tool version. The tool version is
  // a fact about the host and belongs to the inventory.
  uint32 version = 2;
  bool available = 3;
  // An adapter that can read but not change. A disabled tab and a tab
  // without buttons are two different pieces of information for the
  // operator.
  bool read_only = 4;
  // The reason for the unavailability or limitation. Without it the
  // interface has to guess why something is missing - and it guesses in
  // browser code, so badly.
  string reason = 5;
  // Parts of the adapter that may exist separately. Package database repair
  // works only for apt and the host is to say so before the job is sent.
  map<string, bool> features = 6;
}

message Capabilities {
  // The boolean fields are a leftover from before the registry. An older
  // agent version sends no registry at all, and the fleet updates
  // gradually: the server must then reconstruct the registry from those
  // fields instead of considering the host stripped of all adapters.
  bool systemd = 1;
  bool apt = 2;
  bool dnf = 3;
  bool docker = 4;
  bool journald = 5;
  repeated Capability registry = 6;
}

message InventoryReport {
  // The revision computed by the agent from the report content; identical
  // content gives an identical revision, so the server may skip a write
  // without changes.
  string revision = 1;
  bool full = 2;
  string schema_version = 3;
  OsInfo os = 4;
  HardwareInfo hardware = 5;
  PackageSummary packages = 6;
  IdentityState identity = 8;
  repeated LocalAccount local_accounts = 9;
  // The full report in JSON goes into JSONB. The normalised fields are above.
  bytes raw_json = 7;
  // The report split into modules. Every module has its own revision and its
  // own observation timestamp, so a change of one does not rewrite the
  // whole, and the interface knows how fresh exactly the tab the operator
  // looks at is.
  repeated InventoryFragment fragments = 10;
}

// InventoryFragment is the state of one host module.
message InventoryFragment {
  string module = 1;
  // The revision computed from the fragment content. Identical content gives
  // an identical revision, so the server does not rewrite the row without a
  // change.
  string revision = 2;
  // Where the read comes from, e.g. "agent/systemctl". An operator looking at
  // the data is to know what it was measured with.
  string source = 3;
  bytes payload = 4;
  // The reason the state could not be determined. An empty module and an
  // unread module are two different pieces of information.
  string unavailable_reason = 5;
  google.protobuf.Timestamp observed_at = 6;
}

// IdentityState describes the state of the host's domain integration.
// Collected in the inventory cycle, never at a heartbeat: the full user list
// must not be fetched several times a minute from every host of the fleet.
//
// Optional fields mean an undetermined state. A host not joined to the
// domain is different information than a host whose state could not be
// read.
message IdentityState {
  bool enrolled = 1;
  string domain = 2;
  string realm = 3;
  // The domain servers discovered locally, without querying the directory.
  repeated string servers = 4;

  bool sssd_installed = 5;
  bool sssd_running = 6;
  // A missing value means the connection state could not be determined.
  optional bool sssd_online = 7;
  // The age of the SSSD cache in seconds; a growing age while offline means
  // the host runs on an ever older copy of the policies.
  optional uint64 cache_age_seconds = 8;

  string host_principal = 9;
  optional uint32 keytab_kvno = 10;
  // Clock skew breaks Kerberos before it breaks anything else.
  optional double clock_skew_seconds = 11;
  bool time_synchronized = 12;

  // Remarks from the SSSD configuration check.
  repeated string config_issues = 13;
  // The reason the state could not be determined.
  string unavailable_reason = 14;
  // The offline policy from sssd.conf, as the helper read it. Nil means the
  // policy was not read at all; the panel judges what the facts mean for
  // logins during a directory outage, the host only reports them.
  SssdOfflinePolicy sssd_offline_policy = 15;
}

// SssdOfflinePolicy is what sssd.conf says SSSD does for the joined domain
// when the directory is unreachable. An unset field is a value that could
// not be read; a key absent from the file takes the SSSD default and is
// named in defaulted, so an assumed value never looks like a measured one.
message SssdOfflinePolicy {
  // cache_credentials, default false.
  optional bool cache_credentials = 1;
  // offline_credentials_expiration in days, default 0 = never expires.
  optional uint32 offline_credentials_expiration_days = 2;
  // entry_cache_timeout in seconds, default 5400.
  optional uint32 entry_cache_timeout_seconds = 3;
  // krb5_store_password_if_offline, default false.
  optional bool krb5_store_password_if_offline = 4;
  // The sssd.conf keys that were absent and took the SSSD default.
  repeated string defaulted = 5;
  // The reason the policy, or part of it, could not be read.
  string unavailable_reason = 6;
}

// LocalAccount describes an account visible on the host.
//
// The account source matters: a local account, a directory account and a
// system account need different handling, and the panel must not create a
// local copy of a domain account, because it would shadow the identity from
// the directory.
message LocalAccount {
  enum Source {
    SOURCE_UNSPECIFIED = 0;
    // An account from /etc/passwd with an identifier from the user range.
    SOURCE_LOCAL = 1;
    // An account resolved by NSS from the directory, absent from /etc/passwd.
    SOURCE_DIRECTORY = 2;
    // A system account: services, not people.
    SOURCE_SYSTEM = 3;
  }

  string name = 1;
  uint32 uid = 2;
  uint32 gid = 3;
  string home = 4;
  string shell = 5;
  string gecos = 6;
  Source source = 7;
  repeated string groups = 8;
  // Locked means an administratively locked account (the "!" prefix in
  // shadow). Empty means the state could not be determined; the read
  // requires root.
  //
  // An account without a password is not locked: an account created by the
  // panel logs in with an SSH key and has password authentication disabled,
  // which is something other than cutting off access.
  optional bool locked = 9;
  // Public keys described by fingerprint; the key content itself is not
  // sent.
  repeated SSHKey ssh_keys = 10;
  // The reason part of the data could not be determined.
  string unavailable_reason = 11;
  // PasswordSet says whether the account has a password usable for login. An
  // account without a password and without keys is unreachable, and an
  // account without a password with a key is reachable only by key; the
  // panel must tell these cases apart.
  optional bool password_set = 12;
  // ExpiresAt is the account expiry date as YYYY-MM-DD, from the shadow
  // record. Empty means no expiry or an unread record - the difference is
  // in unavailable_reason.
  string expires_at = 13;
}

message SSHKey {
  string fingerprint = 1;
  string type = 2;
  string comment = 3;
  // The key source: the authorized_keys file on the host or the identity
  // directory.
  string source = 4;
}

message OsInfo {
  string family = 1;
  string distribution = 2;
  string version = 3;
  string kernel = 4;
  string architecture = 5;
  string pretty_name = 6;
}

message HardwareInfo {
  uint32 cpu_cores = 1;
  uint64 memory_bytes = 2;
  uint64 root_fs_bytes = 3;
  uint64 root_fs_free_bytes = 4;
  string virtualization = 5;
}

// PackageSummary tells "zero updates" from "could not be determined". An
// adapter that failed leaves the counter empty and describes the reason in
// unavailable_reason instead of reporting zero.
message PackageSummary {
  optional uint32 installed = 1;
  optional uint32 upgradable = 2;
  optional uint32 security_upgradable = 3;
  string manager = 4;
  string unavailable_reason = 5;
}


// The job envelope. The base contract deliberately has no shell_command
// field: remote execution of an arbitrary shell string is not an operation,
// only a hole.
message TaskEnvelope {
  string task_id = 1;
  // The key for recognising a redelivery. The handler must return the
  // previous result instead of performing the mutation a second time.
  string idempotency_key = 2;
  string campaign_id = 3;
  google.protobuf.Timestamp created_at = 4;
  // Absolute TTL. A job past its deadline is not executed even when it
  // reached the agent after the network came back.
  google.protobuf.Timestamp expires_at = 5;
  // The integrity of the plan approved by a human.
  bytes payload_hash = 6;
  Preconditions preconditions = 7;
  Limits limits = 8;
  ActorContext actor_context = 9;
  // The panel's authorization of this operation for the root helper: the
  // capability, its Ed25519 signature and the canonical payload the
  // capability binds. The agent forwards all three untouched; it holds no
  // key to mint or alter them. Absent for a read and from a panel without
  // a signing key.
  flotestro.helper.v1.HelperCapability helper_capability = 10;
  bytes helper_capability_signature = 11;
  bytes canonical_payload = 12;

  oneof action {
    UnitAction unit_action = 20;
    ReadJournal read_journal = 21;
    PackagePlan package_plan = 22;
    PackageUpgrade package_upgrade = 23;
    SystemReboot system_reboot = 24;
    ReadUnitStatus read_unit_status = 25;
    DomainEnroll domain_enroll = 26;
    LocalUserAction local_user_action = 27;
    PackagesRepair packages_repair = 28;
    DockerRead docker_read = 29;
    DockerAction docker_action = 30;
    ComposeAction compose = 31;
    UnitToggle unit_toggle = 32;
    ReadLogFile read_log_file = 33;
    FollowJournal follow_journal = 34;
    ListProcesses list_processes = 35;
    SignalProcess signal_process = 36;
    PackageLifecycle package_lifecycle = 37;
    ScheduleAction schedule = 38;
    NetworkAction network = 39;
    DnsAction dns = 40;
    FirewallAction firewall = 41;
    StorageAction storage = 42;
    SshAction ssh = 43;
    KernelAction kernel = 44;
    FileAction file = 45;
    TimeAction time = 46;
    SystemShutdown system_shutdown = 47;
    SecurityAction security = 48;
    CertificateAction certificate = 49;
    RepositoryAction repository = 50;
    BackupAction backup = 51;
    MonitoringProbe monitoring_probe = 52;
    ListPackages list_packages = 53;
    AgentUpgrade agent_upgrade = 54;
    RefreshInventory refresh_inventory = 55;
    ReadDockerEvents read_docker_events = 56;
    DockerLogs docker_logs = 57;
    HostnameSet hostname_set = 58;
    DomainLeave domain_leave = 59;
    KeytabRenew keytab_renew = 60;
    // A declared container, network or volume: the plan of one, or the
    // change that brings the host to it.
    DockerEnsureAction docker_ensure = 61;
  }
}

// DockerEnsureAction orders the plan of a declared object or the change
// that brings the host to it.
//
// The description travels as the order's own JSON rather than as the
// engine's request body: the panel wrote it, the operator approved it and
// the payload hash covers it, so the agent hands on exactly what was
// approved instead of assembling something else out of fields. The module
// of the containers owns that shape; the agent contract does not repeat
// it.
message DockerEnsureAction {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    // The plan alone: what stands on the host, what is to stand there and
    // what the change would do. It touches nothing.
    OPERATION_PLAN = 1;
    OPERATION_CONTAINER_ENSURE = 2;
    OPERATION_NETWORK_ENSURE = 3;
    OPERATION_NETWORK_REMOVE = 4;
    OPERATION_VOLUME_ENSURE = 5;
    OPERATION_VOLUME_REMOVE = 6;
  }
  Operation operation = 1;
  // Kind is container, network or volume; name is the object a removal or
  // a plan of one is about. A description carries its own name, and this
  // pair is what an order without a description has instead.
  string kind = 2;
  string name = 3;
  // The description of the object, in the words of the containers module.
  // Empty for a removal, which names an object and describes none.
  bytes spec = 4;
  // The digest of the approved plan. The host computes the plan again
  // right before the change and refuses with stale_plan when it moved.
  string plan_digest = 5;
  // Force says the order accepts what the host would otherwise refuse: a
  // network recreated under the containers attached to it, a volume
  // recreated with everything in it, a removal of an object something
  // still holds.
  bool force = 6;
  // The variables whose value comes from the panel's secret store, by
  // variable name. The reference travels; the value is fetched by the
  // agent right before the container is created and is in no record.
  map<string, SecretRef> env_secrets = 7;
}

// DockerEnsureResult carries the plan or the outcome in JSON form. The
// structure belongs to the containers module; the agent contract does not
// repeat it.
message DockerEnsureResult {
  bytes payload = 1;
  string unavailable_reason = 2;
}

// RefreshInventory orders a fresh read of the inventory.
//
// The operation does not change the host - and that is exactly why it exists
// separately. The panel sees the image from before the last cycle, and a
// decision before a campaign or after a manual change on the host must rest
// on the state of this moment, not of a quarter of an hour ago.
message RefreshInventory {
  // Modules limits the read to the named modules. Empty means the whole
  // inventory. The names are the same ones the inventory splits into
  // fragments by.
  repeated string modules = 1;
}

// AgentUpgrade replaces the agent itself. The result of this operation does
// not come back the same way as others: the process that carries it out is
// replaced halfway through, so the host coming back with the expected
// version settles it.
message AgentUpgrade {
  string target_version = 1;
  // The package checksum from the release. The manager checks the repository
  // signature, and this is a second, independent check.
  string package_sha256 = 2;
  // The version to go back to when the host does not come back with the new
  // one. Empty means no prepared rollback.
  string rollback_version = 3;
}

// Preconditions are checked locally right before execution. The base state
// may have changed between approving the plan and delivering the job.
message Preconditions {
  string os_family = 1;
  repeated string required_capabilities = 2;
  // An empty boot_id means no requirement. A mismatch means the host managed
  // to reboot since planning.
  string expected_boot_id = 3;
}

message Limits {
  uint32 timeout_seconds = 1;
  uint32 max_output_bytes = 2;
  // The resource scope of the operation on the host: a transient systemd
  // scope with these controls around the tools the operation starts. Zero
  // means no scope. The values come from the operation registry per
  // family, so a package transaction on a busy host is slowed down rather
  // than the host.
  uint32 cpu_weight = 3;
  uint32 io_weight = 4;
  uint64 memory_high_bytes = 5;
}

// ActorContext lets the agent record locally who ordered the change.
message ActorContext {
  string actor_id = 1;
  string request_id = 2;
  repeated string approvals = 3;
}

message UnitAction {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_START = 1;
    OPERATION_STOP = 2;
    OPERATION_RESTART = 3;
    OPERATION_RELOAD = 4;
    // Clearing the failed state of a unit. It changes no process: only what
    // the host says about the unit, so the next failure is told from the
    // one the operator has already seen.
    OPERATION_RESET_FAILED = 5;
  }
  string unit = 1;
  Operation operation = 2;
}

message ReadJournal {
  string unit = 1;
  uint32 lines = 2;
  // The syslog priority: 0 emerg ... 7 debug. Empty means no filter.
  optional uint32 max_priority = 3;
  string since = 4;
  // AfterCursor starts the read right after a journal position: the unit
  // detail view hands over the cursor of its last line so the Logs page
  // continues where the detail ended.
  string after_cursor = 5;
  // Until ends the read, in the same forms as since; the Logs page bounds
  // a read to the window of a job with both.
  string until = 6;
  // BootID narrows the read to one boot of the host: thirty-two hex digits
  // as journalctl --boot takes them. An agent that applies it announces the
  // boot_filter feature of its journald adapter; the panel sends the field
  // only to such an agent.
  string boot_id = 7;
}

// SystemReboot restarts the host. A reboot is a separate campaign phase, not
// a side effect of an update.
message SystemReboot {
  // The delay gives the agent time to send the result back before the host
  // disappears.
  uint32 delay_seconds = 1;
  string reason = 2;
}

// SystemShutdown powers the host off. Unlike a reboot, it ends in a state
// the panel cannot bring the host out of: powering on requires out-of-band
// access.
message SystemShutdown {
  uint32 delay_seconds = 1;
  string reason = 2;
  // Mode tells powering off from halting the system.
  string mode = 3;
  // IgnoreInhibitors steps over the logind inhibitors. Without it a host
  // with an inhibitor sends it back as the refusal reason instead of quietly
  // shutting down.
  bool ignore_inhibitors = 4;
}

message PowerResult {
  bytes snapshot = 1;
  string message = 2;
  // Inhibitors carries the inhibitors that held the operation back.
  bytes inhibitors = 3;
  string scheduled_at = 4;
}

// ReadUnitStatus reads the unit state. A non-mutating operation used by the
// campaign health checks and the host view. An empty list with all = true
// means the full listing of the host; that is a different cost than reading
// a few known by name, so it must be ordered explicitly.
message ReadUnitStatus {
  repeated string units = 1;
  bool all = 2;
  // Detail asks for the full picture of the named units: dependencies,
  // drop-ins, the last journal lines. It costs several processes per unit,
  // so a health check does not order it by accident.
  bool detail = 3;
}

// DomainEnroll joins the host to the directory domain.
//
// The one-time password is injected into the envelope at dispatch and is
// not stored in the database: a shared administrator password sent out to
// all the hosts would be exactly what the document defends against.
message DomainEnroll {
  string domain = 1;
  string realm = 2;
  string server = 3;
  // A short-lived one-time password generated by the directory for this
  // host.
  string one_time_password = 4;
  // A preflight without joining: checks the conditions and does not change
  // the host state.
  bool preflight_only = 5;
  // The FQDN the host is to be registered under.
  string hostname = 6;
}

// DomainLeave takes the host out of the directory domain. It carries no
// credential: the host unenrolls itself with its own keytab. The result
// comes back as a DomainEnrollResult with enrolled = false - the checks
// before and the verifications after have the same shape as the join's.
message DomainLeave {
  string domain = 1;
  string realm = 2;
}

// KeytabRenew is the host's half of a service keytab rotation: the
// directory has retired the old key of the principal, and the host fetches
// a new one into its own keytab file with the credentials it holds. No key
// material travels in either direction through the panel.
message KeytabRenew {
  // The principal, service/host.example.test with an optional realm.
  string principal = 1;
}

// LocalUserAction manages a local account on the host. The module is meant
// for installations without a directory: where FreeIPA or another directory
// runs, people's accounts come from the directory and the panel does not
// duplicate them.
//
// Accounts are created without a password. Only an SSH key gives access, so
// the panel never carries or stores an authentication secret.
message LocalUserAction {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_CREATE = 1;
    OPERATION_LOCK = 2;
    OPERATION_UNLOCK = 3;
    OPERATION_SET_SSH_KEYS = 4;
    // The complete list of supplementary groups. Declarative like the keys:
    // an empty list takes every supplementary group away.
    OPERATION_SET_GROUPS = 5;
    // The account expiry date. An empty date clears the expiry.
    OPERATION_SET_EXPIRY = 6;
    // Deleting the account, optionally with its home directory.
    OPERATION_DELETE = 7;
    // The keys of an account edited one at a time (security remediation,
    // chapter 14.1): an add appends the keys the file does not carry yet,
    // a remove takes the named fingerprints away and nothing else, and a
    // replace writes the list anew - bound to the fingerprints the
    // operator saw. OPERATION_SET_SSH_KEYS is the replace under its old
    // name, kept one release.
    OPERATION_ADD_SSH_KEYS = 8;
    OPERATION_REMOVE_SSH_KEYS = 9;
    OPERATION_REPLACE_SSH_KEYS = 10;
  }
  Operation operation = 1;
  string name = 2;
  string gecos = 3;
  string shell = 4;
  repeated string groups = 5;
  // The full, intended list of public keys of a create or a replace. The
  // replace is declarative: an empty list revokes access, it does not
  // mean "do not change".
  repeated string ssh_keys = 6;
  bool create_home = 7;
  // ExpiresAt is the expiry date as YYYY-MM-DD. Empty on an expiry operation
  // means "no expiry".
  string expires_at = 8;
  // RemoveHome deletes the home directory together with the account.
  bool remove_home = 9;
  // Keys are the keys an add appends, each with an optional comment.
  repeated SSHKeyInput keys = 10;
  // Fingerprints names the keys a remove takes away (SHA256:...).
  repeated string fingerprints = 11;
  // IgnoreMissing lets a remove pass over a fingerprint the account does
  // not have; without it the host refuses with key_not_found.
  bool ignore_missing = 12;
  // ExpectedFingerprints is the list the operator saw when ordering a
  // replace; the host refuses with stale_plan when the account has
  // another list by now.
  repeated string expected_fingerprints = 13;
  // AllowLockout permits taking the last key of an account with no
  // password login; without it the host refuses with last_key_lockout.
  bool allow_lockout = 14;
  // ManagedFile edits the panel's file under /etc/ssh/authorized_keys.d
  // instead of the user's authorized_keys.
  bool managed_file = 15;
  // System says the order means a system account (outside the UID range
  // of people); a create allocates the account below that range.
  bool system = 16;
  // Inactive acknowledges a create with no key: the account gets no way
  // in and is created locked.
  bool inactive = 17;
}

// SSHKeyInput is one key to add: the public key as the file takes it and
// an optional comment appended when the key carries none.
message SSHKeyInput {
  string public_key = 1;
  string comment = 2;
}

message LocalUserResult {
  string name = 1;
  // Changed tells a real change from conformance with the requested state.
  bool changed = 2;
  // Account is the account state after the operation. Empty when the
  // account does not exist.
  LocalAccount account = 3;
  // The keys of the account before and after a key operation, by
  // fingerprint, and the difference: what the plan named and what the
  // host did. A repeat of an add has an empty added list.
  repeated string fingerprints_before = 4;
  repeated string fingerprints_after = 5;
  repeated string keys_added = 6;
  repeated string keys_removed = 7;
}

// PackagesRepair unblocks package operations on the host.
//
// The operation carries the answers to the configuration questions that
// blocked a package. The answers come from the operator, not from the panel:
// picking the boot device or the way configuration files are handled is a
// decision a machine should not make for a human.
//
// Without answers the operation merely retries finishing the configuration
// - that is enough when the previous transaction was interrupted.
message PackagesRepair {
  repeated DebconfAnswer answers = 1;
}

message DebconfAnswer {
  string package = 1;
  string question = 2;
  // The question type as debconf understands it: select, multiselect,
  // boolean, string.
  string type = 3;
  string value = 4;
}

message PackageRepairResult {
  string manager = 1;
  // Packages that still block package operations after the repair.
  repeated BlockedPackage still_blocked = 2;
  // Questions an answer was actually set for.
  repeated string answered = 3;
  bool repaired = 4;
}

message CancelTask {
  string task_id = 1;
  string reason = 2;
  // request_revision names the delivery the cancel is about - the number
  // of the attempt the panel holds - so that an acknowledgement is read
  // against the request that asked for it.
  uint64 request_revision = 3;
  // deadline_unix is when the panel stops waiting for the acknowledgement
  // and settles the task as unknown; the agent answers before it or the
  // answer is only a note on the trail.
  int64 deadline_unix = 4;
}

// CancelAck is the agent's answer to a CancelTask. A cancel is not a
// state the panel writes on its own: the host says what the request
// found - a task that never started, one it interrupted, one in a phase
// that has to finish, or one whose result is already in its journal.
message CancelAck {
  string task_id = 1;
  enum Outcome {
    // The task had not begun on the host; it will not begin.
    NOT_STARTED = 0;
    // The task was under way in a phase the agent may interrupt, and was.
    INTERRUPTED = 1;
    // The task is in a phase that must run to its end - a transaction
    // inside the helper; the request was noted and the result follows.
    NOT_INTERRUPTIBLE = 2;
    // The result is already in the journal of the host.
    ALREADY_DONE = 3;
  }
  Outcome outcome = 2;
  // phase says what the host was doing when the request arrived.
  string phase = 3;
  // observed_result_hash is the SHA-256 of the deterministic encoding of
  // the TaskResult the journal holds, with ALREADY_DONE; empty otherwise.
  bytes observed_result_hash = 4;
}

// FinalTask tells the agent the host is leaving the fleet. From this message
// on the agent refuses every new task, drops its secret leases and lets the
// tasks under way finish; then it answers with FinalReady.
message FinalTask {
  string reason = 1;
  // Whether the commit that follows will wipe the identity on the host. The
  // agent learns it now so that it can say in FinalReady whether it is able
  // to - the helper may be absent on a host that only reads.
  bool local_identity_wipe = 2;
  // How long the agent may wait for the running tasks before it answers
  // anyway. Zero means the agent's default.
  uint32 grace_seconds = 3;
}

// FinalReady is the agent's answer to FinalTask.
message FinalReady {
  // The attempts still running when the agent stopped waiting. Empty means
  // the host is idle; a non-empty list is not a refusal - the panel goes on
  // and records which operations were cut short.
  repeated string running_tasks = 1;
  // Whether the secret leases were dropped: no secret is fetched from now
  // on, and none is kept in memory.
  bool leases_dropped = 2;
}

// FinalCommit closes the handshake. The panel has revoked the certificates
// by now; the agent wipes its identity and journal, disables its service and
// exits. Without a wipe it only exits.
message FinalCommit {
  bool local_identity_wipe = 1;
  string reason = 2;
}

// TaskLogLines carries a piece of the journal preview. The lines are
// transient: they are not recorded and do not replace the operation result.
message TaskLogLines {
  string task_id = 1;
  repeated string lines = 2;
  // Dropped says how many lines were skipped when the host produced them
  // faster than the rate limit allows. A quiet skip would make the operator
  // believe they see everything.
  uint32 dropped = 3;
}

// TaskProgress carries the progress of an operation that lasts long enough
// for the operator to need to see where it stands. Progress is transient: it
// does not replace the result, it is not recorded and the result must not be
// inferred from it.
//
// Progress is described by fields, not by the raw tool output. A byte stream
// from apt would land on the operator's screen without any content control,
// and still could not be shown as a bar.
message TaskProgress {
  string task_id = 1;
  bytes chunk = 2;
  bool stderr = 3;
  // The step and the step count, when the tool gives them. Zero means
  // unknown and must not be shown as zero steps.
  uint32 step = 4;
  uint32 total = 5;
  // The percentage given separately, because apt knows the percentage
  // without steps, and dnf the steps without a percentage. A missing field
  // means undetermined progress.
  optional uint32 percent = 6;
  // What is happening right now, e.g. "Upgrading nfs-utils".
  string message = 7;
  // Stage names what kind of report this is, when that matters more than
  // the step. Empty is an ordinary progress line of a running operation.
  //
  // The acknowledgement of a task travels as stages of the same message,
  // in this order, each sent at most once per attempt:
  //
  // "accepted" - the agent holds the task and will carry it out: the
  // envelope passed the checks that refuse a task without touching the
  // host (expiry, preconditions, capability, the plan hash), and the task
  // is about to queue for the resources of the host. It is the answer the
  // panel's dispatch lease waits for; an envelope that gets no "accepted"
  // went into a dead stream and is delivered again. Nothing on the host
  // has changed yet.
  //
  // "awaiting_lock" - the task waits for a resource another task of this
  // host holds. message names the blocker, e.g. "units held by task <id>
  // (schedule.run_now)". Repeated at most every ten seconds while the wait
  // lasts; the wait itself ends with "started" or with a resource_busy
  // result.
  //
  // "started" - the claims are taken and the operation is starting on the
  // host this instant: for a mutation the in-flight marker is in the
  // journal and the module is about to run. claims lists the resources
  // held. From here on the outcome is the host's, and a lost session means
  // an unknown outcome, not a task to repeat.
  //
  // "in_progress" is the answer to a redelivered task: the panel gave up
  // on the attempt that started the operation (its lease ran out) and sent
  // the same idempotency key again, while this agent is still carrying it
  // out. Nothing is repeated and nothing is refused: the report says the
  // attempt is alive, and the result follows under both attempt
  // identifiers when the operation ends.
  string stage = 8;
  // The identifier of the attempt that started the operation, given with
  // the "in_progress" stage. task_id is the redelivered attempt; this is
  // the one whose execution it is waiting on, so that the panel sees the
  // two attempts as one execution rather than as a repeat.
  string previous_task_id = 9;
  // The resources the task holds, given with the "started" stage: the
  // lock classes of the operation registry ("packages", "units", ...),
  // "host" for a restart, "file:<path>" for a file. Empty for a read,
  // which takes nothing. The panel shows them next to a host that others
  // wait on.
  repeated string claims = 10;
}

message TaskResult {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_SUCCEEDED = 1;
    STATUS_FAILED = 2;
    STATUS_TIMED_OUT = 3;
    // Rejected locally: unmet preconditions, a taken lock, a wrong version.
    STATUS_REJECTED = 4;
    // Arrived after the TTL and was not executed.
    STATUS_EXPIRED = 5;
    STATUS_CANCELED = 6;
  }

  string task_id = 1;
  string idempotency_key = 2;
  Status status = 3;
  int32 exit_code = 4;
  bytes stdout = 5;
  bytes stderr = 6;
  bool output_truncated = 7;
  // A stable machine code, independent of the language and the tool version.
  string error_code = 8;
  string message = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp finished_at = 11;
  // The unit state before and after the change lets "restart done" be told
  // from "restart done and the unit still does not run".
  UnitState unit_state_before = 12;
  UnitState unit_state_after = 13;
  // True when the result comes from the local idempotency journal.
  bool replayed = 14;

  // The result specific to the operation type. Every operation has a typed
  // result, not only text for a human to read.
  oneof detail {
    PackagePlanResult package_plan = 20;
    PackageApplyResult package_apply = 21;
    UnitStatusResult unit_status = 22;
    DomainEnrollResult domain_enroll = 23;
    LocalUserResult local_user = 24;
    PackageRepairResult package_repair = 25;
  }
  DockerReadResult docker_result = 26;
  DockerEventsResult docker_events_result = 49;
  DockerActionResult docker_action_result = 27;
  ComposeResult compose_result = 28;
  LogFileResult log_file_result = 29;
  ProcessListResult process_list_result = 30;
  ProcessSignalResult process_signal_result = 31;
  ScheduleResult schedule_result = 32;
  NetworkResult network_result = 33;
  DnsResult dns_result = 34;
  FirewallResult firewall_result = 35;
  StorageResult storage_result = 36;
  SshResult ssh_result = 37;
  KernelResult kernel_result = 38;
  FileResult file_result = 39;
  TimeResult time_result = 40;
  PowerResult power_result = 41;
  SecurityResult security_result = 42;
  CertificateResult certificate_result = 43;
  RepositoryResult repository_result = 44;
  BackupResult backup_result = 45;
  MonitoringResult monitoring_result = 46;
  InstalledPackagesResult installed_packages_result = 47;
  InventoryRefreshResult inventory_refresh_result = 48;
  SmartResult smart_result = 50;
  DockerLogsResult docker_logs_result = 51;
  HostnameResult hostname_result = 52;
  KeytabRenewResult keytab_renew_result = 53;
  // The verifier's word on a mutation: the host was read after the apply
  // and compared with what the payload or the plan promised. A change
  // whose verifier failed ends STATUS_FAILED with the code
  // applied_unverified; the verification says what was expected and what
  // was found. Absent on a read, on a refusal and on a result from an
  // agent from before the field.
  Verification verification = 54;
  DockerEnsureResult docker_ensure_result = 55;
}

// Verification is the read of the host after a change, compared with what
// the operator asked for. Only a verified change is a success: an exit
// code says a tool ran, the verification says the state is there.
message Verification {
  // The verifier of the operation contract (opspec.Verifier): unit_state,
  // package_versions, file_content, mount_state, hostname, sysctl, ...
  // "none" for an operation whose result is the observation.
  string verifier = 1;
  // Whether the observed state is the expected one.
  bool verified = 2;
  // Why it did not verify, or what the verifier could not read; on a
  // rollback the reason says the previous state was put back. Empty on
  // a verified change.
  string reason = 3;
  // The state found, in the words of the verifier: "active (running)",
  // "sha256:...", "absent". Never the content of a file or a secret.
  string observed = 4;
  // The state the payload or the plan promised, in the same words.
  string expected = 5;
}

// InventoryRefreshResult carries the proof of the refresh.
//
// Accepting the job alone proves nothing: the read could fail or not
// arrive. The proof is the revision of the image that came out of that read.
message InventoryRefreshResult {
  string revision = 1;
  // Changed says whether the image differs from the previous one. No change
  // is not an error: a host that did not change is a true answer.
  bool changed = 2;
  // Modules lists what was really read. Empty means the whole inventory.
  repeated string modules = 3;
}

// UnitState separates the states systemd tells apart and UIs often glue
// together. Thanks to that "running" does not hide a unit in an auto-restart
// loop.
message UnitState {
  string name = 1;
  string load_state = 2;
  string active_state = 3;
  string sub_state = 4;
  string unit_file_state = 5;
  string result = 6;
  uint32 main_pid = 7;
  uint32 n_restarts = 8;
}


// PackagePlan computes what would be updated. It does not change the system
// state beyond an optional refresh of the repository metadata.
message PackagePlan {
  // A metadata refresh requires root and a lock, so it is an explicit
  // choice, not a side effect of every plan.
  bool refresh_metadata = 1;
  // An empty list means all available updates.
  repeated string only_packages = 2;
  bool security_only = 3;
  // The plan kind: upgrade (the default), install or remove. A removal plan
  // computes something else, but answers the same question: what this
  // operation changes.
  string mode = 4;
}

// PackageUpgrade carries out a package manager transaction.
message PackageUpgrade {
  // The plan hash computed by the agent at planning. A mismatch means the
  // repository metadata changed between the plan and the execution.
  bytes plan_hash = 1;
  // An empty list means all the packages from the plan.
  repeated string packages = 2;
  bool security_only = 3;
  // The approved plan envelope the execution is bound to: its header,
  // so the host rebuilds the same envelope, and its elements, so a
  // refusal names the element that moved. The hash above is the digest
  // of that envelope.
  PackagePlanReference plan_reference = 4;
}

// PackagePlanReference is what an execution carries of the approved plan
// envelope. The content is not carried in full - the host computes it
// again right before the change, that is the point - only the header the
// planner does not compute from the host and the elements the operator
// approved. The agent cannot change the expected digest: the reference
// travels in the payload the panel's capability signs.
message PackagePlanReference {
  uint32 schema_version = 1;
  string planner_version = 2;
  string inventory_revision = 3;
  string resource_revision = 4;
  // The expiry as the payload spells it (RFC 3339), carried verbatim: the
  // agent rebuilds the payload from this envelope and hashes it against
  // the panel's digest, so every field has to come back byte for byte.
  string expires_at = 5;
  repeated PackageChange changes = 6;
}

// PackageChange describes one element of a plan or of a result: what
// happens to one package, at which version, from where, in which
// architecture and in which direction.
message PackageChange {
  string name = 1;
  string current_version = 2;
  string candidate_version = 3;
  string origin = 4;
  bool security = 5;
  // The architecture of the candidate; empty when the manager did not
  // say, never "any".
  string architecture = 6;
  // install, upgrade, downgrade or remove.
  string action = 7;
  // requested, dependency or orphan: why the element is in the plan.
  string reason = 8;
  bool blocked = 9;
  bool protected = 10;
  // How the installed files of the package grow or shrink; meaningful
  // only when known.
  int64 installed_delta_bytes = 11;
  bool installed_delta_known = 12;
  // The checksum of the archive as the index publishes it
  // ("sha256:..."); empty when the index carries none.
  string digest = 13;
  // In a result: achieved or missed for an expected effect of the plan,
  // unplanned for a change the plan did not name. Empty in a plan.
  string effect = 14;
  // In a result: the version found after the transaction, or "absent".
  string observed_version = 15;
}

message PackagePlanResult {
  string manager = 1;
  repeated PackageChange changes = 2;
  uint64 download_bytes = 3;
  uint64 disk_available_bytes = 4;
  // The hash of the plan content; the execution compares it with its own, so
  // as not to apply a different package set than the approved one.
  bytes plan_hash = 5;
  bool reboot_predicted = 6;
  // True when the metadata was refreshed as part of this plan.
  bool metadata_refreshed = 7;
  // Packages blocking transactions: waiting for their configuration to be
  // finished or broken. As long as such a package exists, no update on this
  // host succeeds, because the package manager first tries to finish its
  // configuration.
  repeated BlockedPackage blocked = 8;
  string mode = 9;
  // Packages that would go away together with the named ones. Removing one
  // package can pull dozens of dependants.
  repeated string removals = 10;
  // Protected packages that ended up in the plan. Their presence means the
  // operation will not be carried out.
  repeated string protected = 11;
  // The space the change needs, per filesystem it touches: the download
  // cache, the package database and the files themselves, and /boot when a
  // kernel is among the changes. The helper refuses a change whose need
  // exceeds what is free, before the transaction starts.
  repeated SpaceFact space = 12;
  // The header of the plan envelope: who made the plan, for which host and
  // picture of it, against which repository metadata, and until when it
  // holds. plan_hash above is the digest of the envelope over all of it.
  uint32 schema_version = 13;
  string planner_version = 14;
  string host_id = 15;
  string inventory_revision = 16;
  string resource_revision = 17;
  int64 expires_at_unix = 18;
  // How the change could be taken back: the mechanism and its identifier,
  // or unavailable with the reason.
  string rollback_mechanism = 19;
  string rollback_id = 20;
  bool rollback_available = 21;
  string rollback_reason = 22;
  // The whole envelope in its canonical JSON (RFC 8785): what the digest
  // was computed over, kept by the panel as the plan body next to the
  // approval.
  bytes envelope = 23;
  // The plan in words for the screen; outside the digest.
  string description = 24;
}

// SpaceFact is what a package change needs on one filesystem against what
// the filesystem has. A need that could not be sized says so in its basis,
// and is reported rather than judged.
message SpaceFact {
  string path = 1;
  // The mount point the path lives on: needs on one filesystem add up.
  string filesystem = 2;
  uint64 available_bytes = 3;
  uint64 needed_bytes = 4;
  // download, install or boot.
  string purpose = 5;
  // How the need was sized: download_size, installed_size, download_only,
  // boot_files or unknown.
  string basis = 6;
}

// BlockedPackage describes a package blocking package operations together
// with the configuration questions nobody answered.
//
// Without those questions the operator knows only that something is wrong;
// with them they see which decision they have to make. The panel does not
// guess the answers: the choice may concern, for example, the device the
// bootloader is written to.
message BlockedPackage {
  string name = 1;
  string status = 2;
  repeated DebconfQuestion questions = 3;
}

message DebconfQuestion {
  string name = 1;
  string value = 2;
  // Answered says whether the question already has an answer the system
  // considers given. Empty does not mean "no": the state may have been
  // impossible to determine.
  optional bool answered = 3;
}

message PackageApplyResult {
  string manager = 1;
  // The versions before and after the transaction are always recorded, also
  // on failure.
  repeated PackageChange applied = 2;
  bool reboot_required = 3;
  // Units needing a restart after a library update.
  repeated string services_needing_restart = 4;
  // True when after the failure dpkg was left in a state needing repair.
  // Further campaigns on this host must be paused.
  bool package_database_broken = 5;
  // Packages waiting for their configuration to be finished or broken.
  //
  // The bare information "the package database needs repair" does not tell
  // the operator what to do. The typical case is a package with an
  // unanswered configuration question, for example a bootloader asking for
  // the target device: every next transaction first tries to configure it
  // and fails, even when there is nothing to update.
  repeated string packages_needing_attention = 6;
  // What the adapter repaired itself before retrying the transaction. It
  // repairs on its own only what has one correct answer - a corrupted file
  // in the cache. A package configuration question has none and stays for
  // the operator.
  repeated string self_repair = 7;
  // The tail of the tool output on failure. One sentence says something
  // failed; the context says why, and logging into the host after every
  // failed transaction is what the panel is to spare.
  repeated string output = 8;
  // Packages whose maintainer scriptlet failed inside a transaction that
  // the manager still counts as done. rpm treats a failed %post as
  // non-fatal: the files are on disk, the database lists the package, and
  // only the script did not do its part. The transaction is a success with
  // a defect, and the defect is named rather than hidden in the output.
  repeated string scriptlet_errors = 9;
}


// DockerRead orders a read of the container engine state. The scope follows
// from the operation, not from a parameter: a light read and a full read
// have a different price for the host, so they cannot be the same operation.
message DockerRead {}

// ReadDockerEvents orders a read of the container engine event log.
//
// The read is closed in a time window and in limits. A job that reads
// events "until further notice" would stay on the host forever - and the
// operator asks anyway about what happened around one failure.
message ReadDockerEvents {
  // SinceSeconds says how far back to reach.
  uint32 since_seconds = 1;
  // FollowSeconds extends the read beyond the present moment. Zero means the
  // past log alone - the job ends at once.
  uint32 follow_seconds = 2;
  // Types limits the event kinds: container, image, network, volume. An
  // empty list means all four.
  repeated string types = 3;
  // MaxEvents bounds the number of returned events.
  uint32 max_events = 4;
}

// DockerAction orders one operation on the container engine.
message DockerAction {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_START = 1;
    OPERATION_STOP = 2;
    OPERATION_RESTART = 3;
    OPERATION_REMOVE = 4;
    OPERATION_PULL_IMAGE = 5;
    OPERATION_PRUNE = 6;
  }
  Operation operation = 1;
  string container_id = 2;
  uint32 timeout_seconds = 3;
  bool remove_volumes = 4;
  string image_reference = 5;
  repeated string image_ids = 6;
  repeated string volume_names = 7;
  repeated string network_ids = 8;
  // The container name serves the confirmation and the audit. It is part of
  // the payload, so it must reach the agent - otherwise the plan hash stops
  // matching and the operation is rejected as swapped.
  string container_name = 9;
}

// UnitToggle changes what the host does after a reboot: enabling a unit or
// masking it. The field is a desired value, not a toggle - repeating the
// operation does not reverse the change.
message UnitToggle {
  enum Property {
    PROPERTY_UNSPECIFIED = 0;
    PROPERTY_ENABLED = 1;
    PROPERTY_MASKED = 2;
  }
  string unit = 1;
  Property property = 2;
  bool value = 3;
}

// ScheduleAction describes an operation on a scheduled job.
message ScheduleAction {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_ENSURE = 1;
    OPERATION_DISABLE = 2;
    OPERATION_REMOVE = 3;
    OPERATION_RUN_NOW = 4;
    OPERATION_READ = 5;
    // A preview of the next runs of an expression, computed on the host in
    // its time zone. Nothing is written.
    OPERATION_PREVIEW = 6;
  }
  Operation operation = 1;
  string id = 2;
  string expression = 3;
  repeated string command = 4;
  string user = 5;
  string comment = 6;
  bool enabled = 7;
  bool adopt = 8;
  // Kind names the mechanism a managed entry is written with: "cron" for a
  // file in /etc/cron.d, "timer" for a pair of systemd units, "any" to let
  // the host pick the one it has. Empty means cron, which is what the
  // panels from before the timers ordered.
  string kind = 9;
}

message ScheduleResult {
  bytes snapshot = 1;
  string message = 2;
  // Preview is the JSON answer of schedule.preview: the expression, the
  // host time zone and the next runs. Separate from the snapshot, because
  // a preview is not the state of the host.
  bytes preview = 3;
}

// NetworkAction describes a change of the host network configuration. Every
// change is armed with a local rollback on the host side.
message NetworkAction {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_READ = 1;
    OPERATION_SET_MTU = 2;
    OPERATION_ENSURE_ROUTES = 3;
    OPERATION_APPLY_PROFILE = 4;
    OPERATION_CONFIRM = 5;
    OPERATION_ROLLBACK = 6;
    // The change plan computed on the host without touching the
    // configuration.
    OPERATION_PLAN = 7;
    // A layered interface built or changed, and one taken away: a bond, a
    // bridge or a VLAN. The host refuses a layer its mechanism cannot
    // express rather than writing half of one.
    OPERATION_APPLY_LINK = 8;
    OPERATION_REMOVE_LINK = 9;
  }
  Operation operation = 1;
  string interface = 2;
  string mtu = 3;
  repeated string routes = 4;
  string method = 5;
  repeated string addresses = 6;
  string gateway = 7;
  repeated string dns = 8;
  uint32 rollback_seconds = 9;
  string rollback_id = 10;
  // The fingerprint of the plan approved by the operator; the host computes
  // it once more.
  string plan_hash = 11;
  // The second family, ordered to the same standard as the first: its own
  // method, addresses with their prefix length, a default gateway that may
  // be link-local, and the router advertisement and privacy switches. An
  // empty method leaves the family as the host has it.
  string method6 = 12;
  repeated string addresses6 = 13;
  string gateway6 = 14;
  string accept_ra = 15;
  string privacy = 16;
  // The layering ordered by OPERATION_APPLY_LINK, and by OPERATION_PLAN
  // when the plan is about a layer.
  NetworkLink link = 17;
  // LinkRemove marks the plan of a removal; the removal itself names the
  // interface in the interface field.
  bool link_remove = 18;
}

// NetworkLink describes a layered interface: a bond, a bridge or a VLAN.
// It is the target state of one link, never the steps to reach it.
message NetworkLink {
  string name = 1;
  // Kind is bond, bridge or vlan.
  string kind = 2;
  repeated string members = 3;
  // The bond settings. MiimonMs zero switches the link monitoring off,
  // which is a decision and not a missing value.
  string mode = 4;
  uint32 miimon_ms = 5;
  string primary = 6;
  string lacp_rate = 7;
  // The bridge settings.
  bool stp = 8;
  bool vlan_filtering = 9;
  // The VLAN settings.
  string parent = 10;
  uint32 vlan_id = 11;
  string protocol = 12;
  string mtu = 13;
}

message NetworkResult {
  bytes profiles = 1;
  string message = 2;
  string rollback_id = 3;
  string rollback_deadline = 4;
  // Confirmed says whether the agent managed to confirm connectivity before
  // the deadline. False for a change that succeeded means a host rolled back
  // by the timer.
  bool confirmed = 5;
  // The change plan in JSON form for OPERATION_PLAN.
  bytes plan = 6;
}

// DnsAction describes an operation on the host resolver.
message DnsAction {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    // A name resolution test from the host. The panel's answer says nothing
    // about what the host sees, so the host asks the question.
    OPERATION_RESOLVE_TEST = 1;
    OPERATION_APPLY = 2;
    // The resolver change plan computed on the host without touching the
    // configuration.
    OPERATION_PLAN = 3;
  }
  Operation operation = 1;
  string interface = 2;
  repeated string servers = 3;
  repeated string search_domains = 4;
  bool ignore_auto_dns = 5;
  uint32 rollback_seconds = 6;
  repeated string names = 7;
  // The fingerprint of the plan approved by the operator; the host computes
  // it once more.
  string plan_hash = 8;
}

message DnsResult {
  // The query results in JSON form. The structure belongs to the DNS module.
  bytes queries = 1;
  bytes profiles = 2;
  string message = 3;
  string rollback_id = 4;
  string rollback_deadline = 5;
  bool confirmed = 6;
  // The change plan in JSON form for OPERATION_PLAN.
  bytes plan = 7;
}

// FirewallAction describes an operation on the host firewall.
message FirewallAction {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_READ = 1;
    OPERATION_RULE_ENSURE = 2;
    OPERATION_RULE_REMOVE = 3;
    OPERATION_ZONE_PORT = 4;
    OPERATION_ZONE_SERVICE = 5;
    OPERATION_RESTORE = 6;
    // Computing the difference between the found and the requested rule,
    // without a change.
    OPERATION_PLAN = 7;
  }
  Operation operation = 1;
  string rule_id = 2;
  string chain = 3;
  string action = 4;
  string protocol = 5;
  repeated string ports = 6;
  repeated string sources = 7;
  string interface = 8;
  string comment = 9;
  string zone = 10;
  string service = 11;
  bool enable = 12;
  bool break_glass = 13;
  uint32 rollback_seconds = 14;
  string rollback_id = 15;
  string expected_hash = 16;
}

message FirewallResult {
  bytes snapshot = 1;
  string message = 2;
  string rollback_id = 3;
  string rollback_deadline = 4;
  bool confirmed = 5;
  // Plan describes the difference between the found and the requested rule,
  // in JSON.
  bytes plan = 6;
}

// StorageAction describes an operation on the host storage.
message StorageAction {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_READ = 1;
    OPERATION_MOUNT_ENSURE = 2;
    OPERATION_MOUNT_REMOVE = 3;
    OPERATION_FS_CHECK = 4;
    OPERATION_LVM_EXTEND = 5;
    OPERATION_FS_RESIZE = 6;
    OPERATION_FS_CREATE = 7;
    OPERATION_DISK_WIPE = 8;
    // Computing the difference between the found and the requested mount,
    // without a change.
    OPERATION_MOUNT_PLAN = 9;
    // The plan of a check or an extension of a filesystem or a volume.
    OPERATION_DEVICE_PLAN = 10;
    // The SMART health and attributes of one device. A read; it changes
    // nothing and takes no lock.
    OPERATION_SMART_READ = 11;
    // 12 is the helper's own read of the arrays, which the panel never
    // orders directly: the agent assembles the picture and sends it with
    // every storage read. The numbers are kept parallel with the helper's
    // enum so the two tables read against each other.
    reserved 12;
    // The member operations of a software array that exists. Creating an
    // array and destroying one are deliberately absent: that is a decision
    // about a machine's whole disk layout, taken when the machine is built,
    // not an operation run over a running fleet.
    OPERATION_RAID_MEMBER_FAIL = 13;
    OPERATION_RAID_MEMBER_REMOVE = 14;
    OPERATION_RAID_MEMBER_ADD = 15;
    // LVM beyond growing a volume: a new volume in an existing group, a new
    // disk under a group, a snapshot and its removal, and the removal of a
    // volume, which deletes what stood on it.
    OPERATION_LVM_LV_CREATE = 16;
    OPERATION_LVM_LV_REMOVE = 17;
    OPERATION_LVM_VG_EXTEND = 18;
    OPERATION_LVM_SNAPSHOT_CREATE = 19;
    OPERATION_LVM_SNAPSHOT_REMOVE = 20;
  }
  Operation operation = 1;
  string source = 2;
  string target = 3;
  string fs_type = 4;
  string options = 5;
  bool persist = 6;
  string device = 7;
  string expected_uuid = 8;
  bool repair = 9;
  // The device identity the plan expects. The path alone is not enough:
  // /dev/sdb after a reboot can be a different disk than the one the
  // operator looked at.
  string expected_serial = 10;
  uint64 expected_size_bytes = 11;
  string size = 12;
  string label = 13;
  // Plan names the kind of the planned device operation.
  string plan = 14;
  // The fingerprint of the plan approved by the operator; the host computes
  // it once more.
  string plan_hash = 15;
  // The stable identity of the device a destructive operation binds to: the
  // /dev/disk/by-id link and the WWN from the plan. The host compares them
  // with the device under the path right before the change; the size is a
  // description, never an identity.
  string expected_by_id = 16;
  string expected_wwn = 17;
  // The software array a member operation acts on, and the identity out of
  // its superblock: the one name of an array that means the same array
  // after a reboot. The member itself travels in device.
  string array = 18;
  string expected_array_uuid = 19;
  // The LVM volume group an operation acts in, and its identity. A group
  // name is a label another group can carry after a rename.
  string group = 20;
  string expected_group_uuid = 21;
  // The name of the logical volume being created, and the identity of the
  // volume an operation removes or takes a snapshot of.
  string volume = 22;
  string expected_volume_uuid = 23;
}

message StorageResult {
  bytes snapshot = 1;
  string message = 2;
  string output = 3;
  // Plan describes the difference between the found and the requested
  // mount, in JSON.
  bytes plan = 4;
}

// SshAction describes an operation on the sshd server.
message SshAction {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_READ = 1;
    OPERATION_APPLY = 2;
    OPERATION_ROTATE_HOSTKEY = 3;
    // The change plan computed on the host without touching the
    // configuration.
    OPERATION_PLAN = 4;
  }
  Operation operation = 1;
  string port = 2;
  string permit_root_login = 3;
  string password_authentication = 4;
  string pubkey_authentication = 5;
  string kbd_interactive_authentication = 6;
  string max_auth_tries = 7;
  repeated string allow_users = 8;
  repeated string allow_groups = 9;
  repeated string deny_users = 10;
  bool allow_lockout = 11;
  string key_type = 12;
  // The fingerprint of the plan approved by the operator; the host computes
  // it once more.
  string plan_hash = 13;
}

message SshResult {
  bytes snapshot = 1;
  string message = 2;
  repeated string mismatches = 3;
  // The change plan in JSON form for OPERATION_PLAN.
  bytes plan = 4;
}

// SecurityAction describes an operation of the security module.
//
// A scan gathers facts, not assessments: conformance with the profile is
// computed by the panel, because that is where the versioned checks are and
// where the whole fleet is visible.
message SecurityAction {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_SCAN = 1;
    OPERATION_SELINUX_MODE = 2;
    OPERATION_AUDIT_RELOAD = 3;
  }
  Operation operation = 1;
  string mode = 2;
}

message SecurityResult {
  bytes snapshot = 1;
  string message = 2;
}

// ListPackages orders the full list of installed packages.
//
// The list is large and changes rarely, so it does not travel in every
// inventory cycle: the inventory carries only the digest, and the panel asks
// for the content only when its copy stops describing that digest.
message ListPackages {
}

message InstalledPackagesResult {
  // Packages carries the list in JSON form: name, epoch, version, release,
  // architecture and source package - the complete set needed for the
  // correlation with the distribution security tracker.
  bytes packages = 1;
  string digest = 2;
  uint32 count = 3;
  string manager = 4;
  string unavailable_reason = 5;
  // Advisories carries the vendor advisories known to the host from the
  // repository metadata - for dnf they are the deciding source, because they
  // speak of versions from the same repositories the host takes packages
  // from. These are facts, not an assessment: whether they concern this
  // host is decided by the panel.
  bytes advisories = 6;
  string advisories_unavailable_reason = 7;
}

// MonitoringProbe describes a probe carried out from the host.
//
// A probe answers the question central monitoring cannot ask: what this
// host sees. It changes nothing and needs no root.
message MonitoringProbe {
  // Kind: http or tcp.
  string kind = 1;
  string target = 2;
  int32 expect_status = 3;
  string expect_body = 4;
  int32 timeout_seconds = 5;
}

message MonitoringResult {
  bytes probe = 1;
  string message = 2;
}

// BackupAction describes a backup operation.
//
// Backup data does not flow through the panel: the host talks to the
// repository directly. The envelope holds the definition metadata and
// references to credentials - never the credentials themselves.
message BackupAction {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_PLAN = 1;
    OPERATION_RUN = 2;
    OPERATION_VERIFY = 3;
    OPERATION_RESTORE = 4;
  }
  Operation operation = 1;
  string id = 2;
  string tool = 3;
  string repository = 4;
  repeated string paths = 5;
  repeated string excludes = 6;
  repeated string tags = 7;
  int32 keep_last = 8;
  int32 keep_daily = 9;
  int32 keep_weekly = 10;
  int32 keep_monthly = 11;
  bool prune = 12;
  // Runbook points at a script already lying on the host. The panel does
  // not send its content.
  string runbook = 13;
  // Initialize is consent to initialise the repository at the first copy.
  bool initialize = 21;
  SecretRef password_secret = 14;
  // EnvSecrets maps environment variables to secrets from the store.
  map<string, SecretRef> env_secrets = 15;
  bool read_data = 16;
  // Restore: the target and the overwrite policy are mandatory.
  string snapshot_id = 17;
  string target = 18;
  repeated string include = 19;
  string overwrite = 20;
  // Plan names the kind of the planned operation: run or verify.
  string plan = 23;
  // The fingerprint of the plan approved by the operator; the host computes
  // it once more.
  string plan_hash = 22;
}

message BackupResult {
  // State carries the repository state after a plan operation.
  bytes state = 1;
  // Outcome carries the result of a changing operation.
  bytes outcome = 2;
  string message = 3;
  // The backup plan in JSON form for OPERATION_PLAN with a scope.
  bytes plan = 4;
  // Verified says that after the copy the host checked the repository.
  bool verified = 5;
}

// RepositoryAction describes a package source.
//
// The source key travels in the envelope, because it is public material and
// the plan is to show whom the host will trust. The password is not in the
// envelope: there is a reference to the store, which the host reaches for
// only at the write.
message RepositoryAction {
  string id = 1;
  string name = 2;
  string url = 3;
  repeated string suites = 4;
  repeated string components = 5;
  repeated string architectures = 6;
  bool enabled = 7;
  int32 priority = 8;
  // GPGKey is the public key of the source in an ASCII armour.
  string gpg_key = 9;
  // AllowUnsigned is consent to a source whose signatures the host does not
  // check.
  bool allow_unsigned = 10;
  string username = 11;
  SecretRef password_secret = 12;
  // Remove removes the source together with its key and password.
  bool remove = 13;
}

message RepositoryResult {
  // Snapshot carries the sources seen on the host after the change.
  bytes snapshot = 1;
  string message = 2;
  // GpgKeyFingerprint is the fingerprint of the key that really landed on
  // the host. Only a human can compare it with the vendor's fingerprint.
  string gpg_key_fingerprint = 3;
  // RolledBack says the host went back to the previous source description.
  bool rolled_back = 4;
}

// CertificateTarget points at a certificate file together with what the
// panel knows about it.
//
// The binding "this file is read by this service" is not the host's guess:
// a human types it in the panel, because only they know it.
message CertificateTarget {
  string path = 1;
  string key_path = 2;
  string service = 3;
}

// CertificateAction describes an operation of the certificates module.
//
// A scan looks only at the named files and at what the host tracks itself:
// searching the whole filesystem finds the trust store instead of service
// certificates. The private key does not travel in the envelope - there is
// a reference to the store in it, which the host reaches for only at
// execution.
message CertificateAction {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_SCAN = 1;
    OPERATION_DEPLOY = 2;
    OPERATION_RENEW = 3;
    // The deployment plan computed on the host, without reaching for the
    // private key.
    OPERATION_PLAN = 4;
    // The trust store: the plan of an authority rotation step and the step
    // itself.
    OPERATION_TRUST_PLAN = 5;
    OPERATION_TRUST_ENSURE = 6;
    OPERATION_TRUST_REMOVE = 7;
  }
  Operation operation = 1;
  repeated CertificateTarget targets = 2;
  string path = 3;
  string key_path = 4;
  // Certificate is public content: the certificate together with its chain.
  string certificate = 5;
  SecretRef key_secret = 6;
  string owner = 7;
  string group = 8;
  string mode = 9;
  string key_mode = 10;
  // ReloadUnit is the service that is to read the new file.
  string reload_unit = 11;
  // ProbeTarget is the address at which the host checks the deployment
  // result.
  string probe_target = 12;
  // Request points at the certmonger request for a renewal.
  string request = 13;
  // The fingerprint of the plan approved by the operator; the host computes
  // it once more.
  string plan_hash = 14;
  // AnchorId names the panel anchor in the host trust store.
  string anchor_id = 15;
}

message CertificateResult {
  bytes snapshot = 1;
  string message = 2;
  // Fingerprint is the fingerprint of the certificate that really landed on
  // the host - not of the one the panel sent.
  string fingerprint_sha256 = 3;
  string not_after = 4;
  // Probe carries the service answer after the reload.
  bytes probe = 5;
  // RolledBack says the host went back to the previous file. A deployment
  // that rolled back must not look like a deployment that failed halfway.
  bool rolled_back = 6;
  // The deployment plan in JSON form for OPERATION_PLAN.
  bytes plan = 7;
  // Trust carries the host trust store in JSON form.
  bytes trust = 8;
}

// TimeAction describes an operation on the host time.
//
// The test is a separate operation, not part of the change: a time server
// has to be checked before the host is deprived of a source that works.
message TimeAction {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_SYNC_TEST = 1;
    OPERATION_CONFIG_APPLY = 2;
    OPERATION_TIMEZONE_SET = 3;
    // The time source change plan computed on the host without touching the
    // configuration.
    OPERATION_PLAN = 4;
  }
  Operation operation = 1;
  repeated string servers = 2;
  repeated string probe = 3;
  string timezone = 4;
  // AllowStep is the operator's consent to step the clock.
  bool allow_step = 5;
  // EnableDropin is consent to append to the daemon's main file one line
  // that includes the panel's source directory. Without it a host without
  // such a directory stays read-only.
  bool enable_dropin = 6;
  // The fingerprint of the plan approved by the operator; the host computes
  // it once more.
  string plan_hash = 7;
}

message TimeResult {
  bytes snapshot = 1;
  string message = 2;
  // Probes carries the measurements the panel asked for. A server that did
  // not answer has a reason here, not an offset of zero.
  bytes probes = 3;
  // The change plan in JSON form for OPERATION_PLAN.
  bytes plan = 4;
}

// KernelAction describes an operation on the kernel settings.
message KernelAction {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_READ = 1;
    OPERATION_SYSCTL_ENSURE = 2;
    OPERATION_MODULE_LOAD = 3;
    OPERATION_MODULE_BLACKLIST = 4;
    // The module blacklist plan computed on the host without touching the
    // configuration.
    OPERATION_MODULE_PLAN = 5;
  }
  Operation operation = 1;
  map<string, string> settings = 2;
  repeated string keys = 3;
  string module = 4;
  bool blacklist = 5;
  // The fingerprint of the plan approved by the operator; the host computes
  // it once more.
  string plan_hash = 6;
}

message KernelResult {
  bytes snapshot = 1;
  string message = 2;
  repeated string pending_reboot = 3;
  repeated string applied_runtime = 4;
  // The module blacklist plan in JSON form for OPERATION_MODULE_PLAN.
  bytes plan = 5;
}

// SecretRef points at a secret in the panel store. The job envelope carries
// only the reference - never the value.
message SecretRef {
  string name = 1;
  uint32 version = 2;
}

// FileAction describes an operation on a configuration file.
message FileAction {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_READ = 1;
    OPERATION_ENSURE = 2;
    OPERATION_REMOVE = 3;
    OPERATION_LIST = 4;
    // A rollback to an earlier version is on the host the same write as
    // ensure, but the operation stays separate: the plan hash covers its
    // name, and the audit trail is to say it was a rollback, not new
    // content.
    OPERATION_ROLLBACK = 5;
    // Computing the difference between the found and the requested state.
    // Two hosts with the same desired state have two different diffs, so a
    // campaign must ask each separately before the operator approves
    // anything.
    OPERATION_PLAN = 6;
  }
  Operation operation = 1;
  string path = 2;
  bytes content = 3;
  string mode = 4;
  string owner = 5;
  string group = 6;
  string expected_sha256 = 7;
  string validator = 8;
  // ContentSecret points at the secret whose value is to go into the file.
  // It excludes the content field: either the content is plain or it comes
  // from the store.
  SecretRef content_secret = 9;
  // AllowMissingValidator lets the write go on when the host lacks the
  // validator the order names. The order says so, and the capability has
  // to carry the grant file.write.unvalidated; either alone is not enough.
  bool allow_missing_validator = 10;
  // VersionSha256 names a content the host kept before an earlier write
  // took its place. It travels to the host when the panel has no copy of
  // that version itself - the file was changed outside the panel, or it
  // existed before the panel ever managed it - and the host writes its own
  // copy. Part of the payload hash like every other field of the order.
  string version_sha256 = 11;
}

message FileResult {
  bytes snapshot = 1;
  string message = 2;
  bytes content = 3;
  string sha256 = 4;
  bool truncated = 5;
  string validator_output = 6;
  // Plan describes the difference between the found and the requested
  // state, in JSON.
  bytes plan = 7;
  // Change describes what the write really did, in JSON: both digests, the
  // inode before and after, the identity of the check that ran, the version
  // that was kept and what needs a reload afterwards.
  bytes change = 8;
}

// PackageLifecycle installs, removes or holds packages. The name differs
// from PackageChange, because that one describes a version change resulting
// from a transaction, and this one - the ordered operation.
message PackageLifecycle {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_INSTALL = 1;
    OPERATION_REMOVE = 2;
    OPERATION_HOLD = 3;
  }
  Operation operation = 1;
  repeated string packages = 2;
  repeated string expected_removals = 3;
  bool hold = 4;
  // The fingerprint of the installation plan approved by the operator; the
  // host computes the plan once more and refuses when the repository
  // metadata changed.
  string plan_hash = 5;
  // The approved plan envelope the change is bound to, as for an upgrade.
  PackagePlanReference plan_reference = 6;
}

// ListProcesses orders a snapshot of the host processes.
message ListProcesses {
  // The sort order decides which processes end up in the result when there
  // are more of them than the limit.
  string sort_by = 1;
  uint32 limit = 2;
}

// SignalProcess sends a signal to a process bound to its start time. The
// PID alone does not identify a process: the kernel reuses the numbers.
message SignalProcess {
  int32 pid = 1;
  uint64 expected_start_ticks = 2;
  string signal = 3;
  string command = 4;
}

message ProcessListResult {
  bytes snapshot = 1;
}

message ProcessSignalResult {
  int32 pid = 1;
  string signal = 2;
  // Command recorded at the moment of sending: the audit is to show what was
  // killed, not the bare number that will soon stop meaning anything.
  string command = 3;
}

// FollowJournal orders a live journal preview. The stream is short-lived
// and bounded from above: by time, by rate and by line count - otherwise the
// host would work for nobody once the operator closes the tab.
message FollowJournal {
  string unit = 1;
  optional uint32 max_priority = 2;
  // How many of the last lines to show at the start, before the preview
  // begins.
  uint32 backlog_lines = 3;
  uint32 follow_seconds = 4;
  // The narrowing a read has, so that watching a unit and reading it are
  // the same question asked twice. Since moves the start of the backlog,
  // after_cursor continues a read from the position it ended at, and
  // boot_id keeps the view inside one boot of the host - the running one
  // while the host is up, an earlier one showing its backlog and nothing
  // after it. There is no "until": a live view ends by its own limit.
  string since = 5;
  string after_cursor = 6;
  string boot_id = 7;
}

// ReadLogFile reads a log file from the host allowlist.
message ReadLogFile {
  string path = 1;
  uint32 lines = 2;
}

message LogFileResult {
  string path = 1;
  repeated string lines = 2;
  bool truncated = 3;
  int64 size_bytes = 4;
  string allowlist = 5;
}

// ComposeAction orders a plan or a deployment of a Compose project.
message ComposeAction {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_PLAN = 1;
    OPERATION_DEPLOY = 2;
  }
  Operation operation = 1;
  string project = 2;
  string manifest = 3;
  string plan_digest = 4;
  // The image digests the plan resolved, by service name: what the
  // deployment binds the containers to.
  map<string, string> image_digests = 5;
}

message ComposeResult {
  bytes payload = 1;
  string unavailable_reason = 2;
}

message DockerActionResult {
  bytes before = 1;
  bytes after = 2;
  repeated string removed = 3;
  optional int64 reclaimed_bytes = 4;
  string image_digest = 5;
}

// DockerReadResult carries the engine state in JSON form. The structure
// belongs to the containers module; the agent contract does not repeat it.
message DockerReadResult {
  bytes snapshot = 1;
  string unavailable_reason = 2;
}

// DockerEventsResult carries the events from a closed time window.
message DockerEventsResult {
  // The events in JSON form. The structure belongs to the containers module.
  bytes events = 1;
  // Truncated means a read cut short by the count or size limit. A cut list
  // without this marker would look complete.
  bool truncated = 2;
  string truncated_reason = 3;
  string unavailable_reason = 4;
}

// DockerLogs orders a bounded read of one container's log.
//
// The read is closed by a line count and by the same byte limit as a log
// file read: a container that writes in a loop would otherwise hand the
// panel its whole history. The target may be an identifier or a name -
// this is a read, and the name is what the operator has in front of them.
message DockerLogs {
  string container_id = 1;
  // Lines is the tail to read. Zero means the module default.
  uint32 lines = 2;
  // Since narrows the read: an RFC 3339 timestamp or a duration such as
  // "15m". Empty means the whole tail.
  string since = 3;
  // Timestamps prefixes every line with the engine's timestamp.
  bool timestamps = 4;
}

// DockerLogsResult carries the lines read. Stderr lines are merged with a
// marker rather than in a second list, so the order of what the container
// wrote is kept.
message DockerLogsResult {
  string container_id = 1;
  string container_name = 2;
  repeated string lines = 3;
  // Truncated means a read cut short by the byte limit. A cut list without
  // this marker would look complete.
  bool truncated = 4;
  string truncated_reason = 5;
  string unavailable_reason = 6;
}

// HostnameSet renames the host.
//
// The agent runs a preflight before it asks the helper: whether the new
// name resolves in DNS to something else than this host, and whether the
// certificate of the agent is bound to the name. The result carries those
// checks whether the rename happened or not.
message HostnameSet {
  // Hostname is the static name: an RFC 1123 label or a fully qualified
  // name.
  string hostname = 1;
  // Pretty is the human-readable name shown by hostnamectl. Optional.
  string pretty = 2;
}

// HostnameResult carries the outcome of a rename together with the
// preflight checks.
message HostnameResult {
  string previous = 1;
  string current = 2;
  bool changed = 3;
  repeated PreflightCheck checks = 4;
  // HostsFileUpdated says whether /etc/hosts named the old hostname and was
  // rewritten; the previous content is kept as /etc/hosts.flotestro-before.
  bool hosts_file_updated = 5;
}

// KeytabRenewResult carries the proof of a keytab renewal: the key version
// number of the principal in the host's keytab before and after the
// fetch. A number that did not go up is a fetch that replaced nothing.
// Zero before with kvno_before_known false means the number was not read,
// not that there was none.
message KeytabRenewResult {
  string principal = 1;
  bool kvno_before_known = 2;
  uint32 kvno_before = 3;
  uint32 kvno_after = 4;
}

// SmartResult carries the health and the attributes of one device as
// smartctl reports them. A device the tool cannot read reports unsupported
// with the tool's own message; no number is ever invented.
message SmartResult {
  string device = 1;
  string model = 2;
  string serial = 3;
  // Health is "passed", "failed" or "unknown". Unknown carries a reason.
  string health = 4;
  string health_reason = 5;
  optional int32 temperature_c = 6;
  optional uint64 power_on_hours = 7;
  optional uint64 reallocated_sectors = 8;
  optional uint64 pending_sectors = 9;
  // WearPercent is the NVMe percentage used; SSD wear indicators of ATA
  // devices are left in the attribute table under their own names.
  optional uint32 wear_percent = 10;
  repeated SmartAttribute attributes = 11;
  bool unsupported = 12;
  string unsupported_reason = 13;
  // Output is the beginning of what the tool printed when its JSON could
  // not be read, for the operator to see why.
  string output = 14;
}

message SmartAttribute {
  uint32 id = 1;
  string name = 2;
  uint32 value = 3;
  uint32 worst = 4;
  uint32 threshold = 5;
  uint64 raw = 6;
  string raw_string = 7;
  bool failing = 8;
}

message UnitStatusResult {
  repeated UnitState units = 1;
  // Truncated means a listing cut short by the limit. A cut list without
  // this marker would look full.
  bool truncated = 2;
  // Details carries the full picture of the units read with detail = true.
  // Such a read leaves units empty: the detail of one unit is not a listing
  // of the host and must not replace one.
  repeated UnitDetail details = 3;
}

// UnitDetail is the full picture of one unit: what it depends on, what
// starts it, what overrides its file and what it last wrote to the journal.
message UnitDetail {
  UnitState state = 1;
  string description = 2;
  string fragment_path = 3;
  // The dependency lists, as systemd names them.
  repeated string requires = 4;
  repeated string wants = 5;
  repeated string after = 6;
  repeated string before = 7;
  repeated string binds_to = 8;
  repeated string part_of = 9;
  // TriggeredBy lists the socket, timer and path units that activate this
  // unit; triggers lists what this unit activates.
  repeated string triggered_by = 10;
  repeated string triggers = 11;
  repeated UnitDropIn drop_ins = 12;
  // ExecMainStart is the start time of the main process: RFC 3339 when
  // the host's words could be read as a date, otherwise the words
  // themselves. Empty for a unit without a running main process.
  string exec_main_start = 13;
  // The last journal lines of the unit and the cursor of the last one, so
  // a longer read can continue from there.
  repeated string journal_lines = 14;
  string journal_cursor = 15;
  bool journal_truncated = 16;
  // JournalError says why the journal could not be read; the rest of the
  // detail stands on its own.
  string journal_error = 17;
}

// UnitDropIn is one override file with its content.
message UnitDropIn {
  string path = 1;
  string content = 2;
  bool truncated = 3;
  // Error says why the content could not be read - a path outside the
  // allowed directories or a file the agent may not open.
  string error = 4;
}


message DomainEnrollResult {
  // Checks are the preflight results; each has a name, a result and a
  // description.
  repeated PreflightCheck checks = 1;
  bool enrolled = 2;
  string host_principal = 3;
  // Verifications confirm that NSS, PAM, Kerberos and sudo work after the
  // join. Only they allow the enrollment to be considered complete.
  repeated PreflightCheck verifications = 4;
}

message PreflightCheck {
  string name = 1;
  // Passed is empty when the state could not be determined.
  optional bool passed = 2;
  string detail = 3;
  // Blocking means a condition whose failure rules out the join.
  bool blocking = 4;
}
