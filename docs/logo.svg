<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" role="img" aria-label="Flotestro">
  <title>Flotestro</title>
  <!-- The mark: an F whose bars shorten like the ranks of a fleet. -->
  <rect x="16" y="16" width="88" height="88" rx="20" fill="#fab387"/>
  <g fill="#11111b">
    <rect x="32" y="32" width="14" height="56" rx="4"/>
    <rect x="54" y="32" width="34" height="11" rx="4"/>
    <rect x="54" y="54.5" width="26" height="11" rx="4"/>
    <rect x="54" y="77" width="18" height="11" rx="4"/>
  </g>
  <!-- The wordmark. -->
  <text x="128" y="78" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#1c1c2c">Flotestro</text>
</svg>
