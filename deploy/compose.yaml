# The Flotestro control plane and what it is deployed with, in profiles.
#
#   docker compose up -d                                with a database somebody else runs
#   docker compose --profile quickstart up -d           with a database of its own
#   docker compose --profile airgap up -d               plus the package repository of the release
#   docker compose --profile tools run --rm admin-tools backup
#   docker compose --profile restore run --rm admin-restore restore <backup-id>
#
# Nothing but the control plane starts unless its profile is named, so an
# installation pointed at an external database cannot quietly run a second
# beside it. Profiles combine: --profile quickstart --profile airgap.
# Settings come from ./.env, secrets from files under ./secrets/ - see README.md.
name: flotestro

services:
  control-plane:
    # A tag is readable and is what an example should show. Production pins
    # the digest as well - image:tag@sha256:... - because a tag can be
    image: ghcr.io/ultherego/flotestro-control-plane:${FLOTESTRO_VERSION:?set FLOTESTRO_VERSION in .env}
    restart: unless-stopped
    user: "65532:65532"

    environment:
      # The DSN is a secret and travels as a file, never as a value: an
      # environment variable is visible in "docker inspect", in the process
      FLOTESTRO_DATABASE_URL_FILE: /run/secrets/database_url
      # The state directory and the panel are already set in the image; they
      # stand here as well because a deployment that has to be read in one
      FLOTESTRO_STATE_DIR: /var/lib/flotestro
      FLOTESTRO_WEB_ROOT: /usr/share/flotestro/web
      # Every listener binds to every address inside the container. The
      # native installation keeps the admin listener on 127.0.0.1, which
      FLOTESTRO_ADMIN_ADDR: 0.0.0.0:8080
      FLOTESTRO_GATEWAY_ADDR: 0.0.0.0:8443
      FLOTESTRO_ENROLLMENT_ADDR: 0.0.0.0:8444
      # The name of this gateway. Without it the control plane takes the
      # hostname of the machine, and the hostname of a container is a random
      FLOTESTRO_GATEWAY_ID: ${FLOTESTRO_GATEWAY_ID:?required, for example cp-prod-01}
      # The addresses the agents see the panel under. They enter the
      # certificate of the agent gateway, so they are the public names of the
      FLOTESTRO_ADVERTISE: ${FLOTESTRO_ADVERTISE:?required, the DNS names or addresses the fleet reaches this panel at}
      # The address the operator sees. The OIDC redirect and the Secure flag
      # of the session cookies follow from it.
      FLOTESTRO_PUBLIC_URL: ${FLOTESTRO_PUBLIC_URL:?required, for example https://panel.example.org}
      # Optional and non-secret, empty unless ./.env says otherwise: the address
      # the hosts reach the repository at, and the NVD an isolated site clears.
      FLOTESTRO_PACKAGE_REPOSITORY_URL: ${FLOTESTRO_PACKAGE_REPOSITORY_URL-}
      # No value: passed through only when the host environment sets it, so an
      # unset variable is unset in the container and not an empty one.
      FLOTESTRO_VULN_NVD_URL:

    secrets:
      - database_url

    volumes:
      # The state: the fleet CA, the keys of the secret store, the helper
      # signing key, the bootstrap token and the feed cache. The name is
      - control_plane_state:/var/lib/flotestro
      # The keytab of the directory connector, when FreeIPA is configured:
      # - ./secrets/ipa.keytab:/run/secrets/ipa.keytab:ro
      # Vulnerability feeds copied onto an isolated site, read-only and outside
      # the state, which is one half of the backup pair - see README.md:
      # - ./feeds:/var/lib/flotestro-feeds:ro

    ports:
      # The panel and the API are published on the host loopback alone; a
      # reverse proxy with TLS puts them on the network.
      - "127.0.0.1:8080:8080"
      # The agent gateway (mTLS) and the enrollment (TLS) are reached by the
      # fleet directly or through an L4 load balancer: their TLS is
      - "8443:8443"
      - "8444:8444"

    networks:
      - application
      - database_egress
      - database

    # No depends_on: the panel waits for a database that answers, not for a
    # container that exists, and says so while it waits.

    # The process writes to its state volume and to /tmp, and nowhere else.
    # mode rather than uid/gid: 1777 is what a tmpfs is for, every runtime
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    ulimits:
      nofile:
        soft: 65536
        hard: 131072
    # A stop is a chance to finish what is in flight: the gateway ends the
    # agent sessions and the workers release their leases instead of leaving
    stop_grace_period: 30s

    healthcheck:
      # The image carries no curl and no shell; this is the static client
      # from cmd/container-healthcheck. It asks /healthz, which pings the
      test: ["CMD", "/usr/local/bin/flotestro-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 4
      # The first start of an installation migrates the schema before it
      # listens; the window covers it.
      start_period: 60s

    logging:
      # json-file rather than Docker's local: every runtime reads it, and
      # Podman refuses local outright. Rotation is the same either way.
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  postgres:
    # A laboratory, a demonstration or a small fleet: one host of failure and
    # a local backup. Production points FLOTESTRO_DATABASE_URL elsewhere.
    profiles: ["quickstart"]
    # A major version is not changed by swapping the tag: that is pg_upgrade.
    image: docker.io/library/postgres:17-bookworm
    restart: unless-stopped

    environment:
      POSTGRES_DB: flotestro
      POSTGRES_USER: flotestro
      # The password as a file, like every other secret here.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

    secrets:
      - postgres_password

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - database

    # No port is published: reachable from this deployment and nowhere else.
    shm_size: 256m
    # A database killed mid-checkpoint comes back into recovery.
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flotestro -d flotestro"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # The package repository of the release, for a site with no route out. It
  # holds no secret and answers GET and HEAD for one already-signed directory.
  package-repository:
    profiles: ["airgap"]
    # The reference keeps the registry it was built under although the site
    # cannot reach it: "docker load" restores the image under exactly that name.
    image: ghcr.io/ultherego/flotestro-package-repository:${FLOTESTRO_VERSION:?set FLOTESTRO_VERSION in .env}
    restart: unless-stopped
    user: "65532:65532"

    ports:
      # The fleet fetches over plain HTTP, and that is not a weakness here:
      # what a package manager trusts is the signature in the tree.
      - "8090:8080"

    networks:
      - application

    # Nothing is written, not even a temporary file, so there is no tmpfs
    # either: the tree is in the image layer and the process only reads it.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    # A download in flight is finished rather than cut.
    stop_grace_period: 30s

    healthcheck:
      # The same static client as the other images; the server answers
      # /healthz and refuses to start at all without flotestro-repo.asc.
      test: ["CMD", "/usr/local/bin/flotestro-healthcheck", "-addr", "127.0.0.1:8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Taking the backup pair. The state is read-only here: this service never
  # writes into the identity of the installation.
  admin-tools:
    profiles: ["tools"]
    image: ghcr.io/ultherego/flotestro-admin-tools:${FLOTESTRO_VERSION:?set FLOTESTRO_VERSION in .env}
    restart: "no"
    user: "65532:65532"

    environment:
      # The same DSN the control plane uses, from the same file. The tool takes
      # the password out of it before it runs anything.
      FLOTESTRO_DATABASE_URL_FILE: /run/secrets/database_url
      FLOTESTRO_STATE_DIR: /state
      FLOTESTRO_BACKUP_DIR: /backups
      # The digest this deployment pins, so that the manifest of a backup can
      # name the image the backup was taken with.
      FLOTESTRO_IMAGE_DIGEST: ${FLOTESTRO_TOOLS_DIGEST:-}

    secrets:
      - database_url

    volumes:
      # The state of the control plane, read-only: the CA, the keys of the
      # secret store, the bootstrap token. Half of the backup pair.
      - control_plane_state:/state:ro
      # The other half lands here, in a directory named after the backup.
      - ./backups:/backups

    networks:
      # Both are named because the database of the quick start is on the
      # internal one and an external database is reached through the other.
      database_egress:
        priority: 100
      database:
        priority: 10

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Putting the pair back. The same image and the same tool; what differs is
  # that the state is writable and the backups are not.
  admin-restore:
    profiles: ["restore"]
    image: ghcr.io/ultherego/flotestro-admin-tools:${FLOTESTRO_VERSION:?set FLOTESTRO_VERSION in .env}
    restart: "no"
    user: "65532:65532"

    environment:
      FLOTESTRO_DATABASE_URL_FILE: /run/secrets/database_url
      FLOTESTRO_STATE_DIR: /state
      FLOTESTRO_BACKUP_DIR: /backups
      FLOTESTRO_IMAGE_DIGEST: ${FLOTESTRO_TOOLS_DIGEST:-}

    secrets:
      - database_url

    volumes:
      # Read-write, and the tool refuses to write into a state that is not
      # empty: a restore puts an installation back where there is none.
      - control_plane_state:/state
      # The backup is the source here and is mounted read-only, so a restore
      # cannot damage the thing it is restoring from.
      - ./backups:/backups:ro

    networks:
      database_egress:
        priority: 100
      database:
        priority: 10

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  # The panel and the edge.
  application:
  # The quickstart database: no route out, and none in from outside.
  database:
    internal: true
  # The way out to the database. It is a separate network so that the rule
  # which lets the control plane reach PostgreSQL is one an operator can see
  database_egress:

volumes:
  control_plane_state:
    name: flotestro-state
  postgres_data:
    name: flotestro-postgres

secrets:
  # Read only under --profile quickstart.
  postgres_password:
    file: ./secrets/postgres-password
  database_url:
    # Mode 0600, owned by the account that runs the deployment. The directory
    # is not in Git.
    file: ./secrets/database-url
  # oidc_client_secret:
  #   file: ./secrets/oidc-client-secret
