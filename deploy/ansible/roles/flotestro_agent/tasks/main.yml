---
# Installing the agent and the one-time host enrollment.
#
# The role is idempotent both ways: the package and the configuration are
# declarative, and the enrollment runs only when the host has no identity
# yet. A repeated run neither orders a second token nor replaces a
# certificate that works.

- name: Required settings are given
  ansible.builtin.assert:
    that:
      - flotestro_api_url | length > 0
      - flotestro_agent_enrollment_url | length > 0
      - flotestro_agent_gateway_urls | length > 0
      - flotestro_repo_url | length > 0
    fail_msg: >-
      Give flotestro_api_url, flotestro_agent_enrollment_url,
      flotestro_agent_gateway_urls and flotestro_repo_url.

- name: Package repository (Debian, Ubuntu)
  when: ansible_facts.os_family == "Debian"
  block:
    - name: Repository key
      ansible.builtin.get_url:
        url: "{{ flotestro_repo_key_url }}"
        dest: /etc/apt/keyrings/flotestro.asc
        mode: "0644"
      register: flotestro_apt_key

    - name: Package source
      # signed-by binds the source to one key: the Flotestro key then signs
      # nothing beyond this repository.
      ansible.builtin.copy:
        content: >-
          deb [signed-by=/etc/apt/keyrings/flotestro.asc]
          {{ flotestro_repo_url }}/deb {{ flotestro_repo_channel }} main
        dest: /etc/apt/sources.list.d/flotestro.list
        mode: "0644"
      register: flotestro_apt_source

    - name: Index refresh
      ansible.builtin.apt:
        update_cache: true
      when: flotestro_apt_key.changed or flotestro_apt_source.changed

- name: Package repository (Fedora, RHEL)
  when: ansible_facts.os_family == "RedHat"
  block:
    - name: Repository key
      ansible.builtin.rpm_key:
        key: "{{ flotestro_repo_key_url }}"
        state: present

    - name: Package source
      ansible.builtin.yum_repository:
        name: flotestro
        description: Flotestro
        baseurl: "{{ flotestro_repo_url }}/rpm/{{ flotestro_repo_channel }}"
        gpgcheck: true
        repo_gpgcheck: true
        gpgkey: "{{ flotestro_repo_key_url }}"

- name: Package repository (Arch)
  when: ansible_facts.os_family == "Archlinux"
  block:
    - name: Repository key in the pacman keyring
      # pacman trusts a key only after it is signed locally; merely adding
      # it to the keyring changes nothing.
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          curl -fsS {{ flotestro_repo_key_url | quote }} | pacman-key --add - &&
          pacman-key --lsign-key
          "$(curl -fsS {{ flotestro_repo_key_url | quote }} |
             gpg --show-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
        executable: /bin/bash
      changed_when: false

    - name: Package source
      ansible.builtin.blockinfile:
        path: /etc/pacman.conf
        marker: "# {mark} FLOTESTRO"
        block: |
          [flotestro]
          SigLevel = Required DatabaseRequired
          Server = {{ flotestro_repo_url }}/arch/{{ flotestro_repo_channel }}
      register: flotestro_pacman_source

    - name: Index refresh
      ansible.builtin.command:
        cmd: pacman -Sy --noconfirm
      changed_when: false
      when: flotestro_pacman_source.changed

- name: Agent installed
  ansible.builtin.package:
    name: "{{ flotestro_agent_package }}"
    state: present

- name: Fleet CA bundle
  # The host's trust starts here: without the right CA the agent connects
  # to a panel that merely claims to be the panel.
  ansible.builtin.get_url:
    url: "{{ flotestro_ca_url }}"
    dest: "{{ flotestro_agent_state_dir }}/ca.pem"
    owner: flotestro-agent
    group: flotestro-agent
    mode: "0644"

- name: Agent configuration
  ansible.builtin.template:
    src: agent.yaml.j2
    dest: "{{ flotestro_agent_config_path }}"
    owner: root
    group: flotestro-agent
    mode: "0640"
  notify: Restart flotestro agent

- name: Host identity state
  ansible.builtin.stat:
    path: "{{ flotestro_agent_state_dir }}/identity/current/agent.pem"
  register: flotestro_identity

- name: Host enrollment into the fleet
  when: not flotestro_identity.stat.exists
  block:
    - name: Machine identifier
      ansible.builtin.slurp:
        src: /etc/machine-id
      register: flotestro_machine_id

    - name: Enrollment order for this host
      # The token is created just in time, is bound to this machine and has
      # one use. no_log, because the token value has no right to end up in
      # the run log nor in the facts.
      ansible.builtin.uri:
        url: "{{ flotestro_api_url }}/api/v1/enrollment-requests"
        method: POST
        headers:
          Authorization: "Bearer {{ flotestro_automation_api_token }}"
        body_format: json
        body:
          description: "ansible: {{ inventory_hostname }}"
          kind: agent
          purpose: new
          site: "{{ flotestro_agent_site }}"
          environment: "{{ flotestro_agent_environment }}"
          expected_machine_id: "{{ flotestro_machine_id.content | b64decode | trim }}"
          max_uses: 1
          ttl_minutes: "{{ flotestro_enrollment_ttl_minutes }}"
        status_code: 201
      delegate_to: localhost
      become: false
      register: flotestro_enrollment
      no_log: true

    - name: Agent enrollment
      # The token goes over standard input, not as an argument: an argument
      # is seen by every user of the host in the process list.
      ansible.builtin.command:
        cmd: flotestro-agentctl enroll --config {{ flotestro_agent_config_path }}
        stdin: "{{ flotestro_enrollment.json.token }}"
      become_user: flotestro-agent
      become: true
      changed_when: true
      no_log: true

- name: Agent service enabled
  ansible.builtin.systemd_service:
    name: flotestro-agent.service
    enabled: true
    state: started
