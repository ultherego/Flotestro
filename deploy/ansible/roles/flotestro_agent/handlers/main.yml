---
# A restart only when the host already has an identity. The service does
# not come up without it anyway, and a failed restart in a handler looks
# like a deployment failure.
- name: Restart flotestro agent
  ansible.builtin.systemd_service:
    name: flotestro-agent.service
    state: restarted
  when: flotestro_identity.stat.exists | default(false)
