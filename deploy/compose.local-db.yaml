# The quick start overlay: a PostgreSQL of its own, next to the control
# plane, for a laboratory, a demonstration or a small fleet.
#
#   docker compose -f compose.yaml -f compose.local-db.yaml up -d
#
# It stays a separate image with a separate volume and a separate lifecycle -
# the database is not folded into the panel image, because its backup, its
# tuning and its major upgrade are its own. What this profile accepts is one
# host of failure and a local backup; an installation that cannot accept that
# points compose.yaml at an external database instead and never loads this
# file.
services:
  control-plane:
    depends_on:
      postgres:
        # The panel migrates the schema at start, so it waits for a database
        # that answers rather than for a container that exists.
        condition: service_healthy
    networks:
      - application
      - database

  postgres:
    # Pinned by tag here for readability; production pins the digest as well
    # (postgres:17-bookworm@sha256:...). The major version is not changed by
    # swapping the tag: that is pg_upgrade or a dump and restore, with the
    # panel stopped.
    image: postgres:17-bookworm
    restart: unless-stopped

    environment:
      POSTGRES_DB: flotestro
      POSTGRES_USER: flotestro
      # The password as a file, like every other secret here.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

    secrets:
      - postgres_password

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - database

    # No port is published. The database is reachable from the internal
    # network of this deployment and from nowhere else; a backup is taken by
    # the tools image, not by installing a PostgreSQL client on the host.
    shm_size: 256m
    # A checkpoint at shutdown takes as long as it takes; a database killed
    # in the middle of one comes back into recovery.
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true

    healthcheck:
      # The official image has a shell and pg_isready, so the check is the
      # one its own documentation names; the distroless images of Flotestro
      # are the ones that needed a client of their own.
      test: ["CMD-SHELL", "pg_isready -U flotestro -d flotestro"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

networks:
  database:
    # Internal: the database has no route out and no foreign container has a
    # route in.
    internal: true

volumes:
  postgres_data:
    name: flotestro-postgres

secrets:
  postgres_password:
    file: ./secrets/postgres-password
