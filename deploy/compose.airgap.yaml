# The package repository of the release, beside the control plane, on the
# network the managed hosts reach.
#
#   docker compose -f compose.yaml -f compose.airgap.yaml up -d
services:
  control-plane:
    environment:
      # The address the managed hosts reach the repository at, which is the
      # published port below on a name or address of this host - never the
      FLOTESTRO_PACKAGE_REPOSITORY_URL: ${FLOTESTRO_PACKAGE_REPOSITORY_URL:?the address the fleet reaches the repository at, for example http://panel.site.example.org:8090}
      # NVD carries the descriptions and the CVSS scores and settles nothing.
      # It is paginated over a live API, so there is no file to put in its
      FLOTESTRO_VULN_NVD_URL: ""
      # The vulnerability feeds of the distributions, read from copies brought
      # onto this host - see "What an isolated site cannot do" in README.md.

    # The copied feeds, read-only and deliberately outside the state
    # directory: the state is one half of the backup pair, and a feed dump is

  # The repository itself. It holds no secret, talks to nothing and answers
  # GET and HEAD for one directory; the signing key that made the tree is not
  package-repository:
    image: ghcr.io/ultherego/flotestro-package-repository:${FLOTESTRO_VERSION:?set FLOTESTRO_VERSION in .env}
    # The reference keeps the registry it was built under although the site
    # cannot reach it: "docker load" restores the image under exactly the name
    restart: unless-stopped
    user: "65532:65532"

    ports:
      # The fleet fetches over plain HTTP, and that is not a weakness here:
      # what a package manager trusts is the signature in the tree and the
      - "8090:8080"

    networks:
      - application

    # Nothing is written, not even a temporary file, so there is no tmpfs
    # either: the tree is in the image layer and the process only reads it.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    # A download in flight is finished rather than cut.
    stop_grace_period: 30s

    healthcheck:
      # The same static client as the other images; the server answers
      # /healthz and refuses to start at all without flotestro-repo.asc.
      test: ["CMD", "/usr/local/bin/flotestro-healthcheck", "-addr", "127.0.0.1:8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
