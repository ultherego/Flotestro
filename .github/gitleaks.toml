# The configuration of the secret scan of CI (see ci.yml, job "Secrets").
#
# The default rule set is the whole of the scan; nothing is switched off
# here. The allowlist names literal strings of test fixtures that have the
# shape of a key and hold no secret - a fixture exists precisely so that a
# test can prove a key never leaves the host. Every entry is a literal from
# a known file, not a pattern that would cover a real key by accident.
#
# When the scan fires on a new fixture, add that fixture's literal here with
# the file it stands in. Never add a path: a whole file taken out of the
# scan is a file where a real key can then be committed unnoticed.

[extend]
useDefault = true

[allowlist]
description = "Test fixtures shaped like a key, holding no key material."
regexTarget = "match"
regexes = [
  # cmd/agentctl/supportbundle_test.go: proves the support bundle refuses
  # to carry the agent's private key.
  '''MUSTNOTLEAVE''',
  # internal/freeipa/write_test.go: "openssh-key" in base64, the body of a
  # key that a user must not be allowed to submit as a public key.
  '''b3BlbnNzaC1rZXk=''',
  # A PEM block whose body is one short line and then the END marker. Four
  # fixtures are written that way - cmd/agentctl/supportbundle_test.go proves
  # the bundle refuses a key, internal/cryptostate/authorities_db_test.go and
  # migrate_test.go stand in for an active and a previous authority - and the
  # bound is what makes this safe: a key in a Go string literal carries
  # hundreds of characters between the first \n and the END marker, so no real
  # key fits. The bodies are MHcCAQEEIA, MIIB, active, previous, not really.
  #
  # Written as a shape rather than as five literals on purpose: MHcCAQEEIA is
  # the opening of every P-256 EC key there is, and allowlisting it would hide
  # the real thing.
  '''-----BEGIN (EC |RSA |OPENSSH )?PRIVATE KEY-----\\n[^\\]{1,24}\\n-----END''',
  # internal/cryptostate/migrate_test.go: the identifiers of two keys, beside
  # the fixtures above. A name, not key material.
  '''cf4a324d-ea01-5141-a3a4-032fdc10e703''',
  '''hs-0123456789abcdef''',
  # internal/oidc/provider_login_test.go: the kid of the signing key a fake
  # provider advertises.
  '''keycloak-rs256-1''',
  # internal/modules/accounts/managed.go: the name of the file the panel writes
  # authorized keys into. A file name that ends in .keys reads as a credential
  # to the generic rule.
  '''60-flotestro.keys''',
  # internal/freeipa/lifecycle_test.go: the temporary password a test hands the
  # directory so that it can prove the password is changed afterwards.
  '''Zx9-temporary''',
  # web/src/pages/Dashboard.tsx: the catalogue of the dashboard's widgets, in
  # which every entry names itself `key: "operations_24h"` and so on. The
  # generic rule reads `key: "..."` as a credential being assigned.
  #
  # Written as the shape of a widget key rather than as six literals: these
  # are lower-case words and underscores between eight and forty characters,
  # which is a name and not a secret - no real key is drawn from that alphabet
  # without a digit, a capital or a symbol in it.
  '''key: "[a-z][a-z0-9_]{7,39}"''',
  # web/src/next/screens/Profile.test.tsx: the value the server hands back
  # when a personal API token is minted, in the three tests that prove the
  # panel shows it once, never puts it in a path and never writes it to the
  # console. A fixture shaped like the real thing is the point of those
  # tests - one shaped unlike it would prove nothing about a real token.
  #
  # Safe as a literal: a token the server really mints carries far more
  # than nine characters after the prefix, so this string is no real one.
  '''flt_9XQ2vmS1aZ''',
]
