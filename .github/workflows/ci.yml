# Continuous integration: what every push to main and every pull request
# must pass.
#
# Only what runs without the fleet is here. The integration suite carries
# the "integration" build tag and the Playwright suite of the panel needs the
# hosts of the laboratory; both run from there, not from a runner, and their
# verdict reaches a commit through lab-gate.yml, which the owner triggers by
# hand. What does run here is the smoke test: a control plane against the
# PostgreSQL service and a fake agent, which needs no fleet at all.
#
# The jobs are independent on purpose: a broken panel must not hide a
# broken migration, and the slowest job decides how long the pull request
# waits. Third-party and GitHub actions are pinned to an exact version;
# nothing here uploads the sources, the logs or the test output anywhere.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch replaces the run in flight: the older
# verdict is about code nobody will merge any more. On main every commit
# keeps its own run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.2.0
        with:
          # The toolchain comes from go.mod: the runner then builds with
          # what the module declares, and a bump of the declaration is the
          # one place where the version changes.
          go-version-file: go.mod
          # The module cache and the build cache, keyed by go.sum. The race
          # detector rebuilds the standard library, so the build cache is
          # what makes the second run of a branch short.
          cache: true
          cache-dependency-path: go.sum

      - name: gofmt
        # gofmt prints the files that differ and exits 0, so the output is
        # the verdict.
        run: |
          unformatted="$(gofmt -l cmd internal db)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt-formatted:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        # The packages must build, not only type-check under vet: a release
        # is built from this tree and a broken build is not a test failure.
        run: go build ./...

      - name: The integration suite compiles
        # The suite itself runs only in the laboratory, but it is written
        # against the same code. Vet compiles it, so a renamed field is
        # caught here instead of in the laboratory an hour later.
        run: go vet -tags=integration ./tests/...

      - name: Unit tests
        # -race: the control plane serves many sessions at once and a data
        # race is a fault the fleet would show as a mystery.
        # -shuffle=on: a test that passes only in file order is a test that
        # depends on another one's state.
        # -count=1: no cached verdicts; the run says what this commit does.
        run: go test -race -shuffle=on -count=1 -timeout=20m ./...

  govulncheck:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.2.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: govulncheck
        # Known vulnerabilities in the modules the binaries actually call
        # into; the release carries a CycloneDX bill for the rest. The tool
        # follows the toolchain and the format of the vulnerability
        # database, so the database is what stays current; the tool itself is
        # pinned, because a gate that must pass does not fetch whatever was
        # tagged latest this morning. It downloads the database and sends
        # nothing.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" ./...

  protocol:
    name: Protocol compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          # The comparison reads a tag, so the history has to be there.
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1.47.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: The protocol reads as a protocol
        run: buf lint

      - name: Nothing in it changed meaning since the last release
        # An agent and a panel one release apart have to work together, so a
        # field number, a type or a field that goes is a break rather than a
        # change. The comparison is against the newest release tag and not
        # against main: main is where this push is going, and comparing a
        # branch with itself proves nothing.
        run: |
          set -euo pipefail
          tag="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          if [ -z "$tag" ]; then
            echo "no release tag yet: there is nothing to have broken"
            exit 0
          fi
          if ! git cat-file -e "$tag:buf.yaml" 2>/dev/null; then
            echo "::notice::$tag was released before the protocol was described here;" \
                 "the comparison starts with the next release"
            exit 0
          fi
          echo "comparing the protocol with $tag"
          buf breaking --against ".git#tag=$tag"

  fuzz:
    name: Fuzz the decoders
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.2.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # Go runs one fuzz target per invocation, so each target is a step.
      # The seed corpus of every target runs with the unit tests of the Go
      # job; the short budget here is a smoke run, not a campaign. The job
      # does not wait for the unit tests: the two find different faults and
      # the pull request waits for the slower of them, not for their sum.
      - name: CSR decoder (internal/pki)
        run: go test -run='^$' -fuzz='^FuzzSignAgentCSR$' -fuzztime=20s ./internal/pki
      - name: Agent configuration (internal/agentconfig)
        run: go test -run='^$' -fuzz='^FuzzRead$' -fuzztime=20s ./internal/agentconfig
      - name: JCS canonicaliser (internal/jcs)
        run: go test -run='^$' -fuzz='^FuzzTransform$' -fuzztime=20s ./internal/jcs
      - name: Cron expressions (internal/modules/schedules)
        run: go test -run='^$' -fuzz='^FuzzParseExpression$' -fuzztime=20s ./internal/modules/schedules
      - name: Systemd calendar preview (internal/modules/schedules)
        run: go test -run='^$' -fuzz='^FuzzParseCalendarPreview$' -fuzztime=20s ./internal/modules/schedules
      - name: Sudoers (internal/modules/sudoers)
        run: go test -run='^$' -fuzz='^FuzzParse$' -fuzztime=20s ./internal/modules/sudoers
      - name: Human-readable sizes (internal/packages)
        run: go test -run='^$' -fuzz='^FuzzParseHumanSize$' -fuzztime=20s ./internal/packages
      - name: DNF transaction summary (internal/packages)
        run: go test -run='^$' -fuzz='^FuzzParseDNFTransactionSizes$' -fuzztime=20s ./internal/packages

  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: flotestro
          POSTGRES_PASSWORD: flotestro
          POSTGRES_DB: flotestro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flotestro -d flotestro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          # The upgrade step needs the released tags and the commits they
          # point at: it migrates from the schema of the last release.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v5.2.0
        with:
          go-version-file: go.mod
          cache: true

      # The control plane applies the migrations itself and can be told to
      # do only that, so the job tests the migrator the product ships
      # rather than a second implementation of it in shell. Every psql and
      # pg_dump below runs from the server's own image, so the client never
      # refuses a newer server and the dump is the format the server speaks.
      - name: Apply the migrations
        id: first
        env:
          FLOTESTRO_DATABASE_URL: postgres://flotestro:flotestro@127.0.0.1:5432/flotestro?sslmode=disable
          FLOTESTRO_STATE_DIR: ${{ runner.temp }}/state
        run: |
          set -euo pipefail
          mkdir -p "$FLOTESTRO_STATE_DIR"
          go run ./cmd/control-plane migrate
          echo "applied=yes" >> "$GITHUB_OUTPUT"

      - name: The migrations match the files
        env:
          PGPASSWORD: flotestro
        run: |
          set -euo pipefail
          psql_() {
            docker run --rm --network host -e PGPASSWORD postgres:17 \
              psql -h 127.0.0.1 -p 5432 -U flotestro -d flotestro -v ON_ERROR_STOP=1 "$@"
          }
          files="$(ls db/migrations/*.sql | wc -l)"
          recorded="$(psql_ -tAq -c 'select count(*) from schema_migrations')"
          if [ "$recorded" != "$files" ]; then
            echo "schema_migrations holds $recorded versions, $files files are in db/migrations" >&2
            exit 1
          fi
          # Two files with the same number are two schemas: whichever is
          # applied second on one installation is applied first on another.
          duplicates="$(ls db/migrations | sed 's/_.*//' | sort | uniq -d)"
          if [ -n "$duplicates" ]; then
            echo "two migrations share a number:" >&2
            echo "$duplicates" >&2
            exit 1
          fi
          echo "$files migrations, $recorded recorded, no repeated number"

      - name: Applying them again changes nothing
        env:
          PGPASSWORD: flotestro
          FLOTESTRO_DATABASE_URL: postgres://flotestro:flotestro@127.0.0.1:5432/flotestro?sslmode=disable
          FLOTESTRO_STATE_DIR: ${{ runner.temp }}/state
        run: |
          set -euo pipefail
          pg() {
            docker run --rm --network host -e PGPASSWORD \
              -v "$PWD:/repo:ro" -w /repo postgres:17 "$@"
          }
          psql_() {
            pg psql -h 127.0.0.1 -p 5432 -U flotestro -d flotestro -v ON_ERROR_STOP=1 "$@"
          }
          # pg_dump opens and closes its output with \restrict and
          # \unrestrict lines carrying a token it makes up each time, so
          # two dumps of one unchanged schema never match byte for byte.
          # They say nothing about the schema and are dropped from both
          # sides; everything else is compared as it comes.
          dump() {
            pg pg_dump -h 127.0.0.1 -p 5432 -U flotestro -d flotestro \
              --schema-only --no-owner --no-privileges |
              grep -v '^\\\(un\)\?restrict '
          }
          dump > before.sql
          before_count="$(psql_ -tAq -c 'select count(*) from schema_migrations')"
          go run ./cmd/control-plane migrate
          after_count="$(psql_ -tAq -c 'select count(*) from schema_migrations')"
          if [ "$before_count" != "$after_count" ]; then
            echo "the second pass recorded $((after_count - before_count)) migrations; a file does not match what was recorded" >&2
            exit 1
          fi
          dump > after.sql
          if ! diff -u before.sql after.sql; then
            echo "the schema changed without a migration being applied" >&2
            exit 1
          fi
          echo "the second pass applied nothing and the schema is identical"

      - name: The upgrade from the last release
        # The migration every installation actually performs: not from zero,
        # but from the schema the last release left behind. The previous
        # release migrates its own database with its own migrator, this tree
        # brings it forward, and the result has to be the schema a first
        # installation of this tree gets. A migration that only works on an
        # empty database is a migration that breaks every installation there
        # is, and from zero alone nothing says so.
        env:
          PGPASSWORD: flotestro
          FLOTESTRO_STATE_DIR: ${{ runner.temp }}/state
        run: |
          set -euo pipefail
          # A stable tag that this commit descends from; a pre-release
          # (v1.2.3-rc1) is not what an installation runs.
          tag="$(git tag --list 'v*' --sort=-version:refname --merged HEAD |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          if [ -z "$tag" ]; then
            echo "no stable release is an ancestor of this commit: there is no previous version to upgrade from, and a first installation is what the steps above already check"
            exit 0
          fi
          echo "the previous version is $tag"

          pg() {
            docker run --rm --network host -e PGPASSWORD postgres:17 "$@"
          }
          psql_() {
            pg psql -h 127.0.0.1 -p 5432 -U flotestro -v ON_ERROR_STOP=1 "$@"
          }
          # The same filtering as the idempotence step: pg_dump writes a
          # \restrict token it makes up each time, which says nothing about
          # the schema.
          dump() {
            pg pg_dump -h 127.0.0.1 -p 5432 -U flotestro -d "$1" \
              --schema-only --no-owner --no-privileges |
              grep -v '^\\\(un\)\?restrict '
          }
          for database in upgraded fresh; do
            psql_ -d postgres -c "drop database if exists $database"
            psql_ -d postgres -c "create database $database"
          done

          upgraded="postgres://flotestro:flotestro@127.0.0.1:5432/upgraded?sslmode=disable"
          fresh="postgres://flotestro:flotestro@127.0.0.1:5432/fresh?sslmode=disable"
          git worktree add --detach "$RUNNER_TEMP/previous" "$tag"
          # -buildvcs=false: a detached worktree has no branch to stamp, and
          # the stamp is of no interest to a migration.
          GOFLAGS=-buildvcs=false FLOTESTRO_DATABASE_URL="$upgraded" \
            go -C "$RUNNER_TEMP/previous" run ./cmd/control-plane migrate

          # Rows of the previous release, written before the upgrade. A schema
          # that matches says nothing about whether what the installation held
          # is still there and still says the same thing: a migration that
          # rewrites a column, changes an enum or recreates a table can leave a
          # correct schema over lost data.
          psql_ -d upgraded -v ON_ERROR_STOP=1 <<'ROWS'
          insert into hosts (hostname, machine_id, site, environment)
          values ('upgrade-witness.example.org', '0123456789abcdef0123456789abcdef', 'lab', 'test');
          insert into audit_events (actor_type, actor_id, action, target_type, target_id, outcome)
          values ('user', 'the-operator', 'host.register', 'host', 'upgrade-witness', 'success');
          ROWS
          before="$(psql_ -d upgraded -tAq -c "select hostname || '|' || site || '|' || environment
            from hosts where hostname = 'upgrade-witness.example.org'")"
          events_before="$(psql_ -d upgraded -tAq -c "select count(*) from audit_events
            where actor_id = 'the-operator'")"

          FLOTESTRO_DATABASE_URL="$upgraded" go run ./cmd/control-plane migrate

          after="$(psql_ -d upgraded -tAq -c "select hostname || '|' || site || '|' || environment
            from hosts where hostname = 'upgrade-witness.example.org'")"
          events_after="$(psql_ -d upgraded -tAq -c "select count(*) from audit_events
            where actor_id = 'the-operator'")"
          if [ "$before" != "$after" ] || [ "$events_before" != "$events_after" ]; then
            echo "the upgrade from $tag did not keep what the installation held:" >&2
            echo "  host  before=$before after=$after" >&2
            echo "  trail before=$events_before after=$events_after" >&2
            exit 1
          fi
          # The rows go before the schemas are compared: a witness row would
          # otherwise be a difference of its own.
          psql_ -d upgraded -c "delete from audit_events where actor_id = 'the-operator'" >/dev/null
          psql_ -d upgraded -c "delete from hosts where hostname = 'upgrade-witness.example.org'" >/dev/null
          FLOTESTRO_DATABASE_URL="$fresh" go run ./cmd/control-plane migrate

          dump upgraded > upgraded.sql
          dump fresh > fresh.sql
          if ! diff -u fresh.sql upgraded.sql; then
            echo "the schema after an upgrade from $tag is not the schema of a first installation of this tree" >&2
            exit 1
          fi
          # The recorded versions have to agree as well: two databases can
          # hold the same objects and disagree on what has been applied,
          # and the next migration then runs on one of them only.
          upgraded_versions="$(psql_ -d upgraded -tAq -c 'select version from schema_migrations order by version')"
          fresh_versions="$(psql_ -d fresh -tAq -c 'select version from schema_migrations order by version')"
          if [ "$upgraded_versions" != "$fresh_versions" ]; then
            echo "the upgraded database records other migrations than a first installation" >&2
            diff <(echo "$fresh_versions") <(echo "$upgraded_versions") || true
            exit 1
          fi
          echo "the upgrade from $tag ends in the schema of a first installation"

  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The same service the migration job uses: the smoke test runs a real
    # control plane, and a real control plane needs a real database.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: flotestro
          POSTGRES_PASSWORD: flotestro
          POSTGRES_DB: flotestro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flotestro -d flotestro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.2.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: The panel
        # The control plane serves the built panel itself, so the browser
        # reaches the API and the pages at one address and the smoke test
        # needs no second server.
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: The browser
        # The Chromium build belongs to the @playwright/test version the
        # lock file pins: the installer takes the build of the installed
        # version and of no other.
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: The stack, and the panel through a browser
        # tests/e2e/smoke.sh starts the control plane, orders an enrollment,
        # raises the fake agent against the real gateway and runs the one
        # Playwright test that needs no fleet. It uploads nothing: on a
        # failure it prints the last lines of the logs into this log.
        env:
          FLOTESTRO_DATABASE_URL: postgres://flotestro:flotestro@127.0.0.1:5432/flotestro?sslmode=disable
          FLOTESTRO_E2E_WORK: ${{ runner.temp }}/e2e
          FLOTESTRO_E2E_BIN: ${{ runner.temp }}/e2e-bin
        run: bash tests/e2e/smoke.sh

  sbom:
    name: Bill of materials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.2.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: The bills of the binaries
        # Read out of the built binaries and not out of go.mod: the bill says
        # what entered the artefact. The release writes the same bills from
        # the same tool, so a change that makes them impossible is caught
        # here and not on a tag.
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/binaries"
          mkdir -p "$staged"
          described=()
          for component in agent agent-helper agentctl relay relayctl control-plane auditverify; do
            CGO_ENABLED=0 go build -trimpath -o "$staged/flotestro-$component" "./cmd/$component"
            described+=(-binary "$staged/flotestro-$component")
          done
          go run ./cmd/sbom -out-dir "$RUNNER_TEMP/bills" "${described[@]}"

      - name: The bill of the panel
        # The panel ships as a bundle, in which nothing resembles a
        # dependency any more, so the bill is taken from the lock file while
        # the tree still exists. The build dependencies are left out: they
        # are not in the artefact.
        working-directory: web
        run: |
          set -euo pipefail
          # The whole tree, even though the bill omits the development
          # dependencies: npm sbom validates every edge of package-lock.json
          # first and refuses a tree with anything missing from it.
          npm ci --no-audit --no-fund --ignore-scripts
          # A bill names a version for the artefact it describes, and npm
          # refuses to write one for a package that has none. The panel takes
          # its version from the release that packs it, so a build that is not
          # a release says so in the same way the Go toolchain does.
          mkdir -p "$RUNNER_TEMP/bills"
          npm sbom --sbom-format cyclonedx --omit=dev \
            > "$RUNNER_TEMP/bills/flotestro-web.cdx.json"

      - name: Every bill describes what it is the bill of
        # What this gate refuses: a bill that could not be produced at all
        # (the two steps above fail then), one that is not a CycloneDX
        # document, one that does not name the artefact it describes, a
        # component nobody could match against an advisory - no name, no
        # version or no purl - and a Go module that entered a binary without
        # a recorded checksum, which is a dependency nobody can verify
        # afterwards.
        run: |
          set -euo pipefail
          bills="$RUNNER_TEMP/bills"
          produced=0
          for bill in "$bills"/*.cdx.json; do
            [ -e "$bill" ] || continue
            name="$(basename "$bill")"
            produced=$((produced + 1))
            jq -e '.bomFormat == "CycloneDX"' "$bill" >/dev/null ||
              { echo "$name is not a CycloneDX document" >&2; exit 1; }
            jq -e '(.metadata.component.name // "") != ""' "$bill" >/dev/null ||
              { echo "$name names no artefact of its own" >&2; exit 1; }
            components="$(jq '.components | length' "$bill")"
            if [ "$components" -lt 1 ]; then
              echo "$name lists no component at all" >&2
              exit 1
            fi
            unnameable="$(jq -r '[.components[]
              | select((.name // "") == "" or (.version // "") == "" or (.purl // "") == "")
              | .name // "(unnamed)"] | join(", ")' "$bill")"
            if [ -n "$unnameable" ]; then
              echo "$name carries components without a name, a version or a purl: $unnameable" >&2
              exit 1
            fi
            if [ "$name" != "flotestro-web.cdx.json" ]; then
              unverifiable="$(jq -r '[.components[]
                | select(.name != "stdlib")
                | select([.properties[]? | select(.name == "golang:module.sum")] | length == 0)
                | .name] | join(", ")' "$bill")"
              if [ -n "$unverifiable" ]; then
                echo "$name carries modules with no recorded checksum: $unverifiable" >&2
                exit 1
              fi
            fi
            echo "$name: $components components"
          done
          # Seven binaries and the panel: a bill that silently stopped being
          # written is a dependency that silently stopped being described.
          if [ "$produced" -ne 8 ]; then
            echo "$produced bills were produced, 8 were expected" >&2
            exit 1
          fi

  web:
    name: Panel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          # The version the laboratory installs on the panel machine
          # (Vagrant/provision/control-plane.sh). The panel is built there
          # and shipped from there, so the runner must not build it with a
          # different one.
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        # npm ci installs exactly the lock file: the runner and the panel
        # machine then hold the same tree.
        run: npm ci

      - name: The Polish catalogue
        # The catalogue is keyed by the English source string, so a screen
        # with a new string falls back to English quietly. This test walks
        # the sources and fails on the first key that has no Polish line;
        # it is run on its own so that a missing translation is named in
        # the checks list and not buried in the suite.
        run: npx vitest run src/i18n/i18n.test.ts

      - name: Types and bundle
        # "npm run build" is "tsc -b && vite build": the project references
        # are type-checked and the bundle the release ships is produced.
        run: npm run build

      - name: Unit tests
        # Vitest only: the Playwright suite drives the panel of the
        # laboratory and reaches a commit through lab-gate.yml. The one
        # Playwright test that needs no fleet runs in "E2E smoke".
        run: npx vitest run

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          # The history of the range is what is scanned: a secret removed
          # in the last commit of a branch is still in the branch.
          fetch-depth: 0

      - name: gitleaks
        env:
          # Pinned exactly. The archive is verified against the checksum
          # file published with the release; when .github/gitleaks.sha256
          # is present it is authoritative instead, which is the stronger
          # pin and the one to keep once the owner has recorded the digest:
          #   sha256sum gitleaks_<version>_linux_x64.tar.gz > .github/gitleaks.sha256
          GITLEAKS_VERSION: 8.18.4
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "$base/$archive"
          if [ -f .github/gitleaks.sha256 ]; then
            sha256sum -c .github/gitleaks.sha256
          else
            curl -sSfL -o gitleaks.checksums "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
            grep -E "[[:space:]]\*?${archive}\$" gitleaks.checksums > expected.sha256 || true
            if [ ! -s expected.sha256 ]; then
              echo "the published checksums name no $archive" >&2
              exit 1
            fi
            sha256sum -c expected.sha256
          fi
          tar -xzf "$archive" gitleaks
          # --redact: a finding names the file, the commit and the rule,
          # never the secret itself. The log of a public run is not the
          # place to publish what was found.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ -n "${{ github.event.before }}" ] \
            && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            # A new branch or a first push: only the commit itself is
            # known to be new. The whole history is swept by hand, from
            # the laboratory, as CONTRIBUTING.md describes.
            range="${{ github.sha }}~1..${{ github.sha }}"
          fi
          echo "scanning $range"
          ./gitleaks detect --source . --no-banner --redact \
            --config .github/gitleaks.toml --log-opts "--no-merges $range"

      - name: The product tree carries no key and no token
        # Our own check, and deliberately narrow: a PEM header at the
        # beginning of a line is a key file, not a string in a test, and
        # the token patterns are the ones that are recognisable by shape.
        # It scans the working tree, so it also covers what a scan of a
        # commit range would not reach.
        run: |
          set -euo pipefail
          found=0
          if grep -rEnI '^-----BEGIN ([A-Z]+ )*PRIVATE KEY-----' db internal cmd packaging; then
            echo "a private key block stands in the product tree" >&2
            found=1
          fi
          pattern='(AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{50,}'
          pattern="$pattern"'|xox[baprs]-[A-Za-z0-9-]{12,}|AIza[0-9A-Za-z_-]{35}'
          pattern="$pattern"'|sk-[A-Za-z0-9]{32,}|glpat-[A-Za-z0-9_-]{20})'
          if grep -rEnI "$pattern" db internal cmd packaging; then
            echo "a token stands in the product tree" >&2
            found=1
          fi
          if [ "$found" != "0" ]; then
            exit 1
          fi
          echo "no key block and no token under db, internal, cmd, packaging"
