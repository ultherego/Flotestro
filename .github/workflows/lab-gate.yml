# The verdict of the laboratory, recorded on a commit.
#
# The integration suite (build tag "integration") and the Playwright
# screenshots need the fleet: the panel, the database, the relay and the
# hosts with the agent. None of that exists on a runner, so this workflow
# runs nothing of the sort and does not pretend to. It takes the report
# Vagrant/gate.sh wrote in the laboratory and records the verdict that report
# earns as the commit status "lab-suite", so that a branch can require it
# before a merge.
#
# The verdict is not typed here. It used to be: an input called "result" with
# the options pass and fail, cross-checked against a pasted report only when
# somebody chose pass. That made the status worth what the typing was worth.
# Now the only thing a human supplies is the commit and the file the gate
# produced, and internal/release/gatecheck recomputes the verdict from the
# evidence in it - refusing a report that is incomplete, that is about another
# commit, or whose own "verdict" field disagrees with its own numbers.
#
# The owner triggers it from the machine that ran the suite:
#
#   gh workflow run lab-gate.yml \
#       -f sha=$(git rev-parse HEAD) \
#       -f report="$(cat Vagrant/.gate/$(git rev-parse HEAD)/result.json)"
#
# The commit has to be pushed first: a status belongs to a commit the
# repository knows. The whole report is kept in the run's summary; the status
# holds one line, which begins with "verdict=<pass|limited|fail>" because the
# release workflow reads it to tell a clean run from one that was green over
# approved limitations.
name: Lab gate

on:
  workflow_dispatch:
    inputs:
      sha:
        description: The full 40-character commit the laboratory ran.
        required: true
        type: string
      report:
        description: The contents of Vagrant/.gate/<sha>/result.json.
        required: true
        type: string

permissions:
  contents: read
  statuses: write

jobs:
  record:
    name: Record the verdict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The checkout is of the ref this workflow was dispatched on, not of the
      # commit being attested: the rules that judge a commit must not be the
      # ones that commit ships.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
          cache: false

      - name: The commit is one this repository knows
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          # An abbreviated commit would write the status on nothing: the API
          # takes what it is given and a typo would leave a branch waiting for
          # a check that never arrives.
          if ! printf '%s' "$SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::sha must be the full 40-character commit, not \"$SHA\"" >&2
            exit 1
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --jq .sha >/dev/null; then
            echo "::error::the repository does not know the commit $SHA; push it first" >&2
            exit 1
          fi

      - name: Judge the report
        id: judge
        env:
          SHA: ${{ inputs.sha }}
          REPORT: ${{ inputs.report }}
        run: |
          set -euo pipefail
          printf '%s' "$REPORT" > report.json
          # Two lines on stdout: the verdict, then the line the status carries.
          # Every refusal - a missing field, a skip nobody classified, a quick
          # run, a verdict the numbers deny - leaves this step red and records
          # nothing.
          if ! out="$(go run ./internal/release/gatecheck -sha "$SHA" report.json)"; then
            echo "::error::the laboratory report does not support a verdict; nothing was recorded." >&2
            exit 1
          fi
          verdict="$(printf '%s\n' "$out" | sed -n 1p)"
          summary="$(printf '%s\n' "$out" | sed -n 2p)"
          case "$verdict" in
            pass|limited|fail) ;;
            *) echo "::error::gatecheck reached the unknown verdict \"$verdict\"" >&2; exit 1 ;;
          esac
          {
            echo "verdict=$verdict"
            echo "summary=$summary"
          } >> "$GITHUB_OUTPUT"
          echo "the evidence in the report says: $verdict"

      - name: Record the status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          REPORT: ${{ inputs.report }}
          VERDICT: ${{ steps.judge.outputs.verdict }}
          SUMMARY: ${{ steps.judge.outputs.summary }}
        run: |
          set -euo pipefail
          # A run that was green over approved limitations is green for a merge
          # and is not a release: the state lets it through, the description
          # says which it was, and release.yml reads the description.
          case "$VERDICT" in
            pass|limited) state=success ;;
            fail) state=failure ;;
          esac

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" \
            -f context=lab-suite \
            -f description="$SUMMARY" \
            -f target_url="$run_url" >/dev/null

          {
            echo "### lab-suite: $VERDICT"
            echo
            echo "Commit \`$SHA\`, recorded by @$GITHUB_ACTOR."
            echo
            echo "$SUMMARY"
            echo
            echo 'The report the laboratory produced:'
            echo
            echo '```json'
            printf '%s\n' "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "lab-suite = $state ($VERDICT) on $SHA"
