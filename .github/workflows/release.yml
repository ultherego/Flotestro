# Release: a tag v* becomes the packages, the bills of materials, the
# checksums and the provenance, attached to the GitHub release of the tag.
#
# What is published is published once. An asset is never replaced in place:
# a customer who has already fetched a file must be able to compare it with
# what stands on the release today and find the same bytes. A re-run of a
# tag therefore fails loudly, and a corrected build takes a new tag.
#
# The workflow signs the packages with nothing: signing the repository is a
# separate step with a separate key (packaging/sign-repo.sh) and the runner
# does not hold it. The checksums are signed here only if the repository
# already carries a signing key as a secret; without it the step is skipped
# and says so.
#
# The same job then adds the release to the package repository the fleet
# installs from - the `gh-pages` branch, served by GitHub Pages. Loose assets
# on a release page are not a repository: no `apt update`, no upgrade path,
# and a URL that carries a version number stops being true the day the next
# version exists. The tree is added to, never replaced, so a host still on an
# older version keeps finding what it runs today.
#
# The repository is published before the assets are attached. Everything the
# publication needs - the tools, the key, the tree as it stands - is then
# answered for while the tag is still re-runnable; once an asset is on the
# release page the tag cannot be built again.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  # The branch GitHub Pages serves the package repository from. Every
  # publication is a commit on it, so what the fleet installs from has a
  # history, and a bad release is backed out the way anything else is.
  PAGES_BRANCH: gh-pages

jobs:
  panel:
    name: Panel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          # The provenance carries "git describe": it needs the tags, not
          # only the commit.
          fetch-depth: 0
      - uses: actions/setup-go@v5.2.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4.1.0
        with:
          # The version the laboratory installs on the panel machine
          # (Vagrant/provision/control-plane.sh).
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: The tag belongs to the default branch
        # A tag can be pushed from any branch, and a signed artefact of a
        # commit nobody reviewed is worth nothing. Two questions: does the
        # repository's default branch contain this commit, and - when the
        # owner signs tags at all - is the tag itself signed.
        run: |
          set -euo pipefail
          branch="${{ github.event.repository.default_branch }}"
          # checkout leaves no remote-tracking branch for a tag push, so the
          # branch this is measured against is fetched by name.
          git fetch --no-tags origin "+refs/heads/$branch:refs/remotes/origin/$branch"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$branch"; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which $branch does not contain" >&2
            echo "a release is built from a reviewed commit; merge it first, then tag the merge" >&2
            exit 1
          fi
          echo "$GITHUB_SHA is on $branch"
          # An unsigned tag is reported rather than refused: the signature is a
          # repository setting the workflow cannot turn on, and refusing here
          # would block a release the owner never configured for it.
          if git verify-tag "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "the tag carries a valid signature"
          else
            echo "### The tag is not signed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`$GITHUB_REF_NAME\` carries no signature this runner can verify. The release is built anyway; the artefacts are covered by \`SHA256SUMS\` and its signature." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Panel
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4.4.3
        with:
          name: panel
          path: web/dist
          if-no-files-found: error

  packages:
    name: Packages (${{ matrix.arch }})
    needs: panel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          # The provenance carries "git describe": it needs the tags, not
          # only the commit.
          fetch-depth: 0
      - uses: actions/setup-go@v5.2.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4.1.0
        with:
          # The version the laboratory installs on the panel machine
          # (Vagrant/provision/control-plane.sh).
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Packaging tools
        # dpkg-deb packs the .deb for any architecture; rpmbuild builds
        # only for the machine it runs on, so the arm64 .rpm is left to an
        # arm64 machine and this run records that in the job summary.
        #
        # makepkg is Arch's own tool, packaged for Ubuntu as `makepkg`; without
        # it build-release.sh quietly skips the pacman packages and the release
        # ships two families out of three. The tools it drives are named here
        # rather than left to whatever the runner image happens to carry.
        #
        # pacman-package-manager is not optional beside it: makepkg looks up
        # `pacman` while it reads its own configuration, and without it exits
        # with "An unknown error has occurred" before it reads the PKGBUILD.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev rpm makepkg pacman-package-manager fakeroot \
            libarchive-tools zstd binutils file

      - uses: actions/download-artifact@v4.1.8
        with:
          name: panel
          path: web/dist

      - name: Build
        env:
          FLOTESTRO_WEB: ${{ github.workspace }}/web/dist
        run: |
          version="${GITHUB_REF_NAME#v}"
          packaging/build-release.sh all "$version" dist "${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4.4.3
        with:
          name: dist-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.*
            dist/*.cdx.json
            dist/modules-*.txt
            dist/missing-rpm.txt
          if-no-files-found: error

  collect:
    name: The release as a whole
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The identity the build provenance is made with, and the store it is
      # written to. Granting them is not the same as receiving them.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          # The provenance carries "git describe": it needs the tags, not
          # only the commit.
          fetch-depth: 0

      - uses: actions/download-artifact@v4.1.8
        with:
          # Both architectures land in one directory; the completeness check
          # below is what says whether both really arrived.
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: The manifest of the run
        # The provenance is written here, from what this run knows about
        # itself: which commit, which workflow, which run, which machine.
        # A file carried in the tree would say what somebody typed once;
        # this one says what actually built the artefacts, and the run it
        # names can be opened and read.
        #
        # The build log is not an artefact. missing-rpm.txt is a note about
        # this machine, not something a customer installs: for a pre-release it
        # is read into the job summary and left out of what gets published, and
        # for a stable tag it stops the release.
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cd dist
          rm -f provenance.json SHA256SUMS SHA256SUMS.asc
          # A tag with a suffix - v1.2.3-rc1 - is a pre-release and may ship
          # incomplete; a bare version may not.
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          if [ -f missing-rpm.txt ]; then
            {
              echo "### The .rpm packages this machine could not build"
              echo
              echo 'rpmbuild refuses a foreign architecture, so these belong to a native machine:'
              echo
              sed 's/^/- /' missing-rpm.txt
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$prerelease" = false ]; then
              echo "::error::the stable release $GITHUB_REF_NAME is missing the .rpm packages for $(tr '\n' ' ' < missing-rpm.txt)" >&2
              echo "a stable release ships every architecture or it does not ship; tag a pre-release, or build the missing packages on a native machine" >&2
              exit 1
            fi
            rm -f missing-rpm.txt
          fi
          # The same rule without the note: a format that produced packages for
          # one architecture and not the other is an incomplete release too, and
          # nothing else in the pipeline would notice.
          incomplete=""
          for pair in "deb:amd64:arm64" "rpm:x86_64:aarch64" "pkg.tar:x86_64:aarch64"; do
            format="${pair%%:*}"; rest="${pair#*:}"
            first="${rest%%:*}"; second="${rest#*:}"
            have_first=$(ls -1 *"${first}"*."${format}"* 2>/dev/null | wc -l)
            have_second=$(ls -1 *"${second}"*."${format}"* 2>/dev/null | wc -l)
            if [ "$have_first" -gt 0 ] && [ "$have_second" -eq 0 ]; then
              incomplete="$incomplete ${format}/${second}"
            fi
            if [ "$have_second" -gt 0 ] && [ "$have_first" -eq 0 ]; then
              incomplete="$incomplete ${format}/${first}"
            fi
          done
          if [ -n "$incomplete" ]; then
            echo "### Architectures missing from this build" >> "$GITHUB_STEP_SUMMARY"
            echo "$incomplete" | tr ' ' '\n' | sed '/^$/d; s/^/- /' >> "$GITHUB_STEP_SUMMARY"
            if [ "$prerelease" = false ]; then
              echo "::error::the stable release $GITHUB_REF_NAME is missing:$incomplete" >&2
              exit 1
            fi
          fi
          bills="$(ls -1 *.cdx.json 2>/dev/null || true)"
          jq -n \
            --arg version "$version" \
            --arg tag "$GITHUB_REF_NAME" \
            --arg commit "$GITHUB_SHA" \
            --arg description "$(git -C "$GITHUB_WORKSPACE" describe --tags --always --dirty)" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg builder "$RUNNER_OS/$RUNNER_ARCH ${ImageOS:-unknown} (GitHub-hosted)" \
            --arg toolchain "$(go version)" \
            --arg node "$(node --version)" \
            --arg flags "-trimpath -ldflags '-s -w' CGO_ENABLED=0" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson sbom "$(printf '%s\n' "$bills" | jq -R . | jq -s 'map(select(. != ""))')" \
            '{version: $version, tag: $tag, commit: $commit, description: $description,
              repository: $repository, workflow: $workflow, run_id: $run_id,
              run_attempt: $run_attempt, run_url: $run_url, builder: $builder,
              toolchain: $toolchain, node: $node, flags: $flags,
              sbom_format: "CycloneDX 1.5", sbom: $sbom, built_at: $built_at}' \
            > provenance.json
          # The checksums cover everything that will be published, the
          # provenance included: a file nobody can check is a file nobody
          # knows the origin of. SHA256SUMS itself is the one exception,
          # and its signature, when there is one.
          published=()
          for file in *.deb *.rpm *.pkg.tar.* *.cdx.json modules-*.txt provenance.json; do
            [ -f "$file" ] && published+=("$file")
          done
          if [ ${#published[@]} -eq 0 ]; then
            echo "the build produced nothing to publish" >&2
            exit 1
          fi
          sha256sum "${published[@]}" > SHA256SUMS
          echo "the release carries:"
          sed 's/^/  /' SHA256SUMS

      - name: Is there an identity to attest with
        id: oidc
        # The token is injected by the runner, not by the workflow, so a step
        # condition cannot read it: the answer is turned into an output here.
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No build provenance::this run received no OIDC identity, so the packages are published without an attestation"
          fi

      - name: Build provenance
        # Keyless, against the identity of this workflow and recorded in the
        # public transparency log: "gh attestation verify <file> --repo
        # <this repository>" then answers where the file was built, from which
        # commit and by which run. There is no private key to steal, and the
        # GPG signature over SHA256SUMS stays beside it - one says who signed,
        # the other says what built.
        if: steps.oidc.outputs.available == 'true'
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.*
            dist/SHA256SUMS

      - uses: actions/upload-artifact@v4.4.3
        with:
          # Exactly what is published, nothing else: the staged binaries
          # and the build notes of the machine are not part of a release.
          name: dist
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.*
            dist/*.cdx.json
            dist/modules-*.txt
            dist/provenance.json
            dist/SHA256SUMS
            dist/SHA256SUMS.asc
          if-no-files-found: error

  sign:
    name: Sign and publish
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The protected environment is the point of this job. The build runner
    # that compiled the code never sees the signing key; this one sees the
    # key and, of the product, one packaging script it takes from the tag
    # itself rather than from the build job's hands - and the environment's
    # reviewers stand between a tag and a signature. An environment that
    # does not exist yet simply runs without the wait - configuring the
    # reviewers is the owner's step, and the split holds either way.
    environment: release-signing
    permissions:
      contents: write
    env:
      RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
      RELEASE_SIGNING_KEY_PASSPHRASE: ${{ secrets.RELEASE_SIGNING_KEY_PASSPHRASE }}
    steps:
      - uses: actions/download-artifact@v4.1.8
        with:
          name: dist
          path: dist

      - name: The checksums describe what arrived
        # The artefact travelled between two jobs. Before anything is signed,
        # every file is measured against the manifest it will be signed
        # under: a signature over a manifest nobody re-checked says only
        # that the manifest was signed.
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check --strict SHA256SUMS
          echo "every file matches the manifest"

      - name: Sign the checksums
        # One signature over SHA256SUMS covers every file of the release,
        # because every file's digest stands in it. The step runs only when
        # the repository already holds the signing key as a secret; the
        # workflow does not ask for a new one, and a release without a
        # signature is published unsigned rather than silently "signed" by
        # a key made up on the runner. The secret, when it exists, is the
        # armoured private key of the release identity.
        if: env.RELEASE_SIGNING_KEY != ''
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$RELEASE_SIGNING_KEY" | gpg --batch --quiet --import
          key="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')"
          gpg --batch --yes --pinentry-mode loopback \
            ${RELEASE_SIGNING_KEY_PASSPHRASE:+--passphrase "$RELEASE_SIGNING_KEY_PASSPHRASE"} \
            --local-user "$key" --armor --detach-sign --output dist/SHA256SUMS.asc dist/SHA256SUMS
          gpg --batch --quiet --delete-secret-and-public-key --yes "$key" || true
          rm -rf "$GNUPGHOME"

      - name: The channel this release belongs in
        id: channel
        # A pre-release goes to a channel of its own. "stable" is what the
        # panel writes into a host's command unless somebody typed otherwise,
        # so a v1.2.3-rc1 that landed there would be installed by every host
        # that only ever asked for the product.
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-*) channel=testing ;;
            *)   channel=stable ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$channel" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_REF_NAME publishes to the $channel channel"

      - name: Nothing unsigned is published
        # A repository whose index carries no signature is worse than none:
        # apt takes it with a warning and the host never learns. Without the
        # key there is simply no repository publication, and the release says
        # so rather than serving a tree nobody can verify.
        if: env.RELEASE_SIGNING_KEY == ''
        run: |
          {
            echo "### The package repository was not published"
            echo
            echo 'There is no `RELEASE_SIGNING_KEY` in the `release-signing` environment, so there was nothing to sign the repository indexes with. The release assets are attached as usual; the repository keeps the release before this one.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=No repository publication::the signing key is missing, so the repository keeps the previous release"

      - name: The tools the repositories are composed with
        if: env.RELEASE_SIGNING_KEY != ''
        # dpkg-dev writes the apt index, createrepo-c the dnf metadata, rpm
        # signs the .rpm files themselves, and repo-add - pacman's own tool,
        # packaged for Debian and Ubuntu as pacman-package-manager - writes
        # the pacman database. repo-add reads the packages with bsdtar, which
        # on Ubuntu is libarchive-tools and is not pulled in by pacman itself.
        #
        # makepkg is here for its shell libraries, not for building: repo-add
        # sources /usr/share/makepkg/util/*.sh and dies on the first line
        # without them. The build job needs the mirror of this - pacman beside
        # makepkg - so the two jobs want both packages for opposite reasons.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev rpm createrepo-c pacman-package-manager makepkg libarchive-tools

      - name: The script that composes them
        if: env.RELEASE_SIGNING_KEY != ''
        # One file of the product, taken from the tag being released rather
        # than from the job that built it: a script handed over by the build
        # job would be a way to reach the key this job holds.
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.ref }}
          path: source
          sparse-checkout: packaging/sign-repo.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: The repository as it stands today
        if: env.RELEASE_SIGNING_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        # The published tree is fetched before anything is added to it. A
        # publication that started from an empty directory would drop every
        # version the fleet has not upgraded from yet, and the next `apt
        # update` on such a host would find nothing it runs.
        run: |
          set -euo pipefail
          url="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          rm -rf pages
          if git clone --quiet --depth 1 --branch "$PAGES_BRANCH" "$url" pages; then
            echo "the repository carries $(find pages/packages -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.*' 2>/dev/null | wc -l) packages"
          else
            mkdir pages
            git -C pages init --quiet --initial-branch "$PAGES_BRANCH"
            git -C pages remote add origin "$url"
            echo "no $PAGES_BRANCH branch yet; this release starts it"
          fi

      - name: Compose and sign the repositories
        if: env.RELEASE_SIGNING_KEY != ''
        env:
          FLOTESTRO_CHANNEL: ${{ steps.channel.outputs.name }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$RELEASE_SIGNING_KEY" | gpg --batch --quiet --import
          key="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')"
          # rpmsign and repo-add call gpg themselves, so the passphrase cannot
          # travel on a command line. It goes into this run's own gpg
          # configuration, in the directory that is removed with the key.
          if [ -n "${RELEASE_SIGNING_KEY_PASSPHRASE:-}" ]; then
            ( umask 077; printf '%s' "$RELEASE_SIGNING_KEY_PASSPHRASE" > "$GNUPGHOME/passphrase" )
            printf '%s\n' "batch" "pinentry-mode loopback" \
              "passphrase-file $GNUPGHOME/passphrase" >> "$GNUPGHOME/gpg.conf"
            echo "allow-loopback-pinentry" >> "$GNUPGHOME/gpg-agent.conf"
            gpg-connect-agent reloadagent /bye >/dev/null
          fi
          # Under packages/, so the root of the site stays free for the
          # project's own pages.
          mkdir -p pages/packages
          bash source/packaging/sign-repo.sh dist "$key" pages/packages "${{ steps.channel.outputs.version }}"
          gpg --batch --quiet --delete-secret-and-public-key --yes "$key" || true
          rm -rf "$GNUPGHOME"

      - name: Every index carries a signature
        if: env.RELEASE_SIGNING_KEY != ''
        # What is about to be pushed is verified with nothing but the public
        # key that lies beside it - exactly what a host has. An index whose
        # signature does not check out stops the publication here, where it
        # is still a failed release rather than a fleet installing from a
        # tree nobody signed.
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          [ -s pages/packages/flotestro-repo.asc ] || { echo "the repository carries no public key" >&2; exit 1; }
          gpg --batch --quiet --import pages/packages/flotestro-repo.asc
          checked=0
          while read -r index; do
            gpg --batch --verify "$index" >/dev/null 2>&1 || \
              { echo "$index is not signed by the release key" >&2; exit 1; }
            checked=$((checked + 1))
          done < <(find pages/packages/deb/dists -name InRelease)
          while read -r signature; do
            gpg --batch --verify "$signature" "${signature%.asc}" >/dev/null 2>&1 || \
              { echo "${signature%.asc} is not signed by the release key" >&2; exit 1; }
            checked=$((checked + 1))
          done < <(find pages/packages/rpm -name repomd.xml.asc)
          while read -r signature; do
            gpg --batch --verify "$signature" "${signature%.sig}" >/dev/null 2>&1 || \
              { echo "${signature%.sig} is not signed by the release key" >&2; exit 1; }
            checked=$((checked + 1))
          done < <(find pages/packages/arch -name 'flotestro.db.tar.gz.sig')
          [ "$checked" -gt 0 ] || { echo "the release produced no repository index at all" >&2; exit 1; }
          echo "$checked indexes verify against flotestro-repo.asc"
          rm -rf "$GNUPGHOME"

      - name: Publish the repository
        if: env.RELEASE_SIGNING_KEY != ''
        # Jekyll would try to build the tree it is given; .nojekyll says to
        # serve it as it is. The commit is the publication: an unchanged tree
        # is a re-run of the same tag and there is nothing to say.
        run: |
          set -euo pipefail
          cd pages
          : > .nojekyll
          # The repository describes itself under packages/; the root of the
          # site belongs to the project and this release does not touch it.
          cat > packages/index.html <<'PAGE'
          <!doctype html>
          <meta charset="utf-8">
          <title>Flotestro packages</title>
          <h1>Flotestro packages</h1>
          <p>The signed apt, dnf and pacman repository the Flotestro fleet installs from.
          The panel writes the commands for a host under <em>Add host</em>; the key that
          signs every index is <a href="flotestro-repo.asc">flotestro-repo.asc</a>.</p>
          <p><a href="https://github.com/ultherego/Flotestro">github.com/ultherego/Flotestro</a></p>
          PAGE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "the repository already carries $GITHUB_REF_NAME; nothing to publish"
            exit 0
          fi
          git commit --quiet -m "Publish $GITHUB_REF_NAME to the ${{ steps.channel.outputs.name }} channel"
          git push --quiet origin "$PAGES_BRANCH"
          {
            echo "### The package repository"
            echo
            echo "\`$GITHUB_REF_NAME\` is in the \`${{ steps.channel.outputs.name }}\` channel of <https://ultherego.github.io/Flotestro/>."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: The release is not published twice
        # The check stands before the upload so that a re-run of a tag
        # stops here with the name of the file that already exists, rather
        # than half way through the upload with some assets replaced.
        env:
          GH_TOKEN: ${{ github.token }}
          # Without it gh cannot tell which repository it is looking at, and
          # its error reads here as "no release yet" - so the guard against
          # publishing a tag twice would pass by failing.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "no release for $tag yet; it will be created"
            exit 0
          fi
          existing="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          clash=""
          # The same list the upload publishes; the stage directories of
          # the build script stay out of it, they are not artefacts.
          for file in dist/*.deb dist/*.rpm dist/*.pkg.tar.* dist/*.cdx.json \
                      dist/modules-*.txt dist/provenance.json \
                      dist/SHA256SUMS dist/SHA256SUMS.asc; do
            [ -f "$file" ] || continue
            name="$(basename "$file")"
            if printf '%s\n' "$existing" | grep -qxF "$name"; then
              clash="$clash $name"
            fi
          done
          if [ -n "$clash" ]; then
            echo "the release $tag already carries:$clash" >&2
            echo "a published artefact is never replaced; build the correction under a new tag" >&2
            exit 1
          fi

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job checks out one script into source/ and nothing else, so
          # the working directory is not a git repository and gh has nothing
          # to read the repository name from. It is told instead.
          GH_REPO: ${{ github.repository }}
        # The release is created when the tag was pushed without one. The
        # upload carries no --clobber: an asset that is already there makes
        # this step fail, which is the intention.
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          assets=()
          for file in dist/*.deb dist/*.rpm dist/*.pkg.tar.* dist/*.cdx.json \
                      dist/modules-*.txt dist/provenance.json \
                      dist/SHA256SUMS dist/SHA256SUMS.asc; do
            [ -f "$file" ] && assets+=("$file")
          done
          gh release upload "$tag" "${assets[@]}"

  repository-image:
    name: The repository of an isolated site
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # The fourth image of the product, and the only one that cannot be built
    # from a checkout: it serves an already-signed package tree, so it can
    # only be made after the tree exists. compose.yaml names it under
    # --profile airgap, so without this job that profile pulls a manifest
    # nobody published.
    #
    # It is built here rather than in the signing job on purpose: this needs
    # a registry token and the signing job holds the release key. Neither
    # wants the other's credential.
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          path: source

      - name: The published tree this image serves
        env:
          GH_TOKEN: ${{ github.token }}
        # From the branch rather than from the signing job's working copy:
        # what an isolated site receives is what the connected world can see,
        # and a tree carried between jobs would be neither.
        run: |
          set -euo pipefail
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --quiet --depth 1 --branch "$PAGES_BRANCH" "$url" pages
          if [ ! -f pages/packages/flotestro-repo.asc ]; then
            echo "the branch carries no signed repository; the signing job publishes one only when it holds the key" >&2
            exit 1
          fi
          echo "the tree carries $(find pages/packages -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.*' | wc -l) packages"

      - uses: docker/setup-buildx-action@v3.7.1

      - uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flotestro-package-repository"
          tags="--tag $image:$version"
          # latest and the minor alias follow a finished release only, the
          # same rule the other three images keep.
          case "$version" in
          *-*) ;;
          *)   tags="$tags --tag $image:latest --tag $image:${version%.*}" ;;
          esac
          docker buildx build source \
            --file source/docker/Containerfile \
            --target package-repository \
            --build-context repository=pages/packages \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$version" \
            --build-arg COMMIT="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --provenance=true --sbom=true \
            $tags --push
