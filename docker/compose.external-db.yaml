# The deployment against a database somebody else runs. It is the default file
# with the postgres service taken out, so nothing is duplicated:
#
#   docker compose -f compose.yaml -f compose.external-db.yaml run --rm migrate
#   docker compose -f compose.yaml -f compose.external-db.yaml up -d
#
# On rootless podman the base is the other file, and this one needs nothing from
# the difference between them - its DSN names an address, which is the one thing a
# network namespace can still reach:
#
#   podman-compose -f compose.podman.yaml -f compose.external-db.yaml up -d
#
# Chosen before the installation is initialised: moving a live one to another
# database is a data migration, not a change of a variable.
#
# verify-full verifies the server's certificate, and the image carries the public
# bundle only: a database with an authority of its own - which is the usual case
# for a managed one - needs that authority as a file. Add it to both services
# below and name it in the DSN:
#
#   volumes:
#     - ./secrets/database-ca.crt:/run/secrets/database-ca.crt:ro
#
#   ...?sslmode=verify-full&sslrootcert=/run/secrets/database-ca.crt
#
services:
  # Not started here: the database is the installation's own.
  postgres:
    profiles: ["unused"]

  control-plane:
    environment:
      FLOTESTRO_DATABASE_MODE: external
      FLOTESTRO_DATABASE_URL_FILE: /run/secrets/database-url
      FLOTESTRO_AUTO_MIGRATE: "false"
    secrets:
      - database-url

  migrate:
    environment:
      FLOTESTRO_DATABASE_MODE: external
      FLOTESTRO_DATABASE_URL_FILE: /run/secrets/database-url
    secrets:
      - database-url

  # The pre-flight question asks the same database as the two above, so it gets
  # the same DSN; without this it would ask the quickstart one that is not there.
  schema-check:
    environment:
      FLOTESTRO_DATABASE_MODE: external
      FLOTESTRO_DATABASE_URL_FILE: /run/secrets/database-url
    secrets:
      - database-url

# The DSN carries the password, so it arrives as a file and not as a variable.
# external mode holds it to sslmode=verify-full and target_session_attrs=read-write,
# and verify-full needs the issuing authority: the image carries the public
# bundle only, so a database with its own CA is named with sslrootcert= and the
# file mounted above.
secrets:
  database-url:
    file: ./secrets/database-url
