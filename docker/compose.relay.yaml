# The relay of one site, on the site's own host.
#
#   docker compose -f compose.relay.yaml --profile enroll run --rm relay-enroll
#
# The image comes from the release manifest, pinned by digest; unset is an error
# rather than a floating tag nobody chose.
#   docker compose -f compose.relay.yaml up -d
name: flotestro-relay

services:
  relay:
    image: ${FLOTESTRO_RELAY_IMAGE:?set it to the image the release manifest names, pinned by digest}
    # A tag for readability; production pins the digest as well, and the
    # relay is upgraded from the same release as the panel it talks to.
    # "always" and not "unless-stopped": the unit rootless Podman ships to
    # replay the restart policies at boot starts only the containers whose
    # policy is "always", so anything else does not come back after a reboot.
    restart: always
    user: "65532:65532"
    # The default command of the image, written out because the path of the
    # configuration file is the one decision this service makes.
    command: ["run", "-config", "/etc/flotestro/relay.yaml"]

    volumes:
      # The configuration is a file and not an environment: the relay is a
      # separate trust boundary, with its own name, site and identity.
      - ./relay.yaml:/etc/flotestro/relay.yaml:ro
      # The fleet CA for the first connection: bootstrap_ca_file points here.
      # After the enrollment the relay uses the copy in its own state.
      - ./relay-ca.pem:/etc/flotestro/ca.pem:ro
      # The identity of the relay, its certificate and the durable spool -
      # the results of the site that the centre has not acknowledged yet.
      - relay_state:/var/lib/flotestro-relay

    ports:
      # The agents of the site connect here. The address must match a name in
      # advertised_names, because that name is in the relay certificate.
      - "8453:8453"

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    ulimits:
      nofile:
        soft: 65536
        hard: 131072
    # The spool is flushed and the agent sessions are ended rather than cut.
    stop_grace_period: 30s

    # The health check is the image's, and this is the address it asks about.
    # Liveness only: the listener of the site is up and accepts. A question
    # about the link to the centre would restart the relay over a WAN blip.
    #
    # It is not written here as a healthcheck: block any more. docker ran that
    # form directly, but podman-compose turns every form of it into CMD-SHELL
    # and hands it to /bin/sh, and this image has no shell - so under podman
    # the relay reported unhealthy for as long as it ran, twenty-five failed
    # checks with an empty output, while it carried the fleet. The image's own
    # check takes no arguments, so there is nothing for a compose tool to
    # rewrite.
    environment:
      FLOTESTRO_ADMIN_ADDR: 127.0.0.1:8454

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # The registration runs once, with a one-time token, and ends. The token
  # never enters the service above, which restarts and would keep it.
  relay-enroll:
    image: ${FLOTESTRO_RELAY_IMAGE:?set it to the image the release manifest names, pinned by digest}
    profiles: ["enroll"]
    user: "65532:65532"
    command: ["enroll", "-config", "/etc/flotestro/relay.yaml", "-token-file", "/run/secrets/relay_enrollment_token"]
    restart: "no"

    secrets:
      - relay_enrollment_token

    volumes:
      - ./relay.yaml:/etc/flotestro/relay.yaml:ro
      - ./relay-ca.pem:/etc/flotestro/ca.pem:ro
      - relay_state:/var/lib/flotestro-relay

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  relay_state:
    name: flotestro-relay-state

secrets:
  relay_enrollment_token:
    # Written before the enrollment and deleted after it: the token is a
    # one-time secret and this directory survives restarts and backups.
    file: ./secrets/relay-enrollment-token
