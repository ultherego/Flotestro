# The Flotestro control plane and what it is deployed with, in profiles.
#
#   docker compose up -d                                the whole default deployment
#   docker compose up -d                                with a database somebody else runs
#   docker compose --profile airgap up -d               plus the package repository of the release
#   podman-compose -f compose.podman.yaml up -d         rootless, and the fleet's
#                                                       own addresses reach it
#   docker compose --profile check run --rm schema-check    what the image would migrate
#   docker compose --profile tools run --rm admin-tools backup
#   docker compose --profile restore run --rm admin-restore restore <backup-id>
#
# The quickstart needs nothing prepared: this file alone brings up a panel and
# a database, and the init service below makes the secrets they share. Every
# setting has a working default; env.example lists all of them and names the
# three an installation for real hosts has to change.
#
# Nothing but the control plane starts unless its profile is named, so an
# installation pointed at an external database cannot quietly run a second
# beside it. Profiles combine: --profile tools --profile airgap.
name: flotestro

services:
  # Everything the deployment needs before it starts, so that nobody has to
  # run printf, mkdir, chown and chmod by hand and get the uid right.
  #
  # ./secrets/database-url wins when it exists: that is the database somebody
  # else runs. When it does not, a password for the quickstart database is
  # made here and never leaves the runtime.
  init:
    image: docker.io/library/busybox:1.37
    restart: "no"
    user: "0:0"

    environment:
      FLOTESTRO_DATABASE_MODE: ${FLOTESTRO_DATABASE_MODE:-quickstart}

    volumes:
      - shared_secrets:/run/flotestro
      # Read-only, and created empty by the runtime when it is not there.
      - ./secrets:/import:ro,z
      # The backup pair lands here, written by a container running as 65532.
      - ./backups:/backups:z

    command:
      - /bin/sh
      - -euc
      - |
        umask 077
        # The declared kind and what is actually there have to agree. An
        # installation that says it runs on somebody else's database and has no
        # DSN would otherwise get a generated one pointing at a local server,
        # and that address would then be the installation's for good.
        if [ "$${FLOTESTRO_DATABASE_MODE:-quickstart}" = external ] &&
           [ ! -f /import/database-url ] && [ ! -f /run/flotestro/database-url ]; then
          echo "FLOTESTRO_DATABASE_MODE=external and there is no ./secrets/database-url." >&2
          echo "Put the DSN of the database you run there, or drop the setting for a trial." >&2
          exit 1
        fi
        if [ "$${FLOTESTRO_DATABASE_MODE:-quickstart}" = quickstart ] && [ -f /import/database-url ]; then
          echo "a DSN was given in ./secrets/database-url while the mode is the quickstart:"
          echo "the DSN is used, and the local database is started only with its profile."
        fi
        if [ -f /import/database-url ]; then
          cp /import/database-url /run/flotestro/database-url
          # An installation that made its own files before this service
          # existed keeps them, password and all.
          [ -f /import/postgres-password ] &&
            cp /import/postgres-password /run/flotestro/postgres-password
          echo "the DSN was taken from ./secrets/database-url"
        elif [ ! -f /run/flotestro/database-url ]; then
          password="$$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          printf '%s' "$$password" > /run/flotestro/postgres-password
          printf 'postgresql://flotestro:%s@postgres:5432/flotestro?sslmode=disable' \
            "$$password" > /run/flotestro/database-url
          echo "no ./secrets/database-url was given, so the quickstart database got a"
          echo "password of its own. An installation on a database somebody else runs"
          echo "stops here, puts its DSN in ./secrets/database-url and starts again."
        fi
        # The key encryption key, when the installation keeps its private keys
        # in the database rather than in the state volume. It is copied rather
        # than bound so that it lands beside the other secrets with the same
        # owner and the same mode; the panel refuses a key file anybody else
        # could rewrite. Without it nothing changes: an installation whose keys
        # are still files never reads this path.
        # The key in use, and the one a rotation is moving to. The second is
        # there because crypto rewrap-kek has to read the new key from inside
        # the runtime, and nothing else can put a file there.
        for name in kek kek-next; do
          if [ -f "/import/$$name" ]; then
            cp "/import/$$name" "/run/flotestro/$$name"
            chmod 0400 "/run/flotestro/$$name"
            chown 65532:65532 "/run/flotestro/$$name"
            echo "the key encryption key was taken from ./secrets/$$name"
          fi
        done
        # The control plane and the tools run as 65532, PostgreSQL as 999, and
        # each reads only the file it needs.
        chmod 0400 /run/flotestro/database-url
        chown 65532:65532 /run/flotestro/database-url
        if [ -f /run/flotestro/postgres-password ]; then
          chmod 0400 /run/flotestro/postgres-password
          chown 999:999 /run/flotestro/postgres-password
        fi
        # The backup directory belongs to the account admin-tools writes as,
        # for the same reason and with the same one line.
        chmod 0700 /backups
        chown 65532:65532 /backups

    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true
    pids_limit: 32

    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

  # The migration as a run of its own. It is part of the default start and the
  # control plane waits for it to finish, so one "up" brings the schema forward
  # once and no serving replica ever reshapes it. An upgrade with more than one
  # replica runs it alone first, which is the same command:
  #
  #   docker compose -f compose.yaml -f compose.external-db.yaml run --rm migrate
  #
  # An installation that separates the database roles adds
  # FLOTESTRO_MIGRATION_DATABASE_URL_FILE here and mounts the migrator's own
  # DSN beside the serving one; without it this run uses the serving login,
  # which still takes the migration out of the serving process.
  migrate:
    image: ghcr.io/ultherego/flotestro-control-plane:${FLOTESTRO_VERSION:-latest}
    user: "65532:65532"
    command: ["migrate"]
    restart: "no"
    # Only init: the connection waits half a minute for a database that answers
    # and says so, so the graph needs no edge to one.
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      FLOTESTRO_DATABASE_URL_FILE: /run/flotestro/database-url
      FLOTESTRO_DATABASE_MODE: ${FLOTESTRO_DATABASE_MODE:-quickstart}
      FLOTESTRO_STATE_DIR: /var/lib/flotestro
    volumes:
      - shared_secrets:/run/flotestro:ro
      - control_plane_state:/var/lib/flotestro

    # The same two as the control plane, minus the edge: the migration talks to
    # the database and to nothing else, here or somewhere an operator runs.
    networks:
      - database
      - database_egress
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

  # The question an upgrade asks before it decides anything: does the image it
  # is about to start carry migrations for this database? The answer has to
  # cost nothing, so this service depends on no other and writes nothing - it
  # is the control plane's own schema-check and no more.
  #
  # It is a service of its own rather than a command of the control plane,
  # because "run" starts what the named service depends on: asking
  # control-plane would run the migration the question is about, and answer
  # that nothing needs migrating. --no-deps does not save it either -
  # podman-compose puts the dependency on the one-off container itself with
  # --requires, and podman starts it.
  #
  #   docker compose --profile check run --rm schema-check
  #
  # Exit 0 is a schema this image matches, exit 1 with schema_behind names how
  # many migrations it carries, and the profile keeps it out of an ordinary up.
  schema-check:
    profiles: ["check"]
    image: ghcr.io/ultherego/flotestro-control-plane:${FLOTESTRO_VERSION:-latest}
    user: "65532:65532"
    command: ["schema-check"]
    restart: "no"

    environment:
      FLOTESTRO_DATABASE_URL_FILE: /run/flotestro/database-url
      FLOTESTRO_DATABASE_MODE: ${FLOTESTRO_DATABASE_MODE:-quickstart}
      FLOTESTRO_STATE_DIR: /var/lib/flotestro

    volumes:
      - shared_secrets:/run/flotestro:ro
      # Read-only, because a question about the schema has no business in the
      # state the fleet depends on.
      - control_plane_state:/var/lib/flotestro:ro

    networks:
      - database
      - database_egress
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

  control-plane:
    # A tag is readable and is what an example shows. Production pins the
    # digest as well - image:tag@sha256:... - because a tag can be moved.
    image: ghcr.io/ultherego/flotestro-control-plane:${FLOTESTRO_VERSION:-latest}
    # "always" and not "unless-stopped": rootless Podman replays the restart
    # policies at boot with the unit it ships, and that unit starts only the
    # containers whose policy is "always". A deployment that said
    # unless-stopped would simply not come back after a reboot of the host.
    restart: always
    user: "65532:65532"

    environment:
      #==================================================================#
      #                             DATABASE                             #
      #==================================================================#
      # The DSN is a secret and travels as a file, never as a value: an
      # environment variable is visible in "docker inspect" and in a crash dump.
      FLOTESTRO_DATABASE_URL_FILE: /run/flotestro/database-url
      # Which kind of database this is, declared rather than guessed. quickstart
      # is the database this deployment starts itself, on one host and an
      # internal network. external is a database somebody else runs, and the
      # panel then refuses a DSN that does not verify the server or does not
      # promise a writer.
      FLOTESTRO_DATABASE_MODE: ${FLOTESTRO_DATABASE_MODE:-quickstart}
      # Whether this process brings the schema up to date at its own start.
      # A trial keeps it on: an installation somebody has just downloaded is to
      # come up on the first "up" with nothing else asked of them. An
      # installation on a database somebody else runs turns it off in ./.env and
      # migrates with the run below, so that the login the panel serves as never
      # needs the right to change the schema - see db/roles.sql. With it off the
      # panel refuses to start on a schema it does not match rather than
      # quietly reshaping the database.
      # The migrate service does it, so no serving replica reshapes the schema.
      FLOTESTRO_AUTO_MIGRATE: ${FLOTESTRO_AUTO_MIGRATE:-false}
      #==================================================================#
      #                              PATHS                               #
      #==================================================================#
      # The state directory and the panel are set in the image already; they
      # stand here too so that the deployment can be read in one place.
      FLOTESTRO_STATE_DIR: /var/lib/flotestro
      FLOTESTRO_WEB_ROOT: /usr/share/flotestro/web
      #==================================================================#
      #                            LISTENERS                             #
      #==================================================================#
      # Every listener binds to every address inside the container; which of
      # them is reachable is decided by the published ports below.
      FLOTESTRO_ADMIN_ADDR: 0.0.0.0:8080
      FLOTESTRO_GATEWAY_ADDR: 0.0.0.0:8443
      FLOTESTRO_ENROLLMENT_ADDR: 0.0.0.0:8444
      # The name of this gateway, and the name a second replica must not
      # repeat. The container's own hostname is random, so it cannot serve.
      FLOTESTRO_GATEWAY_ID: ${FLOTESTRO_GATEWAY_ID:-cp-01}

      #==================================================================#
      #              INTEGRATIONS, IF THE COMPANY HAS THEM               #
      #==================================================================#
      #
      # The panel reads fourteen variables for these two integrations and this
      # file passed none of them, so a deployment made the documented way could
      # not be connected to Keycloak or FreeIPA at all: the keys went into ./.env
      # and stopped there, because compose substitutes ${...} from that file and
      # does not hand it to a container. Nothing broke loudly - the panel simply
      # served without single sign-on and without a directory, and an operator who
      # had filled in ./.env had no reason to suspect otherwise.
      #
      # All of them are optional and empty by default: an installation with no
      # identity provider is a finished installation. Partial configuration is
      # refused by name at start rather than half-applied.
      #==================================================================#
      #                      OIDC - SINGLE SIGN-ON                       #
      #==================================================================#
      FLOTESTRO_OIDC_ISSUER: ${FLOTESTRO_OIDC_ISSUER:-}
      FLOTESTRO_OIDC_CLIENT_ID: ${FLOTESTRO_OIDC_CLIENT_ID:-}
      FLOTESTRO_OIDC_GROUPS_CLAIM: ${FLOTESTRO_OIDC_GROUPS_CLAIM:-}
      FLOTESTRO_OIDC_ADMIN_LOGOUT: ${FLOTESTRO_OIDC_ADMIN_LOGOUT:-}
      # The client secret travels as a path, never as a value - the same rule the
      # DSN above follows. Setting both forms is refused: "a secret comes either
      # from the environment or from a file, never from both".
      FLOTESTRO_OIDC_CLIENT_SECRET_FILE: ${FLOTESTRO_OIDC_CLIENT_SECRET_FILE:-}
      #==================================================================#
      #                     FREEIPA - THE DIRECTORY                      #
      #==================================================================#
      # _URL and _SERVER are one setting with two names, and the code prefers
      # _URL. Both are passed, or whichever of them an operator wrote in ./.env
      # would be the inert one.
      FLOTESTRO_IPA_URL: ${FLOTESTRO_IPA_URL:-}
      FLOTESTRO_IPA_SERVER: ${FLOTESTRO_IPA_SERVER:-}
      FLOTESTRO_IPA_REALM: ${FLOTESTRO_IPA_REALM:-}
      FLOTESTRO_IPA_PRINCIPAL: ${FLOTESTRO_IPA_PRINCIPAL:-}
      # Three files of the connector. They stay files: the panel hands their
      # paths to a library rather than reading the bytes. Mount them under
      # ./integration and name them here with the path inside the container.
      FLOTESTRO_IPA_KEYTAB: ${FLOTESTRO_IPA_KEYTAB:-}
      FLOTESTRO_IPA_KRB5_CONF: ${FLOTESTRO_IPA_KRB5_CONF:-}
      FLOTESTRO_IPA_CA_CERT: ${FLOTESTRO_IPA_CA_CERT:-}
      # Whether the panel may change the directory or only read it.
      FLOTESTRO_DIRECTORY_WRITE: ${FLOTESTRO_DIRECTORY_WRITE:-}
      # Diagnostic only, and loud about what it costs: the trace copies what the
      # panel sends to the directory, so it is off unless somebody is reading it.
      FLOTESTRO_IPA_TRACE: ${FLOTESTRO_IPA_TRACE:-}
      # A mutating task leaves the panel only with a signed capability for exactly
      # that change, which is what the panel does with no value here. No default is
      # written in: podman-compose passes a ${VAR:-default} through as the literal
      # text and the panel would refuse to start on it. A fleet that predates the
      # capability sets prefer in ./.env, and the panel names the hosts still on it.
      FLOTESTRO_HELPER_CAPABILITY_MODE:
      # The addresses the fleet reaches the panel at. They enter the certificate
      # of the agent gateway, so they are public names, not the container's.
      # The default serves a trial on this machine; no remote host can enrol
      # against it, and the panel refuses such an enrollment rather than
      # issuing a certificate that would not match. Change it for a real fleet.
      FLOTESTRO_ADVERTISE: ${FLOTESTRO_ADVERTISE:-127.0.0.1}
      # The address the operator sees. The OIDC redirect and the Secure flag
      # of the session cookies follow from it.
      FLOTESTRO_PUBLIC_URL: ${FLOTESTRO_PUBLIC_URL:-http://localhost:8080}
      # Where the key encryption key is mounted, for an installation that has
      # moved its private keys into the database. The path is read only once
      # the installation record names a key; the key itself never travels in
      # the environment. See docs/runbooks/key-encryption-key.md.
      FLOTESTRO_KEK_FILE: /run/flotestro/kek
      # Where a rotation puts the key it is moving to. The panel uses whichever
      # of the two the installation record names, so neither order of the steps
      # - rewrap first, move the file first - leaves a replica unable to start.
      FLOTESTRO_KEK_NEXT_FILE: /run/flotestro/kek-next
      # Optional and non-secret, empty unless ./.env says otherwise: the address
      # the hosts reach the repository at, and the NVD an isolated site clears.
      FLOTESTRO_PACKAGE_REPOSITORY_URL: ${FLOTESTRO_PACKAGE_REPOSITORY_URL-}
      # No value: passed through only when the host environment sets it, so an
      # unset variable is unset in the container and not an empty one.
      FLOTESTRO_VULN_NVD_URL:

    volumes:
      # Written by init, read-only here and owned by this container's account.
      - shared_secrets:/run/flotestro:ro
      # The state: the fleet CA, the secret store keys, the helper signing key,
      # the bootstrap token and the feed cache. Losing it loses the fleet.
      - control_plane_state:/var/lib/flotestro
      # The files of the two integrations, when a company has them; the image
      # carries none of them. Uncomment what applies and name the same paths in
      # ./.env - a path the panel is not told about is a file it never opens.
      # A bind mount whose source does not exist becomes a directory, which is
      # why these are commented rather than left pointing at nothing.
      #
      #   FLOTESTRO_IPA_KEYTAB=/run/secrets/ipa.keytab
      # - ./secrets/ipa.keytab:/run/secrets/ipa.keytab:ro
      #   FLOTESTRO_IPA_KRB5_CONF=/etc/flotestro/krb5.conf
      # - ./secrets/krb5.conf:/etc/flotestro/krb5.conf:ro
      #   FLOTESTRO_IPA_CA_CERT=/run/secrets/ipa-ca.crt
      # - ./secrets/ipa-ca.crt:/run/secrets/ipa-ca.crt:ro
      #   FLOTESTRO_OIDC_CLIENT_SECRET_FILE=/run/secrets/oidc-client-secret
      # - ./secrets/oidc-client-secret:/run/secrets/oidc-client-secret:ro
      # Vulnerability feeds copied onto an isolated site, read-only and outside
      # the state, which is one half of the backup pair - see README.md:
      # - ./feeds:/var/lib/flotestro-feeds:ro

    ports:
      # Every address of this host by default: the first-run screen is opened
      # from another machine. Narrow it here once a proxy stands in front.
      - "${FLOTESTRO_API_PUBLISH:-0.0.0.0}:8080:8080"
      # The agent gateway (mTLS) and the enrollment (TLS) are reached directly
      # or through an L4 balancer: the panel terminates their TLS itself.
      - "8443:8443"
      - "8444:8444"

    networks:
      - application
      - database_egress
      - database

    # The panel waits for a database that answers, not for a container that
    # exists, and says so while it waits - so nothing depends on postgres here.
    # init makes the file the DSN is read from; migrate settles the schema first.
    depends_on:
      init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

    # The process writes to its state volume and to /tmp, and nowhere else.
    # mode 1777 rather than uid/gid, because every runtime honours it.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    ulimits:
      nofile:
        soft: 65536
        hard: 131072
    # A stop is a chance to finish what is in flight: the gateway ends the
    # agent sessions and the workers release their leases.
    stop_grace_period: 30s

    healthcheck:
      # The image carries no curl and no shell; this is the static client from
      # cmd/container-healthcheck. It asks /healthz, which is liveness: a
      # database that stopped answering is not a reason to restart the panel.
      # An orchestrator that wants readiness asks /readyz.
      test: ["CMD", "/usr/local/bin/flotestro-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 4
      # The first start checks the schema, verifies the cryptographic state of
      # the installation and only then listens; the window covers it.
      start_period: 60s

    logging:
      # json-file rather than Docker's local: every runtime reads it, and
      # Podman refuses local outright. Rotation is the same either way.
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  postgres:
    # The default database. An installation with its own starts from
    # compose.external-db.yaml, and that is chosen before it is initialised.
    # A major version is not changed by swapping the tag: that is pg_upgrade.
    image: docker.io/library/postgres:17-bookworm
    # "always" and not "unless-stopped": rootless Podman replays the restart
    # policies at boot with the unit it ships, and that unit starts only the
    # containers whose policy is "always". A deployment that said
    # unless-stopped would simply not come back after a reboot of the host.
    restart: always

    environment:
      POSTGRES_DB: flotestro
      POSTGRES_USER: flotestro
      # The password as a file, like every other secret here.
      POSTGRES_PASSWORD_FILE: /run/flotestro/postgres-password

    depends_on:
      init:
        condition: service_completed_successfully

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - shared_secrets:/run/flotestro:ro

    networks:
      - database

    # No port is published: reachable from this deployment and nowhere else.
    shm_size: 256m
    # A database killed mid-checkpoint comes back into recovery.
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flotestro -d flotestro"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # The package repository of the release, for a site with no route out. It
  # holds no secret and answers GET and HEAD for one already-signed directory.
  package-repository:
    profiles: ["airgap"]
    # The reference keeps the registry it was built under although the site
    # cannot reach it: "docker load" restores the image under exactly that name.
    image: ghcr.io/ultherego/flotestro-package-repository:${FLOTESTRO_VERSION:-latest}
    # "always" and not "unless-stopped": rootless Podman replays the restart
    # policies at boot with the unit it ships, and that unit starts only the
    # containers whose policy is "always". A deployment that said
    # unless-stopped would simply not come back after a reboot of the host.
    restart: always
    user: "65532:65532"

    ports:
      # The fleet fetches over plain HTTP, and that is not a weakness here:
      # what a package manager trusts is the signature in the tree.
      - "8090:8080"

    networks:
      - application

    # Nothing is written, not even a temporary file, so there is no tmpfs
    # either: the tree is in the image layer and the process only reads it.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    # A download in flight is finished rather than cut.
    stop_grace_period: 30s

    healthcheck:
      # The same static client as the other images; the server answers
      # /healthz and refuses to start at all without flotestro-repo.asc.
      test: ["CMD", "/usr/local/bin/flotestro-healthcheck", "-addr", "127.0.0.1:8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Taking the backup pair. The state is read-only here: this service never
  # writes into the identity of the installation.
  admin-tools:
    profiles: ["tools"]
    image: ghcr.io/ultherego/flotestro-admin-tools:${FLOTESTRO_VERSION:-latest}
    restart: "no"
    user: "65532:65532"

    environment:
      # The same DSN the control plane uses, from the same file. The tool takes
      # the password out of it before it runs anything.
      FLOTESTRO_DATABASE_URL_FILE: /run/flotestro/database-url
      FLOTESTRO_STATE_DIR: /state
      FLOTESTRO_BACKUP_DIR: /backups
      # The digest this deployment pins, so that the manifest of a backup can
      # name the image the backup was taken with.
      FLOTESTRO_IMAGE_DIGEST: ${FLOTESTRO_TOOLS_DIGEST:-}

    volumes:
      - shared_secrets:/run/flotestro:ro
      # The state of the control plane, read-only: the CA, the keys of the
      # secret store, the bootstrap token. Half of the backup pair.
      - control_plane_state:/state:ro
      # The other half lands here, in a directory named after the backup.
      - ./backups:/backups

    networks:
      # Both are named because the database of the quick start is on the
      # internal one and an external database is reached through the other.
      database_egress:
        priority: 100
      database:
        priority: 10

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Putting the pair back. The same image and the same tool; what differs is
  # that the state is writable and the backups are not.
  admin-restore:
    profiles: ["restore"]
    image: ghcr.io/ultherego/flotestro-admin-tools:${FLOTESTRO_VERSION:-latest}
    restart: "no"
    user: "65532:65532"

    environment:
      FLOTESTRO_DATABASE_URL_FILE: /run/flotestro/database-url
      FLOTESTRO_STATE_DIR: /state
      FLOTESTRO_BACKUP_DIR: /backups
      FLOTESTRO_IMAGE_DIGEST: ${FLOTESTRO_TOOLS_DIGEST:-}

    volumes:
      - shared_secrets:/run/flotestro:ro
      # Read-write, and the tool refuses to write into a state that is not
      # empty: a restore puts an installation back where there is none.
      - control_plane_state:/state
      # The backup is the source here and is mounted read-only, so a restore
      # cannot damage the thing it is restoring from.
      - ./backups:/backups:ro

    networks:
      database_egress:
        priority: 100
      database:
        priority: 10

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  # The panel and the edge.
  application:
  # The quickstart database: no route out, and none in from outside.
  database:
    internal: true
  # The way out to an external database, kept separate so that the rule which
  # lets the control plane reach PostgreSQL is one an operator can see.
  database_egress:

volumes:
  control_plane_state:
    name: flotestro-state
  postgres_data:
    name: flotestro-postgres
  # The DSN and the database password. A volume rather than files next to this
  # one: nothing has to be created, owned or protected by hand, and a secret
  # that never leaves the runtime cannot be committed by accident.
  shared_secrets:
    name: flotestro-secrets
